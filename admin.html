        // ========== 商場指南式搖桿控制邏輯 ==========
        let joyUserScale = 1.0;
        let joyOffsetX = 0;
        let joyOffsetY = 0;
        let isDraggingJoystick = false;
        let dragStartPointerX = 0;
        let dragStartPointerY = 0;
        let dragStartOffsetX = 0;
        let dragStartOffsetY = 0;
        let hasStartedWardNavigationFromTGF = false;

        function computeResponsiveJoystickScale() {
            const mapWrapper = document.getElementById('mapWrapper');
            const wrapperWidth = mapWrapper ? mapWrapper.clientWidth : window.innerWidth;
            const autoFactor = Math.max(0.55, Math.min(1.0, wrapperWidth / 640));
            return parseFloat((autoFactor * joyUserScale).toFixed(2));
        }

        function applyJoystickTransform() {
            const pad = document.getElementById('kioskJoystick');
            if (!pad) return;
            const finalScale = computeResponsiveJoystickScale();
            pad.style.transform = `translate3d(${joyOffsetX}px, ${joyOffsetY}px, 0) scale(${finalScale})`;
        }

        function adjustJoystickScale(delta) {
            joyUserScale = Math.max(0.5, Math.min(1.45, parseFloat((joyUserScale + delta).toFixed(2))));
            applyJoystickTransform();
        }

        function resetJoystickTransform() {
            joyUserScale = 1.0;
            joyOffsetX = 0;
            joyOffsetY = 0;
            applyJoystickTransform();
        }

        function initJoystickInteractions() {
            const pad = document.getElementById('kioskJoystick');
            const handle = document.getElementById('joystickDragHandle');
            if (!pad || !handle) return;

            handle.addEventListener('pointerdown', (e) => {
                if (e.button !== undefined && e.button !== 0 && e.pointerType === 'mouse') return;
                e.stopPropagation();
                isDraggingJoystick = true;
                dragStartPointerX = e.clientX;
                dragStartPointerY = e.clientY;
                dragStartOffsetX = joyOffsetX;
                dragStartOffsetY = joyOffsetY;
                try { handle.setPointerCapture(e.pointerId); } catch (_) {}
            });

            handle.addEventListener('pointermove', (e) => {
                if (!isDraggingJoystick) return;
                e.stopPropagation();
                const dx = e.clientX - dragStartPointerX;
                const dy = e.clientY - dragStartPointerY;

                const mapWrapper = document.getElementById('mapWrapper');
                const maxX = mapWrapper ? Math.max(20, mapWrapper.clientWidth - 90) : 400;
                const maxY = mapWrapper ? Math.max(20, mapWrapper.clientHeight - 90) : 400;

                joyOffsetX = Math.max(-60, Math.min(maxX, dragStartOffsetX + dx));
                joyOffsetY = Math.max(-maxY, Math.min(60, dragStartOffsetY + dy));
                applyJoystickTransform();
            });

            const stopDrag = (e) => {
                if (!isDraggingJoystick) return;
                isDraggingJoystick = false;
                try { handle.releasePointerCapture(e.pointerId); } catch (_) {}
            };

            handle.addEventListener('pointerup', stopDrag);
            handle.addEventListener('pointercancel', stopDrag);
            applyJoystickTransform();
        }

        function normalizeJoyKey(val) {
            return String(val || '').trim().toLowerCase().replace(/[^a-z0-9]/g, '');
        }

        function parseFloorOrderRank(floorStr) {
            const s = String(floorStr || '').trim().toUpperCase();
            if (!s) return 999;
            if (s.includes('B2') || s === '-2' || s === '2/F B') return -20;
            if (s.includes('B1') || s === '-1' || s === '1/F B') return -10;
            if (s === 'G/F' || s === 'GF' || s === 'G') return 0;
            const m = s.match(/(\d+)\s*\/\s*F/) || s.match(/^(\d+)F?$/);
            if (m) return parseInt(m[1], 10);
            if (s.includes('SYSTEM')) return 500;
            return 200;
        }

        function getOrderedBlockList() {
            const blockSelect = document.getElementById('blockSelect');
            const rawBlocks = blockSelect
                ? Array.from(blockSelect.options).map(o => o.value).filter(v => v && v.trim() !== '')
                : [...new Set((floorHierarchyData || []).map(h => h.block).filter(Boolean))];

            const priorityOrder = [
                { keys: ['t', 'tblock'], rank: 1 },
                { keys: ['m', 'mainblock', 'mblock'], rank: 2 },
                { keys: ['annex', 'annexbuilding'], rank: 3 },
                { keys: ['system', 'sys'], rank: 4 }
            ];

            function getBlockRank(b) {
                const nb = normalizeJoyKey(b);
                for (const item of priorityOrder) {
                    if (item.keys.some(k => nb === k || nb.includes(k))) {
                        return item.rank;
                    }
                }
                return 99;
            }

            return [...new Set(rawBlocks)].sort((a, b) => {
                const ra = getBlockRank(a);
                const rb = getBlockRank(b);
                if (ra !== rb) return ra - rb;
                return String(a).localeCompare(String(b));
            });
        }

        function getOrderedFloorsForBlock(blockVal) {
            const targetBlock = String(blockVal || '').trim();
            if (!targetBlock) return [];

            const items = (floorHierarchyData || []).filter(
                h => String(h.block || '').trim().toLowerCase() === targetBlock.toLowerCase() && h.floor
            );
            const floors = [...new Set(items.map(h => String(h.floor).trim()))];

            const nb = normalizeJoyKey(targetBlock);
            const explicitSeq = nb.startsWith('t')
                ? ['G/F', '1/F', '2/F', '3/F', '4/F', '5/F']
                : (nb.startsWith('m') || nb.includes('main'))
                    ? ['G/F', '1/F', '2/F', '3/F', '4/F']
                    : null;

            return floors.sort((a, b) => {
                const ua = a.toUpperCase();
                const ub = b.toUpperCase();
                if (explicitSeq) {
                    const ia = explicitSeq.indexOf(ua);
                    const ib = explicitSeq.indexOf(ub);
                    if (ia !== -1 && ib !== -1) return ia - ib;
                    if (ia !== -1) return -1;
                    if (ib !== -1) return 1;
                }
                const ra = parseFloorOrderRank(ua);
                const rb = parseFloorOrderRank(ub);
                if (ra !== rb) return ra - rb;
                return ua.localeCompare(ub, undefined, { numeric: true });
            });
        }

        function getOrderedWardsForBlockFloor(blockVal, floorVal) {
            const bKey = String(blockVal || '').trim().toLowerCase();
            const fKey = String(floorVal || '').trim().toLowerCase();
            return (floorHierarchyData || [])
                .filter(h =>
                    String(h.block || '').trim().toLowerCase() === bKey &&
                    String(h.floor || '').trim().toLowerCase() === fKey &&
                    h.wardKey
                )
                .map(h => String(h.wardKey).trim());
        }

        function buildGlobalNavigationSlots() {
            const slots = [];
            const orderedBlocks = getOrderedBlockList();

            orderedBlocks.forEach(blk => {
                const floors = getOrderedFloorsForBlock(blk);
                floors.forEach(flr => {
                    const wards = getOrderedWardsForBlockFloor(blk, flr);
                    if (wards.length > 0) {
                        wards.forEach(wKey => {
                            slots.push({ block: blk, floor: flr, ward: wKey });
                        });
                    } else {
                        slots.push({ block: blk, floor: flr, ward: '' });
                    }
                });
            });

            return slots;
        }

        function getTBlockGFStartSlot(slots) {
            const list = Array.isArray(slots) && slots.length > 0 ? slots : buildGlobalNavigationSlots();
            if (list.length === 0) return null;

            const tGF = list.find(s => {
                const nb = normalizeJoyKey(s.block);
                const nf = normalizeJoyKey(s.floor);
                return nb.startsWith('t') && (nf === 'gf' || nf === 'g');
            });
            if (tGF) return tGF;

            const tAny = list.find(s => normalizeJoyKey(s.block).startsWith('t'));
            return tAny || list[0];
        }

        function applyNavigationSlot(slot) {
            if (!slot) return;
            const blockSelect = document.getElementById('blockSelect');
            const floorSelect = document.getElementById('floorSelect');
            const wardSelect = document.getElementById('wardSelect');
            if (!blockSelect || !floorSelect || !wardSelect) return;

            blockSelect.value = slot.block || '';
            onBlockChange();

            if (slot.floor) {
                const fOpt = Array.from(floorSelect.options).find(
                    o => String(o.value || '').trim().toLowerCase() === String(slot.floor).trim().toLowerCase()
                );
                floorSelect.value = fOpt ? fOpt.value : slot.floor;
                onFloorChange();
            }

            if (slot.ward) {
                const wOpt = Array.from(wardSelect.options).find(
                    o => String(o.value || '').trim().toLowerCase() === String(slot.ward).trim().toLowerCase()
                );
                wardSelect.value = wOpt ? wOpt.value : slot.ward;
                onWardChange();
            } else if (wardSelect.options.length > 1) {
                wardSelect.selectedIndex = 1;
                onWardChange();
            }

            updateJoystickUI();
        }

        function resolveMatchingBlockValue(quadKey) {
            const orderedBlocks = getOrderedBlockList();
            const q = normalizeJoyKey(quadKey);
            if (!q) return '';

            if (q === 't' || q === 'tblock') {
                return orderedBlocks.find(b => {
                    const nb = normalizeJoyKey(b);
                    return nb === 't' || nb === 'tblock' || nb.startsWith('t');
                }) || '';
            }
            if (q === 'm' || q === 'mblock' || q === 'mainblock') {
                return orderedBlocks.find(b => {
                    const nb = normalizeJoyKey(b);
                    return nb === 'm' || nb === 'mblock' || nb.includes('main') || nb.startsWith('m');
                }) || '';
            }
            if (q === 'annex' || q === 'annexbuilding') {
                return orderedBlocks.find(b => normalizeJoyKey(b).includes('annex')) || '';
            }
            if (q === 'system' || q === 'sys') {
                return orderedBlocks.find(b => normalizeJoyKey(b).includes('sys')) || '';
            }

            return orderedBlocks.find(b => normalizeJoyKey(b) === q)
                || orderedBlocks.find(b => normalizeJoyKey(b).includes(q) || q.includes(normalizeJoyKey(b)))
                || '';
        }

        function getCurrentWardNameOnly() {
            const wardSelect = document.getElementById('wardSelect');
            const wardVal = wardSelect?.value || '';
            if (!wardVal) return '';

            const matchedH = (floorHierarchyData || []).find(
                h => String(h.wardKey || '').trim().toLowerCase() === String(wardVal).trim().toLowerCase()
            );
            if (matchedH && matchedH.wardName) {
                return String(matchedH.wardName).trim();
            }

            if (wardSelect && wardSelect.selectedIndex >= 0) {
                const rawOptText = String(wardSelect.options[wardSelect.selectedIndex]?.text || '').trim();
                const cleaned = rawOptText.replace(/\s*\([^)]*\)\s*$/, '').trim();
                if (cleaned) return cleaned;
            }
            return wardVal;
        }

        function updateJoystickUI() {
            const blockVal = document.getElementById('blockSelect')?.value || '';
            const floorVal = document.getElementById('floorSelect')?.value || '';
            const wardNameOnly = getCurrentWardNameOnly();

            const statusEl = document.getElementById('joystickStatusLabel');
            const centerEl = document.getElementById('joystickCenterBadge');
            const upEl = document.getElementById('joystickFloorUpText');
            const downEl = document.getElementById('joystickFloorDownText');

            if (statusEl) {
                const labelText = wardNameOnly || '尚未選擇單位';
                statusEl.innerHTML = `<i class="fa-solid fa-grip-dots-vertical text-indigo-500 mr-1 text-[10px]"></i>${labelText}`;
                statusEl.title = labelText;
            }

            if (centerEl) {
                if (!blockVal) {
                    centerEl.innerText = '棟';
                } else {
                    const nb = normalizeJoyKey(blockVal);
                    if (nb.startsWith('t')) centerEl.innerText = 'T';
                    else if (nb.startsWith('m') || nb.includes('main')) centerEl.innerText = 'M';
                    else if (nb.includes('annex')) centerEl.innerText = 'ANX';
                    else if (nb.includes('sys')) centerEl.innerText = 'SYS';
                    else centerEl.innerText = blockVal.slice(0, 3).toUpperCase();
                }
            }

            if (upEl) upEl.innerText = floorVal ? `Floor ▲ (${floorVal})` : 'Floor ▲';
            if (downEl) downEl.innerText = floorVal ? `Floor ▼ (${floorVal})` : 'Floor ▼';

            const quadThemeMap = {
                T: {
                    idle: ['bg-sky-50/95', 'hover:bg-sky-100'],
                    active: ['bg-sky-600', 'hover:bg-sky-600', 'ring-1', 'ring-inset', 'ring-sky-300'],
                    mainIdle: ['text-sky-900'],
                    mainActive: ['text-white'],
                    subIdle: ['text-sky-700/85'],
                    subActive: ['text-sky-100']
                },
                M: {
                    idle: ['bg-indigo-50/95', 'hover:bg-indigo-100'],
                    active: ['bg-indigo-600', 'hover:bg-indigo-600', 'ring-1', 'ring-inset', 'ring-indigo-300'],
                    mainIdle: ['text-indigo-900'],
                    mainActive: ['text-white'],
                    subIdle: ['text-indigo-700/85'],
                    subActive: ['text-indigo-100']
                },
                ANNEX: {
                    idle: ['bg-amber-50/95', 'hover:bg-amber-100'],
                    active: ['bg-amber-600', 'hover:bg-amber-600', 'ring-1', 'ring-inset', 'ring-amber-300'],
                    mainIdle: ['text-amber-900'],
                    mainActive: ['text-white'],
                    subIdle: ['text-amber-700/85'],
                    subActive: ['text-amber-100']
                },
                SYSTEM: {
                    idle: ['bg-purple-50/95', 'hover:bg-purple-100'],
                    active: ['bg-purple-600', 'hover:bg-purple-600', 'ring-1', 'ring-inset', 'ring-purple-300'],
                    mainIdle: ['text-purple-900'],
                    mainActive: ['text-white'],
                    subIdle: ['text-purple-700/85'],
                    subActive: ['text-purple-100']
                }
            };

            document.querySelectorAll('.joy-block-quad').forEach(btn => {
                const quadKey = String(btn.getAttribute('data-joy-block') || '').toUpperCase();
                const theme = quadThemeMap[quadKey] || quadThemeMap.T;
                const allThemeClasses = [
                    ...theme.idle, ...theme.active,
                    ...theme.mainIdle, ...theme.mainActive,
                    ...theme.subIdle, ...theme.subActive
                ];
                btn.classList.remove(...allThemeClasses);

                const mainLabel = btn.querySelector('.joy-main-label');
                const subLabel = btn.querySelector('.joy-sub-label');
                if (mainLabel) mainLabel.classList.remove(...theme.mainIdle, ...theme.mainActive);
                if (subLabel) subLabel.classList.remove(...theme.subIdle, ...theme.subActive);

                const resolved = resolveMatchingBlockValue(quadKey);
                const isActive = Boolean(resolved && blockVal && resolved.toLowerCase() === blockVal.toLowerCase());

                if (isActive) {
                    btn.classList.add(...theme.active);
                    if (mainLabel) mainLabel.classList.add(...theme.mainActive);
                    if (subLabel) subLabel.classList.add(...theme.subActive);
                } else {
                    btn.classList.add(...theme.idle);
                    if (mainLabel) mainLabel.classList.add(...theme.mainIdle);
                    if (subLabel) subLabel.classList.add(...theme.subIdle);
                }
            });

            applyJoystickTransform();
        }

        function selectJoystickBlock(quadKey) {
            const matchedBlock = resolveMatchingBlockValue(quadKey);
            if (!matchedBlock) {
                alert(`找不到對應的棟別：${quadKey}`);
                return;
            }

            hasStartedWardNavigationFromTGF = true;
            const floors = getOrderedFloorsForBlock(matchedBlock);
            const firstFloor = floors[0] || '';
            const wards = firstFloor ? getOrderedWardsForBlockFloor(matchedBlock, firstFloor) : [];
            applyNavigationSlot({
                block: matchedBlock,
                floor: firstFloor,
                ward: wards[0] || ''
            });
        }

        function stepFloorWithBlockTransition(floorStep) {
            const slots = buildGlobalNavigationSlots();
            if (slots.length === 0) return;

            hasStartedWardNavigationFromTGF = true;
            const curBlock = String(document.getElementById('blockSelect')?.value || '').trim();
            const curFloor = String(document.getElementById('floorSelect')?.value || '').trim();

            if (!curBlock) {
                applyNavigationSlot(getTBlockGFStartSlot(slots) || slots[0]);
                return;
            }

            const orderedBlocks = getOrderedBlockList();
            const bIdx = orderedBlocks.findIndex(b => b.toLowerCase() === curBlock.toLowerCase());
            if (bIdx === -1) {
                applyNavigationSlot(getTBlockGFStartSlot(slots) || slots[0]);
                return;
            }

            const floorsInBlock = getOrderedFloorsForBlock(orderedBlocks[bIdx]);
            const fIdx = floorsInBlock.findIndex(f => f.toLowerCase() === curFloor.toLowerCase());

            if (floorStep > 0) {
                if (fIdx !== -1 && fIdx + 1 < floorsInBlock.length) {
                    const nextFloor = floorsInBlock[fIdx + 1];
                    const nextWards = getOrderedWardsForBlockFloor(orderedBlocks[bIdx], nextFloor);
                    applyNavigationSlot({ block: orderedBlocks[bIdx], floor: nextFloor, ward: nextWards[0] || '' });
                } else {
                    const nextBlockIdx = (bIdx + 1) % orderedBlocks.length;
                    const nextBlock = orderedBlocks[nextBlockIdx];
                    const nextBlockFloors = getOrderedFloorsForBlock(nextBlock);
                    const targetFloor = nextBlockFloors[0] || '';
                    const targetWards = targetFloor ? getOrderedWardsForBlockFloor(nextBlock, targetFloor) : [];
                    applyNavigationSlot({ block: nextBlock, floor: targetFloor, ward: targetWards[0] || '' });
                }
            } else {
                if (fIdx > 0) {
                    const prevFloor = floorsInBlock[fIdx - 1];
                    const prevWards = getOrderedWardsForBlockFloor(orderedBlocks[bIdx], prevFloor);
                    applyNavigationSlot({ block: orderedBlocks[bIdx], floor: prevFloor, ward: prevWards[0] || '' });
                } else {
                    const prevBlockIdx = (bIdx - 1 + orderedBlocks.length) % orderedBlocks.length;
                    const prevBlock = orderedBlocks[prevBlockIdx];
                    const prevBlockFloors = getOrderedFloorsForBlock(prevBlock);
                    const targetFloor = prevBlockFloors[prevBlockFloors.length - 1] || '';
                    const targetWards = targetFloor ? getOrderedWardsForBlockFloor(prevBlock, targetFloor) : [];
                    applyNavigationSlot({ block: prevBlock, floor: targetFloor, ward: targetWards[0] || '' });
                }
            }
        }

        function cycleJoystickFloor(direction = 1) {
            stepFloorWithBlockTransition(direction);
        }

        function cycleJoystickWard(direction = 1) {
            const slots = buildGlobalNavigationSlots();
            if (slots.length === 0) return;

            const startSlot = getTBlockGFStartSlot(slots) || slots[0];
            if (!hasStartedWardNavigationFromTGF) {
                hasStartedWardNavigationFromTGF = true;
                applyNavigationSlot(startSlot);
                return;
            }

            const curBlock = String(document.getElementById('blockSelect')?.value || '').trim().toLowerCase();
            const curFloor = String(document.getElementById('floorSelect')?.value || '').trim().toLowerCase();
            const curWard = String(document.getElementById('wardSelect')?.value || '').trim().toLowerCase();

            let currentSlotIdx = slots.findIndex(s =>
                s.block.toLowerCase() === curBlock &&
                s.floor.toLowerCase() === curFloor &&
                s.ward.toLowerCase() === curWard
            );

            if (currentSlotIdx === -1) {
                currentSlotIdx = slots.findIndex(s =>
                    s.block.toLowerCase() === curBlock &&
                    s.floor.toLowerCase() === curFloor
                );
            }

            if (currentSlotIdx === -1) {
                applyNavigationSlot(startSlot);
                return;
            }

            const nextSlotIdx = (currentSlotIdx + (direction >= 0 ? 1 : -1) + slots.length) % slots.length;
            applyNavigationSlot(slots[nextSlotIdx]);
        }

        let stocktakeSessions = [];

        function ensureSessionBuckets(session) {
            if (!session || typeof session !== 'object') return session;
            if (!Array.isArray(session.unscanned)) session.unscanned = [];
            if (!Array.isArray(session.successful)) session.successful = [];
            if (!Array.isArray(session.unidentified)) session.unidentified = [];
            if (!Array.isArray(session.unmatched)) session.unmatched = [];
            // 向後相容舊資料若只有 matched 但無 unscanned / successful
            if (session.unscanned.length === 0 && session.successful.length === 0 && Array.isArray(session.matched) && session.matched.length > 0) {
                session.unscanned = [...session.matched];
            }
            return session;
        }

                    if (!activeStocktakeSessionId || !stocktakeSessions.some(s => s.id === activeStocktakeSessionId)) {

        function normalizeStocktakeHeader(val) {
            if (val === undefined || val === null) return '';
            let s = String(val).normalize('NFKC').replace(/ /g, ' ').toLowerCase().trim();
            s = s.replace(/[^a-z0-9一-鿿]+/g, ' ');
            return s.replace(/\s+/g, ' ').trim();
        }

        function cleanStocktakeCell(val) {
            if (val === undefined || val === null) return '';
            return String(val).normalize('NFKC').replace(/ /g, ' ').replace(/\s+/g, ' ').trim();
        }

        const STOCKTAKE_FIELD_RULES = {
            eam: {
                exact: new Set(['asset number', 'asset no', 'asset id', 'eam', 'eam no', 'eam number', 'assetnum', 'tag no', 'barcode']),
                contains: ['asset number', 'asset no', 'eam', 'tag no', 'barcode'],
                exclude: ['parent']
            },
            sn: {
                exact: new Set(['serial no', 'serial number', 'serial', 's n', 'sn', 'ser no']),
                contains: ['serial', 's n'],
                exclude: []
            },
            description: {
                exact: new Set(['asset description', 'description', 'desc', 'item description', 'asset desc']),
                contains: ['description', 'desc'],
                exclude: []
            },
            ward: {
                exact: new Set(['ward', 'location', 'location code', 'stock take location code', 'ward key']),
                contains: ['location', 'ward'],
                exclude: ['remark']
            },
            ownerDept: {
                exact: new Set(['owning department', 'owner department', 'owner', 'dept', 'department']),
                contains: ['owning', 'owner', 'department', 'dept'],
                exclude: []
            },
            block: {
                exact: new Set(['block']),
                contains: ['block'],
                exclude: []
            },
            floor: {
                exact: new Set(['floor']),
                contains: ['floor'],
                exclude: []
            },
            remark: {
                exact: new Set(['remark', 'remarks', 'asset remark', 'location remark', 'note', 'notes', 'reason']),
                contains: ['remark', 'note', 'reason'],
                exclude: []
            },
            stockTakenResult: {
                exact: new Set(['stock taken result', 'stocktake result', 'result', 'status', 'scan status', 'stock taken status']),
                contains: ['stock taken result', 'stocktake result', 'result', 'scan status'],
                exclude: []
            }
        };

        function scoreHeaderForField(normHeader, fieldKey) {
            if (!normHeader) return 0;
            const rule = STOCKTAKE_FIELD_RULES[fieldKey];
            if (!rule) return 0;
            if (rule.exclude.some(ex => normHeader.includes(ex))) return 0;
            if (rule.exact.has(normHeader)) return 100;
            if (rule.contains.some(kw => normHeader.includes(kw))) return 60;
            return 0;
        }

        function detectWorksheetStocktakeTable(worksheet) {
            if (!worksheet || !worksheet['!ref']) return null;
            const range = XLSX.utils.decode_range(worksheet['!ref']);
            const maxScanRow = Math.min(range.e.r, range.s.r + 18);
            const totalCols = range.e.c - range.s.c + 1;

            let hasReportHint = false;
            for (let r = range.s.r; r <= Math.min(range.e.r, range.s.r + 8); r++) {
                let rowHintStr = '';
                for (let c = range.s.c; c <= Math.min(range.e.c, range.s.c + 12); c++) {
                    const cell = worksheet[XLSX.utils.encode_cell({ r, c })];
                    if (cell && cell.v !== undefined && cell.v !== null) {
                        rowHintStr += ' ' + normalizeStocktakeHeader(cell.v);
                    }
                }
                if (rowHintStr.includes('discrepancies report') || rowHintStr.includes('stock take')) {
                    hasReportHint = true;
                    break;
                }
            }

            let best = null;
            const coreFields = ['eam', 'sn', 'description'];
            const allFields = ['eam', 'sn', 'description', 'ward', 'ownerDept', 'block', 'floor', 'remark', 'stockTakenResult'];

            for (let r = range.s.r; r <= maxScanRow; r++) {
                const fieldCols = {};
                const headerLabels = {};

                for (let c = range.s.c; c <= range.e.c; c++) {
                    const cell = worksheet[XLSX.utils.encode_cell({ r, c })];
                    const rawVal = cell ? cell.v : '';
                    const nh = normalizeStocktakeHeader(rawVal);
                    if (!nh) continue;

                    for (const fKey of allFields) {
                        const s = scoreHeaderForField(nh, fKey);
                        if (s > 0 && (!fieldCols[fKey] || s > fieldCols[fKey].score)) {
                            fieldCols[fKey] = { colIndex: c, score: s, rawHeader: cleanStocktakeCell(rawVal) };
                            headerLabels[fKey] = cleanStocktakeCell(rawVal);
                        }
                    }
                }

                const coreMatchedCount = coreFields.filter(k => Boolean(fieldCols[k])).length;
                const totalMatchedCount = Object.keys(fieldCols).length;
                if (totalMatchedCount === 0) continue;

                let score = 0;
                Object.values(fieldCols).forEach(info => {
                    score += info.score;
                });
                score += coreMatchedCount * 90;
                score += totalMatchedCount * 20;
                if (hasReportHint) score += 50;
                if (totalCols >= 8) score += 25;
                if (totalCols <= 3) score -= 90;

                if (!best || score > best.score) {
                    best = {
                        headerRowIndex: r,
                        totalCols,
                        coreMatchedCount,
                        totalMatchedCount,
                        score,
                        fieldCols,
                        headerLabels
                    };
                }
            }

            return best;
        }

        function extractRowsFromBestSheet(workbook) {
            const sheetNames = workbook.SheetNames || [];
            let chosenSheetName = null;
            let chosenInfo = null;

            for (const name of sheetNames) {
                const ws = workbook.Sheets[name];
                const info = detectWorksheetStocktakeTable(ws);
                if (info && (!chosenInfo || info.score > chosenInfo.score)) {
                    chosenSheetName = name;
                    chosenInfo = info;
                }
            }

            if (!chosenSheetName || !chosenInfo) {
                const fallbackName = sheetNames[0];
                const ws = workbook.Sheets[fallbackName];
                const rawRows = XLSX.utils.sheet_to_json(ws, { defval: '' });
                return {
                    sheetName: fallbackName,
                    rows: rawRows,
                    detectedHeaders: {},
                    autoDetected: false
                };
            }

            const ws = workbook.Sheets[chosenSheetName];
            const range = XLSX.utils.decode_range(ws['!ref']);
            const startRow = chosenInfo.headerRowIndex + 1;
            const rows = [];

            const getCellValue = (r, fieldKey) => {
                const colInfo = chosenInfo.fieldCols[fieldKey];
                if (!colInfo) return '';
                const cell = ws[XLSX.utils.encode_cell({ r, c: colInfo.colIndex })];
                return cell && cell.v !== undefined && cell.v !== null ? cleanStocktakeCell(cell.v) : '';
            };

            for (let r = startRow; r <= range.e.r; r++) {
                let rowPreview = '';
                for (let c = range.s.c; c <= Math.min(range.e.c, range.s.c + 6); c++) {
                    const cell = ws[XLSX.utils.encode_cell({ r, c })];
                    if (cell && cell.v !== undefined && cell.v !== null) {
                        rowPreview += ' ' + normalizeStocktakeHeader(cell.v);
                    }
                }
                const trimmedPreview = rowPreview.trim();
                if (!trimmedPreview) continue;
                if (
                    trimmedPreview.includes('end of report') ||
                    trimmedPreview.startsWith('總計') ||
                    trimmedPreview === 'total'
                ) {
                    break;
                }

                const eamVal = getCellValue(r, 'eam');
                const snVal = getCellValue(r, 'sn');
                const descVal = getCellValue(r, 'description');
                const wardVal = getCellValue(r, 'ward');
                const ownerVal = getCellValue(r, 'ownerDept');
                const blockVal = getCellValue(r, 'block');
                const floorVal = getCellValue(r, 'floor');
                const remarkVal = getCellValue(r, 'remark');
                const resultVal = getCellValue(r, 'stockTakenResult');

                if (!eamVal && !snVal && !descVal) continue;

                rows.push({
                    EAM: eamVal,
                    'S/N': snVal,
                    Description: descVal,
                    Ward: wardVal,
                    'Owning Department': ownerVal,
                    Block: blockVal,
                    Floor: floorVal,
                    Remark: remarkVal,
                    'Stock Taken Result': resultVal
                });
            }

            return {
                sheetName: chosenSheetName,
                rows,
                detectedHeaders: chosenInfo.headerLabels,
                autoDetected: true,
                score: chosenInfo.score,
                coreMatchedCount: chosenInfo.coreMatchedCount
            };
        }

        function normalizeLookupKey(val) {
            return String(val || '').normalize('NFKC').replace(/ /g, ' ').trim().replace(/^0+/, '').toLowerCase();
        }

        function pickRowField(row, candidates) {
            const keys = Object.keys(row || {});
            for (const cand of candidates) {
                const target = normalizeStocktakeHeader(cand);
                for (const k of keys) {
                    const normK = normalizeStocktakeHeader(k);
                    if (normK === target || normK.includes(target)) {
                        const v = row[k];
                        if (v !== undefined && v !== null && cleanStocktakeCell(v) !== '') {
                            return cleanStocktakeCell(v);
                        }
                    }
                }
            }
            return '';
        }

        function runStocktakeMatching(rows) {
            const assetsList = Array.isArray(allAssets) ? allAssets : [];

            const eamMap = new Map();
            const snMap = new Map();

            assetsList.forEach(a => {
                const nkEam = normalizeLookupKey(a.eam);
                if (nkEam && !eamMap.has(nkEam)) eamMap.set(nkEam, a);

                const nkSn = normalizeLookupKey(a.serial);
                if (nkSn && !snMap.has(nkSn)) snMap.set(nkSn, a);
            });

            const unscanned = [];     // 未掃描Asset -> 地圖 Highlight + 右側清單
            const successful = [];    // 已掃描Asset -> 不在地圖 Highlight
            const unidentified = [];  // 非所屬Asset -> 不顯示地圖、不與 Current List 比對，僅顯示 EAM 與 Owner
            const unmatched = [];     // 未登記Asset -> 系統找不到，放入 System / System / Pending

            (rows || []).forEach((row, idx) => {
                const rawEam = pickRowField(row, ['eam', 'asset number', 'asset no', 'asset id', 'tag no', 'barcode', '編號']);
                const rawSn = normalizeSerialValue(pickRowField(row, ['s/n', 'sn', 'serial no', 'serial number', 'serial', '序號']));
                const rawDesc = pickRowField(row, ['asset description', 'description', 'type', 'asset type', 'item', 'name', '類型', '名稱']) || ASSET_TYPES[0].label;
                const rawWard = pickRowField(row, ['ward', 'location', 'location code', 'stock take location code', 'ward key', '單位', '位置']);
                const rawOwner = pickRowField(row, ['owning department', 'owner department', 'owner', 'dept', 'department', '所屬部門']);
                const rawBlock = pickRowField(row, ['block', '棟別']);
                const rawFloor = pickRowField(row, ['floor', '樓層']);
                const rawRemark = pickRowField(row, ['remark', 'remarks', 'asset remark', 'location remark', 'note', 'notes', 'reason', '備註', '原因']);
                const rawResult = pickRowField(row, ['stock taken result', 'stocktake result', 'result', 'status', 'scan status']);

                if (!rawEam && rawSn === 'N/A' && !rawDesc && !rawOwner) return;

                const normRes = normalizeStocktakeHeader(rawResult);
                const normRem = normalizeStocktakeHeader(rawRemark);
                const isUnidentified = normRes.includes('unidentified') || normRem.includes('unidentified');

                // 1. 非所屬Asset (Unidentified)：不顯示地圖、不與 Current List 比對，只記錄 EAM 與 Owner
                if (isUnidentified) {
                    unidentified.push({
                        id: `UNID-${Date.now()}-${idx + 1}`,
                        rowIndex: idx + 1,
                        eam: rawEam || '(無 EAM)',
                        owner: rawOwner || '未標示',
                        stockTakenResult: '非所屬Asset',
                        onMap: false
                    });
                    return;
                }

                const isSuccessful = normRes.includes('successful') || normRes.includes('success');
                const classifiedResult = isSuccessful ? '已掃描Asset' : '未掃描Asset';

                // 2. 已掃描Asset 與 未掃描Asset：用 EAM 與 S/N 和 Current List 對比
                let foundAsset = null;
                let matchMethod = '未找到';

                const keyEam = normalizeLookupKey(rawEam);
                const keySn = normalizeLookupKey(rawSn === 'N/A' ? '' : rawSn);

                if (keyEam && eamMap.has(keyEam)) {
                    foundAsset = eamMap.get(keyEam);
                    matchMethod = 'EAM 命中';
                } else if (keySn && snMap.has(keySn)) {
                    foundAsset = snMap.get(keySn);
                    matchMethod = 'S/N 命中';
                }

                // 找不到 -> 未登記Asset（固定歸入 System / System / Pending，無視 Excel Location）
                if (!foundAsset) {
                    unmatched.push({
                        id: `PEND-${Date.now()}-${idx + 1}`,
                        rowIndex: idx + 1,
                        eam: rawEam,
                        serial: rawSn,
                        description: rawDesc,
                        block: 'System',
                        floor: 'System',
                        ward: 'Pending',
                        excelWard: rawWard,
                        stockTakenResult: '未登記Asset',
                        remark: rawRemark || '',
                        restoredToSystem: false,
                        restoredAt: ''
                    });
                    return;
                }

                const matchedRecord = {
                    rowIndex: idx + 1,
                    inputEam: rawEam,
                    inputSerial: rawSn,
                    inputDescription: rawDesc,
                    inputWard: rawWard,
                    inputRemark: rawRemark,
                    stockTakenResult: classifiedResult,
                    matchMethod,
                    matchedEam: foundAsset.eam || '',
                    matchedSerial: normalizeSerialValue(foundAsset.serial || rawSn),
                    matchedDescription: foundAsset.description || '',
                    matchedBlock: foundAsset.block || '',
                    matchedFloor: foundAsset.floor || '',
                    matchedWard: foundAsset.ward || '',
                    matchedX: foundAsset.x,
                    matchedY: foundAsset.y
                };

                if (isSuccessful) {
                    successful.push(matchedRecord);
                } else {
                    unscanned.push(matchedRecord);
                }
            });

            const matched = [...unscanned, ...successful];
            return { matched, unscanned, successful, unidentified, unmatched };
        }

        function hydrateMatchedItem(m) {
            const liveAsset = findAssetByEam(m.matchedEam || m.inputEam);
            return {
                ...m,
                stockTakenResult: m.stockTakenResult || '未掃描Asset',
                matchedEam: m.matchedEam || m.inputEam || (liveAsset && liveAsset.eam) || '',
                matchedSerial: normalizeSerialValue(m.matchedSerial || (liveAsset && liveAsset.serial) || m.inputSerial),
                matchedDescription: m.matchedDescription || (liveAsset && liveAsset.description) || m.inputDescription || '',
                matchedBlock: m.matchedBlock || (liveAsset && liveAsset.block) || '',
                matchedFloor: m.matchedFloor || (liveAsset && liveAsset.floor) || '',
                matchedWard: m.matchedWard || (liveAsset && liveAsset.ward) || '',
                matchedX: m.matchedX !== undefined ? m.matchedX : (liveAsset ? liveAsset.x : ''),
                matchedY: m.matchedY !== undefined ? m.matchedY : (liveAsset ? liveAsset.y : '')
            };
        }

            document.getElementById('btnRunStocktakeImport').onclick = async () => {
                const fileEl = document.getElementById('stocktakeFileInput');
                const autoOverlay = document.getElementById('stocktakeAutoOverlayCb')?.checked;
                const runBtn = document.getElementById('btnRunStocktakeImport');

                if (!fileEl || !fileEl.files || fileEl.files.length === 0) {
                    alert('請先選擇要上傳的 Stocktake 檔案！');
                    return;
                }
                if (typeof XLSX === 'undefined') {
                    alert('Excel 解析套件尚未載入，請檢查網路後再試。');
                    return;
                }

                runBtn.disabled = true;
                runBtn.innerText = '比對與同步中...';

                const file = fileEl.files[0];
                try {
                    const arrayBuffer = await file.arrayBuffer();
                    const workbook = XLSX.read(arrayBuffer, { type: 'array' });
                    const extracted = extractRowsFromBestSheet(workbook);
                    const targetSheetName = extracted.sheetName;
                    const jsonRows = extracted.rows;

                    if (!jsonRows || jsonRows.length === 0) {
                        alert(`工作表「${targetSheetName}」中沒有可讀取的明細列！`);
                        runBtn.disabled = false;
                        runBtn.innerText = '開始比對並同步';
                        return;
                    }

                    const { matched, unscanned, successful, unidentified, unmatched } = runStocktakeMatching(jsonRows);
                    const nowShortStr = formatShortDateTime(new Date());

                    const newSession = {
                        id: `ST-${Date.now()}`,
                        fileName: file.name,
                        sheetName: targetSheetName,
                        importedAt: nowShortStr,
                        totalInput: jsonRows.length,
                        matched,
                        unscanned,
                        successful,
                        unidentified,
                        unmatched
                    };

                    await saveStocktakeSessionToSheet(newSession);

                    stocktakeSessions.unshift(newSession);
                    activeStocktakeSessionId = newSession.id;

                    if (autoOverlay) {
                        stocktakeMapOverlayEnabled = true;
                    }
                    updateStocktakeBadges();
                    renderSidebarWithPriority();

                    const wardVal = document.getElementById('wardSelect')?.value || '';
                    if (wardVal) {
                        renderAssetMarkers(currentFilteredAssets);
                    }

                    modal.remove();
                    openStocktakeResultModal(newSession.id);
                } catch (err) {
                    alert('讀取或同步失敗：' + err);
                    runBtn.disabled = false;
                    runBtn.innerText = '開始比對並同步';
                }
            };
        }

                                        </div>
                                        <div>
                                            <label class="block text-[10px] font-bold text-slate-500 mb-0.5">S/N (Serial)</label>
                                            <input type="text" data-field="serial" value="${String(normalizeSerialValue(u.serial)).replace(/"/g, '&quot;')}" placeholder="輸入 S/N"
                                                class="pend-serial w-full bg-white border border-slate-300 rounded-lg px-2.5 py-1.5 text-xs font-bold text-slate-700">
                                        </div>
                                        <div>
                                            <label class="block text-[10px] font-bold text-slate-500 mb-0.5">放回位置（固定 Pending）</label>
                                            <input type="text" value="System / System / Pending" readonly
                                                class="w-full bg-slate-100 border border-slate-300 rounded-lg px-2.5 py-1.5 text-xs font-bold text-slate-600 cursor-not-allowed">
                                        </div>
                                    </div>

                                    <div class="flex justify-end gap-2 pt-1">
                                        <button type="button" data-pend-id="${u.id}" class="btn-restore-pending bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-3.5 py-1.5 rounded-xl cursor-pointer flex items-center gap-1.5">
                                            <i class="fa-solid fa-share-from-square"></i> 確認並放回 Pending
                                        </button>
                                    </div>
                                </div>
                            `).join('')
                        }
                    </div>
                </div>
            `;
            document.body.appendChild(modal);

            document.getElementById('btnCloseStocktakePending').onclick = () => modal.remove();

            modal.querySelectorAll('.btn-restore-pending').forEach(btn => {
                btn.onclick = async () => {
                    const pendId = btn.getAttribute('data-pend-id');
                    const card = btn.closest('.border');
                    const eamVal = (card.querySelector('.pend-eam')?.value || '').trim();
                    const serialVal = normalizeSerialValue(card.querySelector('.pend-serial')?.value || '');

                    if (!eamVal) {
                        alert('請先填寫 EAM 編號再放回系統！');
                        return;
                    }

                    // 固定放入 System / System / Pending，無視 Excel Location
                    const targetBlock = 'System';
                    const targetFloor = 'System';
                    const wardVal = 'Pending';

                    const targetPend = (session.unmatched || []).find(item => item.id === pendId);
                    const autoCoords = computeNextAutoCoordinates(wardVal);

                    const restoredAsset = {
                        recordType: 'Asset',
                        eam: eamVal,
                        serial: serialVal,
                        dept: 'NSD',
                        description: (targetPend && targetPend.description) || ASSET_TYPES[0].label,
                        remark: (targetPend && targetPend.remark) || '',
                        pair: '',
                        block: targetBlock,
                        floor: targetFloor,
                        ward: wardVal,
                        x: autoCoords.x,
                        y: autoCoords.y
                    };

                    btn.disabled = true;
                    btn.innerText = '放回中...';

                    try {
                        const existing = findAssetByEam(eamVal);
                        const actionName = existing ? 'updateAsset' : 'addAsset';
                        const payloadAsset = existing
                            ? { ...existing, ...restoredAsset, block: 'System', floor: 'System', ward: 'Pending', x: existing.x ?? autoCoords.x, y: existing.y ?? autoCoords.y }
                            : restoredAsset;

                        const res = await fetch(GAS_API_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                            body: JSON.stringify({ action: actionName, asset: payloadAsset })
                        }).then(r => r.json());

                        if (res && res.status === 'error') {
                            throw new Error(res.message || '寫入失敗');
                        }

                        if (targetPend) {
                            targetPend.restoredToSystem = true;
                            targetPend.restoredAt = formatShortDateTime(new Date());
                            targetPend.eam = eamVal;
                            targetPend.serial = serialVal;
                            targetPend.block = 'System';
                            targetPend.floor = 'System';
                            targetPend.ward = 'Pending';
                        }

                        await saveStocktakeSessionToSheet(session);

                        applyAssetListToLocalState([payloadAsset], payloadAsset.eam, false);
                        updateStocktakeBadges();

                        alert(`✅ 已將 [${eamVal}]（S/N: ${serialVal}）放回 System / System / Pending 並同步！`);
                        modal.remove();
                        openStocktakePendingModal(session.id);
                    } catch (err) {
                        alert('❌ 放回失敗：' + err);
                        btn.disabled = false;
                        btn.innerText = '確認並放回 Pending';
                    }
                };
            });
        }

        function initStocktakeFeature() {
            updateStocktakeBadges();
            fetchStocktakeSessionsFromSheet();
        }
    </script>
</body>
</html>
