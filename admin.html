<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NSD Asset Manage System (Admin)</title>
    <!-- 引入 Tailwind CSS 與 FontAwesome -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- 引入 html5-qrcode 條碼掃描庫 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col font-sans">

    <!-- 頂部導覽與連動選單列 -->
    <header class="bg-white border-b border-slate-200 px-3 sm:px-6 py-3 flex flex-col sm:flex-row items-center justify-between gap-3 shadow-sm z-20">
        <div class="flex items-center space-x-3 w-full sm:w-auto justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-50 p-2.5 rounded-xl border border-blue-100 shadow-xs">
                    <i class="fa-solid fa-hospital text-blue-600 text-xl sm:text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-base sm:text-xl font-black tracking-wide text-slate-800">NSD Asset Management System <span class="text-xs font-bold bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full border border-amber-300 align-middle ml-1">Admin</span></h1>
                    <p class="text-[10px] text-slate-400 font-medium"> NSD Asset Manage System</p>
                </div>
            </div>
        </div>
    
        <!-- 階層連動選單區塊 -->
        <div class="grid grid-cols-3 gap-2 w-full sm:w-auto bg-slate-50 p-2.5 rounded-2xl border border-slate-200 shadow-inner">
            <div class="flex flex-col">
                <label class="text-[11px] font-bold text-slate-600 mb-1">棟別 (Block):</label>
                <select id="blockSelect" onchange="onBlockChange()" class="w-full bg-white text-slate-800 text-xs font-semibold rounded-xl px-2.5 py-1.5 border border-slate-300 focus:outline-none focus:border-blue-500 shadow-xs cursor-pointer">
                    <option value="">載入中...</option>
                </select>
            </div>
            <div class="flex flex-col">
                <label class="text-[11px] font-bold text-slate-600 mb-1">樓層 (Floor):</label>
                <select id="floorSelect" onchange="onFloorChange()" class="w-full bg-white text-slate-800 text-xs font-semibold rounded-xl px-2.5 py-1.5 border border-slate-300 focus:outline-none focus:border-blue-500 shadow-xs cursor-pointer">
                    <option value="">請選擇</option>
                </select>
            </div>
            <div class="flex flex-col">
                <label class="text-[11px] font-bold text-slate-600 mb-1">單位 (Ward):</label>
                <select id="wardSelect" onchange="onWardChange()" class="w-full bg-white text-slate-800 text-xs font-semibold rounded-xl px-2.5 py-1.5 border border-slate-300 focus:outline-none focus:border-blue-500 shadow-xs cursor-pointer">
                    <option value="">請選擇</option>
                </select>
            </div>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="flex-1 p-6 grid grid-cols-1 lg:grid-cols-4 gap-6 items-stretch overflow-hidden">
        
        <!-- 左側區域：平面圖與提示橫幅 -->
        <div class="lg:col-span-3 flex flex-col gap-3 w-full min-w-0">
            <div id="selectionBanner" class="hidden bg-amber-500 border-4 border-amber-300 text-white px-6 py-3 rounded-2xl shadow-xl flex items-center justify-between text-sm font-extrabold tracking-wide transition-all z-20">
                <div class="flex items-center gap-3">
                    <i class="fa-solid fa-bullhorn text-xl text-yellow-100 animate-pulse"></i>
                    <span id="bannerText" class="text-xs tracking-wider">請直接在地圖點選新位置...</span>
                </div>
                <button onclick="cancelRelocate()" class="bg-amber-700 hover:bg-amber-800 text-white px-3 py-1.5 rounded-xl text-xs font-bold shadow-md cursor-pointer transition-all border border-amber-400">取消</button>
            </div>

            <div id="mapContainer" class="w-full bg-white border border-slate-200 rounded-2xl relative shadow-sm overflow-hidden cursor-crosshair">
                
                <div id="placeholderText" class="text-center pointer-events-none absolute inset-0 flex flex-col items-center justify-center z-10 bg-slate-50/90 backdrop-blur-xs p-6">
                    <div class="w-16 h-16 bg-blue-100/80 rounded-3xl flex items-center justify-center mb-4 text-blue-600 shadow-sm border border-blue-200">
                        <i class="fa-solid fa-map-location-dot text-3xl"></i>
                    </div>
                    <h3 class="text-base sm:text-lg font-black text-slate-800 mb-1">歡迎使用 NSD 資產地圖管理系統</h3>
                    <p class="text-xs text-slate-500 mb-6 font-medium">請選擇右上角單位載入平面圖，或使用右側獨立欄位搜尋資產：</p>
                </div>
                
                <div id="mapWrapper" class="relative w-full aspect-[12/9] bg-slate-50" onclick="handleMapClick(event)">
                    <img id="floorPlanImg" alt="Floor Plan" class="hidden absolute inset-0 w-full h-full object-fill pointer-events-auto" onclick="handleMapClick(event)">
                    <div id="markersLayer" class="absolute inset-0 pointer-events-none"></div>
                </div>
            </div>
        </div>

        <!-- 右側：獨立欄位資產清單與搜尋面板 -->
        <aside class="bg-white border border-slate-200 rounded-2xl p-4 flex flex-col h-full shadow-sm overflow-hidden min-h-0">
            <div class="pb-3 border-b border-slate-100 mb-3 space-y-2 shrink-0">
                <div class="flex items-center justify-between">
                    <h2 class="text-xs font-bold flex items-center gap-2 text-slate-700">
                        <i class="fa-solid fa-boxes-stacked text-blue-600"></i> 獨立欄位搜尋與清單
                    </h2>
                    <div class="flex items-center gap-1.5">
                        <button type="button" onclick="resetSearchFilters()" title="清除所有搜尋條件" class="text-[10px] bg-slate-100 hover:bg-slate-200 text-slate-600 px-2 py-0.5 rounded-full font-semibold cursor-pointer transition-colors">
                            清除
                        </button>
                        <span id="assetCountBadge" class="text-[10px] bg-blue-50 text-blue-600 px-2 py-0.5 rounded-full border border-blue-100 font-semibold">0 項</span>
                    </div>
                </div>

                <!-- 5 個獨立欄位（最高優先權、連動候選清單、Location 僅用 ward_key、Type 僅取現有資產類型） -->
                <div class="grid grid-cols-2 gap-2 text-xs">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 mb-0.5">EAM</label>
                        <input id="searchEamInput" list="eamDatalist" type="text" oninput="applyMultiFieldSearch()" onchange="applyMultiFieldSearch()" placeholder="輸入或選 EAM..."
                            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-1.5 text-xs text-slate-800 focus:outline-none focus:border-blue-500 focus:bg-white transition-all">
                        <datalist id="eamDatalist"></datalist>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 mb-0.5">S/N (Serial)</label>
                        <input id="searchSerialInput" list="serialDatalist" type="text" oninput="applyMultiFieldSearch()" onchange="applyMultiFieldSearch()" placeholder="輸入或選 S/N..."
                            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-1.5 text-xs text-slate-800 focus:outline-none focus:border-blue-500 focus:bg-white transition-all">
                        <datalist id="serialDatalist"></datalist>
                    </div>
                    <div class="col-span-2">
                        <label class="block text-[10px] font-bold text-slate-500 mb-0.5">Type (現有資產類型)</label>
                        <input id="searchTypeInput" list="typeDatalist" type="text" oninput="applyMultiFieldSearch()" onchange="applyMultiFieldSearch()" placeholder="輸入或選現有 Type..."
                            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-1.5 text-xs text-slate-800 focus:outline-none focus:border-blue-500 focus:bg-white transition-all">
                        <datalist id="typeDatalist"></datalist>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 mb-0.5">Remark (備註)</label>
                        <input id="searchRemarkInput" list="remarkDatalist" type="text" oninput="applyMultiFieldSearch()" onchange="applyMultiFieldSearch()" placeholder="輸入或選 Remark..."
                            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-1.5 text-xs text-slate-800 focus:outline-none focus:border-blue-500 focus:bg-white transition-all">
                        <datalist id="remarkDatalist"></datalist>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 mb-0.5">Location (Ward Key，如 NS)</label>
                        <input id="searchLocationInput" list="locationDatalist" type="text" oninput="applyMultiFieldSearch()" onchange="applyMultiFieldSearch()" placeholder="輸入 Ward Key..."
                            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-1.5 text-xs text-slate-800 focus:outline-none focus:border-blue-500 focus:bg-white transition-all">
                        <datalist id="locationDatalist"></datalist>
                    </div>
                </div>

                <div class="flex justify-end pt-0.5">
                    <button type="button" onclick="openScannerModal()" title="開啟條碼掃描器" class="w-full bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 shrink-0 shadow-sm transition-all cursor-pointer hover:shadow">
                        <i class="fa-solid fa-barcode text-sm"></i>
                        <span>條碼掃描定位</span>
                    </button>
                </div>
            </div>

            <div id="assetListContainer" class="flex-1 overflow-y-auto space-y-2.5 pr-1 min-h-0">
                <p class="text-xs text-slate-400 text-center mt-12">請先選擇上方單位或使用獨立欄位搜尋</p>
            </div>
        </aside>
    </main>

    <!-- 核心運作腳本 -->
    <script>
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbz_z5U4DjeWY1k8dELIxaSxfMUW110kMnzutPXsqvCGQB3k5qJIwHRTJJmKha1eiNrBlQ/exec";

        let allAssets = [];
        let floorHierarchyData = [];
        let rawHierarchyData = [];
        let currentFilteredAssets = [];
        let isMovingAsset = null;
        let isRelocatingMode = false;
        let pendingNewAssetEam = null;
        const floorPlanCache = {};
        let isFloorPlanLoaded = false;

        // 🌟 嚴謹區分 Scanner 與 Printer 的 22 種分類與圖示
        const ASSET_TYPES = [
            { label: "COMPUTER DESKTOP", icon: "fa-hard-drive" },
            { label: "NOTEBOOK / LAPTOP", icon: "fa-house-laptop" },
            { label: "IPAD / IOS TABLET", icon: "fa-tablet-screen-button" },
            { label: "WINDOWS TABLET", icon: "fa-tablet" },
            { label: "LCD MONITOR", icon: "fa-desktop" },
            { label: "TELEVISION SET", icon: "fa-chromecast" },
            { label: "BARCODE SCANNER", icon: "fa-barcode" },
            { label: "BARCODE PRINTER", icon: "fa-print" },
            { label: "PHOTOCOPIER", icon: "fa-file-invoice" },
            { label: "CAMERA", icon: "fa-camera" },
            { label: "CABINET / STORAGE / SHELVING", icon: "fa-box-archive" },
            { label: "MICRO-WAVE / RADIATOR / HEATER", icon: "fa-fire-burner" },
            { label: "TROLLEY / CART", icon: "fa-cart-flatbed" },
            { label: "REFRIGERATOR / REFRIGERATION", icon: "fa-snowflake" },
            { label: "SHREDDING MACHINE, PAPER", icon: "fa-file-lines" },
            { label: "DEFIBRILLATOR / PACEMAKER / ECG", icon: "fa-heart-pulse" },
            { label: "INFUSION PUMP / MEDICAL PUMP", icon: "fa-pills" },
            { label: "OXYGEN CONCENTRATOR / FLOWMETER", icon: "fa-lungs" },
            { label: "BEDS, ELECTRIC / WARMER / LIFT", icon: "fa-bed" },
            { label: "Medical Equipment (General)", icon: "fa-suitcase-medical" },
            { label: "Office Asset / Furniture", icon: "fa-chair" },
            { label: "Others", icon: "fa-box" }
        ];

        function getCurrentSearchCriteria() {
            return {
                eam: document.getElementById('searchEamInput')?.value || '',
                serial: document.getElementById('searchSerialInput')?.value || '',
                type: document.getElementById('searchTypeInput')?.value || '',
                remark: document.getElementById('searchRemarkInput')?.value || '',
                location: document.getElementById('searchLocationInput')?.value || ''
            };
        }

        function filterAssetsByCriteria(assets, criteria, excludeField = null) {
            const eamKw = excludeField === 'eam' ? '' : (criteria.eam || '').toLowerCase().trim();
            const serialKw = excludeField === 'serial' ? '' : (criteria.serial || '').toLowerCase().trim();
            const typeKw = excludeField === 'type' ? '' : (criteria.type || '').toLowerCase().trim();
            const remarkKw = excludeField === 'remark' ? '' : (criteria.remark || '').toLowerCase().trim();
            const locationKw = excludeField === 'location' ? '' : (criteria.location || '').toLowerCase().trim();

            return (assets || []).filter(asset => {
                const eam = String(asset.eam || '').toLowerCase().trim();
                const serial = String(asset.serial || '').toLowerCase().trim();
                const description = String(asset.description || '').toLowerCase().trim();
                const remark = String(asset.remark || '').toLowerCase().trim();
                const ward = String(asset.ward || '').toLowerCase().trim();

                if (eamKw && !eam.includes(eamKw)) return false;
                if (serialKw && !serial.includes(serialKw)) return false;
                if (typeKw && !description.includes(typeKw)) return false;
                if (remarkKw && !remark.includes(remarkKw)) return false;
                if (locationKw && !ward.includes(locationKw)) return false;
                return true;
            });
        }

        function setDatalistValues(datalistId, values) {
            const dl = document.getElementById(datalistId);
            if (!dl) return;
            const sorted = [...new Set(
                (values || [])
                    .filter(v => v !== undefined && v !== null && String(v).trim() !== '')
                    .map(v => String(v).trim())
            )].sort((x, y) => x.localeCompare(y, undefined, { numeric: true, sensitivity: 'base' }));

            dl.innerHTML = sorted.map(v => `<option value="${v.replace(/"/g, '&quot;')}"></option>`).join('');
        }

        function syncLinkedSearchDatalists(criteria) {
            setDatalistValues('eamDatalist', filterAssetsByCriteria(allAssets, criteria, 'eam').map(a => a.eam));
            setDatalistValues('serialDatalist', filterAssetsByCriteria(allAssets, criteria, 'serial').map(a => a.serial));
            setDatalistValues('typeDatalist', filterAssetsByCriteria(allAssets, criteria, 'type').map(a => a.description));
            setDatalistValues('remarkDatalist', filterAssetsByCriteria(allAssets, criteria, 'remark').map(a => a.remark));
            setDatalistValues('locationDatalist', filterAssetsByCriteria(allAssets, criteria, 'location').map(a => a.ward));
        }

        function populateSearchDatalists() {
            syncLinkedSearchDatalists(getCurrentSearchCriteria());
        }

        function hasActiveMultiSearch() {
            const c = getCurrentSearchCriteria();
            return Boolean(
                c.eam.trim() ||
                c.serial.trim() ||
                c.type.trim() ||
                c.remark.trim() ||
                c.location.trim()
            );
        }

        function renderSidebarWithPriority(fallbackAssets = null) {
            if (hasActiveMultiSearch()) {
                const matchedAssets = filterAssetsByCriteria(allAssets, getCurrentSearchCriteria(), null);
                renderAssetSidebarList(matchedAssets);
                return;
            }
            if (Array.isArray(fallbackAssets)) {
                renderAssetSidebarList(fallbackAssets);
                return;
            }
            const wardSelect = document.getElementById('wardSelect');
            if (wardSelect && wardSelect.value) {
                renderAssetSidebarList(currentFilteredAssets);
            } else {
                renderAssetSidebarList(allAssets);
            }
        }

        function applyMultiFieldSearch() {
            const criteria = getCurrentSearchCriteria();
            syncLinkedSearchDatalists(criteria);

            if (!hasActiveMultiSearch()) {
                const wardSelect = document.getElementById('wardSelect');
                if (wardSelect && wardSelect.value) {
                    onWardChange();
                } else {
                    renderAssetSidebarList(allAssets);
                }
                return;
            }

            renderSidebarWithPriority();
        }

        function resetSearchFilters() {
            ['searchEamInput', 'searchSerialInput', 'searchTypeInput', 'searchRemarkInput', 'searchLocationInput'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.value = '';
            });
            applyMultiFieldSearch();
        }

        function onSearchInput(query) {
            applyMultiFieldSearch();
        }

        function fetchAllAssets(focusEam = null) {
            return fetch(`${GAS_API_URL}?action=getAllAssets&_t=${Date.now()}`)
                .then(res => res.json())
                .then(data => {
                    allAssets = data || [];
                    window.allAssets = allAssets;
                    populateSearchDatalists();

                    if (focusEam) {
                        const updatedAsset = allAssets.find(a => String(a.eam || '').trim() === String(focusEam).trim());
                        if (updatedAsset) {
                            locateAndHighlightAsset(updatedAsset);
                            return;
                        }
                    }

                    const wardSelect = document.getElementById('wardSelect');
                    if (wardSelect && wardSelect.value) {
                        currentFilteredAssets = allAssets.filter(a => a.ward && a.ward.trim().toLowerCase() === wardSelect.value.trim().toLowerCase());
                        window.currentLoadedAssets = currentFilteredAssets;
                        renderAssetMarkers(currentFilteredAssets);
                    }
                    renderSidebarWithPriority(wardSelect && wardSelect.value ? currentFilteredAssets : allAssets);
                })
                .catch(err => console.error("抓取資產失敗:", err));
        }

        function fetchHierarchy() {
            fetch(`${GAS_API_URL}?action=getHierarchy&_t=${Date.now()}`)
                .then(res => res.json())
                .then(data => {
                    floorHierarchyData = data || [];
                    rawHierarchyData = data || [];
                    initDropdowns(floorHierarchyData);
                    populateSearchDatalists();

                    floorHierarchyData.forEach(item => {
                        const wardKey = item.wardKey;
                        if (wardKey && !floorPlanCache[wardKey]) {
                            fetch(`${GAS_API_URL}?action=getFloorPlan&wardKey=${encodeURIComponent(wardKey)}`)
                                .then(res => res.json())
                                .then(planData => {
                                    if (planData && planData.base64) {
                                        floorPlanCache[wardKey] = planData.base64;
                                    }
                                })
                                .catch(err => console.warn(`預載失敗: ${wardKey}`, err));
                        }
                    });
                })
                .catch(err => console.error("抓取選單階層失敗:", err));
        }

        function loadFloorPlan(wardKey) {
            var imgEl = document.getElementById('floorPlanImg');
            isFloorPlanLoaded = false;

            if (floorPlanCache[wardKey]) {
                imgEl.src = floorPlanCache[wardKey];
                imgEl.classList.remove('hidden');
                isFloorPlanLoaded = true;
                const placeholder = document.getElementById('placeholderText');
                if (placeholder) placeholder.classList.add('hidden');
                return;
            }

            fetch(`${GAS_API_URL}?action=getFloorPlan&wardKey=${encodeURIComponent(wardKey)}`)
                .then(res => res.json())
                .then(data => {
                    if (data && data.base64) {
                        floorPlanCache[wardKey] = data.base64;
                        imgEl.src = data.base64;
                        imgEl.classList.remove('hidden');
                        isFloorPlanLoaded = true;
                        const placeholder = document.getElementById('placeholderText');
                        if (placeholder) placeholder.classList.add('hidden');
                    } else {
                        imgEl.src = '';
                        imgEl.classList.add('hidden');
                        isFloorPlanLoaded = false;
                    }
                })
                .catch(err => {
                    console.error("載入平面圖失敗: ", err);
                    isFloorPlanLoaded = false;
                });
        }

        function openEditRemarkModal(asset) {
            const existingModal = document.getElementById('editRemarkModal');
            if (existingModal) existingModal.remove();

            const modal = document.createElement('div');
            modal.id = 'editRemarkModal';
            modal.className = 'fixed inset-0 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center z-50 p-4';
            modal.innerHTML = `
                <div class="bg-white border border-slate-200 rounded-2xl p-6 w-full max-w-sm shadow-2xl text-slate-800">
                    <h3 class="text-xs font-bold mb-2 text-blue-600 text-center flex items-center justify-center gap-2">
                        <i class="fa-solid fa-pen-to-square"></i> 修改備註 (Remark)
                    </h3>
                    <p class="text-[11px] text-slate-500 text-center mb-4">
                        資產：<span class="font-bold text-slate-700">${asset.eam}</span> (${asset.ward || '未設定'})
                    </p>
                    
                    <div class="space-y-3 text-xs">
                        <div>
                            <label class="block text-slate-600 mb-1 font-semibold">備註內容 (Remark):</label>
                            <textarea id="editRemarkInput" placeholder="請輸入備註內容（留空可清除備註）..." rows="3"
                                class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-slate-800 focus:outline-none focus:border-blue-500">${asset.remark || ''}</textarea>
                        </div>
                    </div>

                    <div class="flex gap-2 mt-5">
                        <button id="btnSaveRemark" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold py-2.5 rounded-xl transition-all shadow-md cursor-pointer">儲存備註</button>
                        <button id="btnCancelRemark" class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs py-2.5 rounded-xl transition-all cursor-pointer">取消</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);

            const remarkInput = document.getElementById('editRemarkInput');
            remarkInput.focus();

            document.getElementById('btnSaveRemark').onclick = () => {
                asset.remark = remarkInput.value.trim();
                modal.remove();
                updateAssetInSheet(asset, asset.eam);
            };
            document.getElementById('btnCancelRemark').onclick = () => modal.remove();
        }

        function openCondemnUploadModal(asset) {
            const existingModal = document.getElementById('condemnModal');
            if (existingModal) existingModal.remove();

            const modal = document.createElement('div');
            modal.id = 'condemnModal';
            modal.className = 'fixed inset-0 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center z-50 p-4';
            modal.innerHTML = `
                <div class="bg-white border border-slate-200 rounded-2xl p-6 w-full max-w-sm shadow-2xl text-slate-800">
                    <h3 class="text-xs font-bold mb-3 text-amber-600 text-center flex items-center justify-center gap-2">
                        <i class="fa-solid fa-triangle-exclamation"></i> 處理報廢/盈餘 (Condemn/Surplus)
                    </h3>
                    <p class="text-[11px] text-slate-500 text-center mb-4">資產編號：<span class="font-bold text-slate-700">${asset.eam}</span></p>
                    
                    <div class="space-y-3 text-xs">
                        <div>
                            <label class="block text-slate-600 mb-1 font-semibold">選擇處理類型:</label>
                            <select id="condemnType" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-slate-800 focus:outline-none focus:border-amber-500">
                                <option value="Condemn">Condemn (報廢)</option>
                                <option value="Surplus">Surplus (轉出/盈餘)</option>
                            </select>
                        </div>
                        <div>

                    </div>
                </div>
            `;
            document.body.appendChild(modal);

            document.getElementById('btnSubmitCondemn').onclick = () => {
                const type = document.getElementById('condemnType').value;
                const fileInput = document.getElementById('condemnFile');
                const remarkText = document.getElementById('condemnRemark').value.trim();

                asset.remark = `[${type}] ${remarkText}`;
                asset.block = "System";
                asset.floor = "System";
                asset.ward = type;
                modal.remove();

                if (fileInput.files.length > 0) {
                    const file = fileInput.files[0];
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        fetch(GAS_API_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                            body: JSON.stringify({ action: 'saveCondemnAndAsset', asset: asset, base64Data: e.target.result, fileName: file.name })
                        }).then(res => res.json()).then(res => {
                            if (res && res.status === "error") {
                                alert("❌ 檔案上傳失敗：" + res.message);
                            } else {
                                alert(`資產 [${asset.eam}] 之 ${type} 狀態與檔案已成功存檔！`);
                                fetchAllAssets(asset.eam);
                            }
                        }).catch(err => alert("❌ 系統通訊失敗：" + err));
                    };
                    reader.readAsDataURL(file);
                } else {
                    asset.dept = "NSD";
                    updateAssetInSheet(asset, asset.eam);
                }
            };
            document.getElementById('btnCloseCondemn').onclick = () => modal.remove();
        }

        function updateAssetInSheet(asset, focusEam = null) {

                body: JSON.stringify({ action: 'updateAsset', asset: asset })
            })

            .then(() => {
                alert("資產更新成功！");
                return fetchAllAssets(focusEam || asset.eam);
            })
            .catch(err => alert("更新失敗: " + err));
        }

        function deleteAssetFromSheet(eam) {
            fetch(GAS_API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'deleteAsset', eam: eam })

        // 🌟 嚴格區分 Scanner 與 Printer 的分類判定邏輯

        function calculateMarkerPositions(assets) {
            if (!assets || !Array.isArray(assets)) return [];
            const GRID_X = 60, GRID_Y = 45;
            return assets.map(asset => {
                const snappedX = Math.round(asset.x * (GRID_X / 100)) / (GRID_X / 100);
                const snappedY = Math.round(asset.y * (GRID_Y / 100)) / (GRID_Y / 100);
                return { ...asset, baseX: snappedX, baseY: snappedY, offsetX: 0, offsetY: 0 };
            });
        }

        function renderAssetMarkers(assets, highlightEam = null) {
            updateMarkersLayerSize();
            const markersLayer = document.getElementById('markersLayer');
            const floorPlanImg = document.getElementById('floorPlanImg');
            if (!markersLayer) return;
            markersLayer.innerHTML = '';
            if (!floorPlanImg || floorPlanImg.classList.contains('hidden')) return;

            const processedAssets = calculateMarkerPositions(assets);
            processedAssets.forEach(asset => {
                if (asset.x === undefined || asset.y === undefined) return;
                const typeConfig = getAssetTypeConfig(asset.description);
                const marker = document.createElement('div');
                marker.className = 'asset-pin-marker absolute cursor-pointer transition-all pointer-events-auto z-10';

                const posX = asset.baseX !== undefined ? asset.baseX : asset.x;
                const posY = asset.baseY !== undefined ? asset.baseY : asset.y;
                marker.style.left = `${posX}%`;
                marker.style.top = `${posY}%`;

                marker.style.transformOrigin = 'center center';
                marker.style.transform = `translate(-50%, -50%) scale(var(--map-scale, 1))`;

                const isHighlighted = highlightEam && String(asset.eam).trim() === String(highlightEam).trim();
                marker.innerHTML = `
                    <div class="relative flex items-center justify-center w-7 h-7 rounded-full border-2 shadow-md transition-transform hover:scale-110 ${typeConfig.bg} ${typeConfig.border} ${
                        isHighlighted ? 'ring-4 ring-amber-400 animate-bounce scale-125 z-30' : ''
                    }">
                        <i class="fa-solid ${typeConfig.icon} text-xs ${typeConfig.color}"></i>
                    </div>
                `;
                
                marker.onclick = (e) => {
                    e.stopPropagation();
                    openActionModal(asset);
                };
                markersLayer.appendChild(marker);
            });
        }

        function locateAndHighlightAsset(asset) {
            if (!asset) return;

            const blockSelect = document.getElementById('blockSelect');
            const floorSelect = document.getElementById('floorSelect');
            const wardSelect = document.getElementById('wardSelect');

            let targetBlock = String(asset.block || '').trim();
            let targetFloor = String(asset.floor || '').trim();
            let targetWard = String(asset.ward || '').trim();

            const matchedHierarchy = floorHierarchyData.find(
                h => String(h.wardKey || '').trim().toLowerCase() === targetWard.toLowerCase()
            );

            if (matchedHierarchy) {
                targetBlock = String(matchedHierarchy.block || '').trim();
                targetFloor = String(matchedHierarchy.floor || '').trim();
                targetWard = String(matchedHierarchy.wardKey || '').trim();
            } else if (targetWard.toLowerCase() === 'pending') {
                targetBlock = 'System';
                targetFloor = 'System';
                targetWard = 'Pending';
            }

            if (blockSelect) {
                const blockOpt = Array.from(blockSelect.options).find(
                    o => o.value.trim().toLowerCase() === targetBlock.toLowerCase()
                );
                blockSelect.value = blockOpt ? blockOpt.value : targetBlock;
            }
            onBlockChange();

            if (floorSelect) {
                const floorOpt = Array.from(floorSelect.options).find(
                    o => o.value.trim().toLowerCase() === targetFloor.toLowerCase()
                );
                floorSelect.value = floorOpt ? floorOpt.value : targetFloor;
            }
            onFloorChange();

            if (wardSelect) {
                const wardOpt = Array.from(wardSelect.options).find(
                    o => o.value.trim().toLowerCase() === targetWard.toLowerCase()
                );
                wardSelect.value = wardOpt ? wardOpt.value : targetWard;
            }

            if (targetWard) {
                loadFloorPlan(targetWard);
            }

            let highlightedDone = false;
            let waitTicks = 0;
            const checkInterval = setInterval(() => {
                waitTicks += 1;
                if (isFloorPlanLoaded || !targetWard || waitTicks >= 10) {
                    clearInterval(checkInterval);
                    if (!highlightedDone) {
                        highlightedDone = true;
                        executeHighlightAndScroll();
                    }
                }
            }, 50);

            function executeHighlightAndScroll() {
                const wardAssets = allAssets.filter(
                    a => a.ward && String(a.ward).trim().toLowerCase() === targetWard.toLowerCase()
                );
                const orderedWardAssets = [...wardAssets];
                const index = orderedWardAssets.findIndex(
                    a => String(a.eam || '').trim().toLowerCase() === String(asset.eam || '').trim().toLowerCase()
                );
                if (index > -1) {
                    const [matched] = orderedWardAssets.splice(index, 1);
                    orderedWardAssets.unshift(matched);
                } else {
                    orderedWardAssets.unshift(asset);
                }
                currentFilteredAssets = orderedWardAssets;

                renderSidebarWithPriority(currentFilteredAssets);
                renderAssetMarkers(currentFilteredAssets, asset.eam);

                // 直接將畫面定位到地圖，不捲動右側清單卡片
                const mapContainer = document.getElementById('mapContainer');
                if (mapContainer) {
                    mapContainer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }

                const assetCards = document.querySelectorAll('[data-eam]');
                assetCards.forEach(card => {
                    if (String(card.getAttribute('data-eam') || '').toLowerCase() === String(asset.eam || '').trim().toLowerCase()) {
                        card.classList.add('ring-4', 'ring-amber-400', 'bg-amber-50');
                        setTimeout(() => card.classList.remove('ring-4', 'ring-amber-400', 'bg-amber-50'), 3000);
                    }
                });

                const hasCoordinates = (asset.x !== undefined && asset.x !== null && asset.x !== '') &&
                                       (asset.y !== undefined && asset.y !== null && asset.y !== '');

                if (!hasCoordinates) {
                    isMovingAsset = asset;
                    isRelocatingMode = true;
                    const banner = document.getElementById('selectionBanner');
                    const bannerText = document.getElementById('bannerText');
                    if (banner && bannerText) {
                        banner.classList.remove('hidden');
                        bannerText.innerText = `⚠️ 資產 [${asset.eam}] 尚未設定座標，請直接在地圖上點擊其擺放位置...`;
                    }
                }
            }
        }

        let isMapClickProcessing = false;
        function handleMapClick(event) {
            if (isMapClickProcessing) return;
            isMapClickProcessing = true;
            setTimeout(() => { isMapClickProcessing = false; }, 300);

            if (event) event.stopPropagation();
            const mapWrapper = document.getElementById('mapWrapper');
            if (!mapWrapper) return;
            const rect = mapWrapper.getBoundingClientRect();

            if (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom) return;

            const x = ((event.clientX - rect.left) / rect.width) * 100;
            const y = ((event.clientY - rect.top) / rect.height) * 100;

            const currentBlock = document.getElementById('blockSelect').value;
            const currentFloor = document.getElementById('floorSelect').value;
            const currentWard = document.getElementById('wardSelect').value;

            if (!currentWard) {
                alert("請先在上方選單選擇「單位 (Ward)」！");
                return;
            }

            if (isRelocatingMode && isMovingAsset) {
                const movingTarget = isMovingAsset;
                movingTarget.x = parseFloat(x.toFixed(2));
                movingTarget.y = parseFloat(y.toFixed(2));
                movingTarget.block = currentBlock;
                movingTarget.floor = currentFloor;
                movingTarget.ward = currentWard;
                cancelRelocate();
                updateAssetInSheet(movingTarget, movingTarget.eam);
                return;
            }

            if (pendingNewAssetEam) {
                const newAssetData = {
                    eam: pendingNewAssetEam,
                    serial: "SN",
                    dept: "NSD",
                    description: ASSET_TYPES[0].label,
                    block: currentBlock,
                    floor: currentFloor,
                    ward: currentWard,
                    x: parseFloat(x.toFixed(2)),
                    y: parseFloat(y.toFixed(2))
                };

                pendingNewAssetEam = null;
                cancelRelocate();
                openAssetFormModal(newAssetData, false);
                return;
            }

            openSelectEamToMoveModal(
                parseFloat(x.toFixed(2)),
                parseFloat(y.toFixed(2)),
                currentBlock,
                currentFloor,
                currentWard
            );
        }

        function openSelectEamToMoveModal(targetX, targetY, targetBlock, targetFloor, targetWard) {
            const existingModal = document.getElementById('selectEamMoveModal');
            if (existingModal) existingModal.remove();

            const modal = document.createElement('div');
            modal.id = 'selectEamMoveModal';
            modal.className = 'fixed inset-0 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center z-50 p-4';
            modal.innerHTML = `
                <div class="bg-white border border-slate-200 rounded-2xl p-5 w-full max-w-md shadow-2xl text-slate-800 max-h-[90vh] overflow-y-auto">
                    <h3 class="text-xs font-bold mb-1 text-emerald-600 text-center flex items-center justify-center gap-2">
                        <i class="fa-solid fa-location-crosshairs"></i> 篩選並選擇要移動的資產
                    </h3>
                    <p class="text-[11px] text-slate-500 text-center mb-3">
                        目標位置：<span class="font-bold text-slate-700">${targetWard}</span>
                    </p>

                    <div id="moveFilterStep" class="space-y-2.5 text-xs">
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-[10px] font-bold text-slate-500 mb-0.5">EAM</label>
                                <input id="moveFilterEam" list="moveEamDatalist" type="text" placeholder="輸入或選 EAM..."
                                    class="w-full bg-slate-50 border border-slate-300 rounded-xl px-2.5 py-1.5 text-xs">
                                <datalist id="moveEamDatalist"></datalist>
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold text-slate-500 mb-0.5">S/N (Serial)</label>
                                <input id="moveFilterSerial" list="moveSerialDatalist" type="text" placeholder="輸入或選 S/N..."
                                    class="w-full bg-slate-50 border border-slate-300 rounded-xl px-2.5 py-1.5 text-xs">
                                <datalist id="moveSerialDatalist"></datalist>
                            </div>
                            <div class="col-span-2">
                                <label class="block text-[10px] font-bold text-slate-500 mb-0.5">Type (現有資產類型)</label>
                                <input id="moveFilterType" list="moveTypeDatalist" type="text" placeholder="輸入或選現有 Type..."
                                    class="w-full bg-slate-50 border border-slate-300 rounded-xl px-2.5 py-1.5 text-xs">
                                <datalist id="moveTypeDatalist"></datalist>
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold text-slate-500 mb-0.5">Remark (備註)</label>
                                <input id="moveFilterRemark" list="moveRemarkDatalist" type="text" placeholder="輸入或選 Remark..."
                                    class="w-full bg-slate-50 border border-slate-300 rounded-xl px-2.5 py-1.5 text-xs">
                                <datalist id="moveRemarkDatalist"></datalist>
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold text-slate-500 mb-0.5">Location (Ward Key)</label>
                                <input id="moveFilterLocation" list="moveLocationDatalist" type="text" placeholder="輸入 Ward Key..."
                                    class="w-full bg-slate-50 border border-slate-300 rounded-xl px-2.5 py-1.5 text-xs">
                                <datalist id="moveLocationDatalist"></datalist>
                            </div>
                        </div>

                        <div class="flex justify-between items-center pt-1">
                            <span id="moveMatchCount" class="text-[11px] text-slate-500 font-medium">符合 0 筆</span>
                            <button type="button" id="btnResetMoveFilter" class="text-[11px] text-slate-600 bg-slate-100 hover:bg-slate-200 px-2.5 py-1 rounded-lg cursor-pointer">清除篩選</button>
                        </div>

                        <select id="selectMoveEamDropdown" size="5"
                            class="w-full bg-slate-50 border border-slate-300 rounded-xl px-2.5 py-1.5 text-xs"></select>

                        <div class="flex gap-2 pt-2">
                            <button type="button" id="btnPrepareMoveConfirm" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold py-2.5 rounded-xl cursor-pointer">下一步</button>
                            <button type="button" id="btnCancelMoveEam" class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs py-2.5 rounded-xl cursor-pointer">取消</button>
                        </div>
                    </div>

                    <div id="moveConfirmStep" class="hidden space-y-3 text-xs">
                        <div class="bg-amber-50 border border-amber-200 rounded-xl p-3.5 space-y-2">
                            <p class="font-bold text-amber-800">確定要移動此資產嗎？</p>
                            <div class="text-slate-700 space-y-1 bg-white/90 p-2.5 rounded-lg border border-amber-100">
                                <div><span class="font-bold">資產：</span><span id="confirmAssetSummary"></span></div>
                                <div><span class="font-bold text-rose-700">原本位置：</span><span id="confirmFromWard"></span></div>
                                <div><span class="font-bold text-emerald-700">新位置：</span><span id="confirmToWard"></span></div>
                            </div>
                        </div>
                        <div class="flex gap-2">
                            <button type="button" id="btnExecuteMoveConfirmed" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold py-2.5 rounded-xl cursor-pointer">確定移動</button>
                            <button type="button" id="btnBackToMoveSelect" class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs py-2.5 rounded-xl cursor-pointer">返回重選</button>
                        </div>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);

            const eamInput = document.getElementById('moveFilterEam');
            const serialInput = document.getElementById('moveFilterSerial');
            const typeInput = document.getElementById('moveFilterType');
            const remarkInput = document.getElementById('moveFilterRemark');
            const locationInput = document.getElementById('moveFilterLocation');
            const selectEl = document.getElementById('selectMoveEamDropdown');
            const countEl = document.getElementById('moveMatchCount');

            function fillList(id, values) {
                const dl = document.getElementById(id);
                if (!dl) return;
                const sorted = [...new Set(
                    (values || [])
                        .filter(v => v !== undefined && v !== null && String(v).trim() !== '')
                        .map(v => String(v).trim())
                )].sort((x, y) => x.localeCompare(y, undefined, { numeric: true, sensitivity: 'base' }));
                dl.innerHTML = sorted.map(v => `<option value="${v.replace(/"/g, '&quot;')}"></option>`).join('');
            }

            function refreshMoveOptions() {
                const criteria = {
                    eam: eamInput.value,
                    serial: serialInput.value,
                    type: typeInput.value,
                    remark: remarkInput.value,
                    location: locationInput.value
                };

                fillList('moveEamDatalist', filterAssetsByCriteria(allAssets, criteria, 'eam').map(a => a.eam));
                fillList('moveSerialDatalist', filterAssetsByCriteria(allAssets, criteria, 'serial').map(a => a.serial));
                fillList('moveTypeDatalist', filterAssetsByCriteria(allAssets, criteria, 'type').map(a => a.description));
                fillList('moveRemarkDatalist', filterAssetsByCriteria(allAssets, criteria, 'remark').map(a => a.remark));
                fillList('moveLocationDatalist', filterAssetsByCriteria(allAssets, criteria, 'location').map(a => a.ward));

                const matched = filterAssetsByCriteria(allAssets, criteria, null).sort((a, b) =>
                    String(a.eam || '').localeCompare(String(b.eam || ''), undefined, { numeric: true, sensitivity: 'base' })
                );

                countEl.innerText = `符合 ${matched.length} 筆`;
                selectEl.innerHTML = matched.map(a =>
                    `<option value="${a.eam}">${a.eam} — ${a.description || '無類型'} | ${a.ward || '無 Ward'}</option>`
                ).join('');
                if (selectEl.options.length > 0 && selectEl.selectedIndex === -1) selectEl.selectedIndex = 0;
            }

            [eamInput, serialInput, typeInput, remarkInput, locationInput].forEach(inp => {
                inp.addEventListener('input', refreshMoveOptions);
                inp.addEventListener('change', refreshMoveOptions);
            });

            document.getElementById('btnResetMoveFilter').onclick = () => {
                [eamInput, serialInput, typeInput, remarkInput, locationInput].forEach(inp => { inp.value = ''; });
                refreshMoveOptions();
            };

            refreshMoveOptions();

            let pendingAsset = null;
            document.getElementById('btnPrepareMoveConfirm').onclick = () => {
                const chosenEam = selectEl.value;
                if (!chosenEam) return alert('請先選擇一個資產 (EAM)！');
                const found = allAssets.find(a => String(a.eam).trim() === String(chosenEam).trim());
                if (!found) return alert('找不到所選資產！');
                pendingAsset = found;

                document.getElementById('confirmAssetSummary').innerText = `${found.eam} (${found.description || '無類型'})`;
                document.getElementById('confirmFromWard').innerText = found.ward || '未設定';
                document.getElementById('confirmToWard').innerText = targetWard;

                document.getElementById('moveFilterStep').classList.add('hidden');
                document.getElementById('moveConfirmStep').classList.remove('hidden');
            };

            document.getElementById('btnBackToMoveSelect').onclick = () => {
                document.getElementById('moveConfirmStep').classList.add('hidden');
                document.getElementById('moveFilterStep').classList.remove('hidden');
            };

            document.getElementById('btnExecuteMoveConfirmed').onclick = () => {
                if (!pendingAsset) return;
                pendingAsset.x = targetX;
                pendingAsset.y = targetY;
                pendingAsset.block = targetBlock;
                pendingAsset.floor = targetFloor;
                pendingAsset.ward = targetWard;
                const movedEam = pendingAsset.eam;
                modal.remove();
                updateAssetInSheet(pendingAsset, movedEam);
            };

            document.getElementById('btnCancelMoveEam').onclick = () => modal.remove();
        }

        function updateMarkersLayerSize() {
            const floorPlanImg = document.getElementById('floorPlanImg');
            const mapWrapper = document.getElementById('mapWrapper');
            const markersLayer = document.getElementById('markersLayer');
            if (!floorPlanImg || !mapWrapper || floorPlanImg.classList.contains('hidden') || !floorPlanImg.complete || floorPlanImg.naturalWidth === 0) return;

            mapWrapper.style.position = 'relative';
            mapWrapper.style.width = '100%';
            mapWrapper.style.aspectRatio = `${floorPlanImg.naturalWidth} / ${floorPlanImg.naturalHeight}`;
            mapWrapper.style.height = 'auto';
            mapWrapper.style.margin = '0 auto';

            floorPlanImg.style.position = 'absolute';
            floorPlanImg.style.top = '0';
            floorPlanImg.style.left = '0';
            floorPlanImg.style.width = '100%';
            floorPlanImg.style.height = '100%';
            floorPlanImg.style.objectFit = 'contain';

            const currentWidth = floorPlanImg.clientWidth;
            const baseWidth = 1000; 
            let scale = currentWidth / baseWidth;
            
            if (window.innerWidth < 768) {
                scale = scale * 0.25; 
            }

            scale = Math.max(0.2, Math.min(1.0, scale));

            if (markersLayer) {
                markersLayer.style.setProperty('--map-scale', scale);
            }
        }

        function openAssetFormModal(assetData, isEdit = false) {
            const existingModal = document.getElementById('customFormModal');
            if (existingModal) existingModal.remove();

            const currentDesc = (assetData.description || '').trim();
            const isInPredefinedList = ASSET_TYPES.some(type => type.label === currentDesc);

            let customOptionHtml = '';
            if (currentDesc && !isInPredefinedList) {
                customOptionHtml = `<option value="${currentDesc}" selected>${currentDesc}</option>`;
            }

            const standardOptionsHtml = ASSET_TYPES.map(type => 
                `<option value="${type.label}" ${currentDesc === type.label ? 'selected' : ''}>${type.label}</option>`
            ).join('');

            const typeOptionsHtml = customOptionHtml + standardOptionsHtml;

            const modal = document.createElement('div');
            modal.id = 'customFormModal';
            modal.className = 'fixed inset-0 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center z-50 p-4';
            modal.innerHTML = `
                <div class="bg-white border border-slate-200 rounded-2xl p-6 w-full max-w-sm shadow-2xl text-slate-800">
                    <h3 class="text-xs font-bold mb-4 text-blue-600 text-center flex items-center justify-center gap-2">
                        <i class="fa-solid fa-shapes"></i> ${isEdit ? '編輯資產資訊' : '新增 / 移動資產'}
                    </h3>
                    <div class="space-y-3 text-xs">
                        <div>
                            <label class="block text-slate-600 mb-1 font-semibold">EAM 編號:</label>
                            <input id="inputEam" type="text" value="${assetData.eam || ''}" ${isEdit ? 'disabled' : ''} placeholder="例如 1564148" 
                                class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-slate-800 focus:outline-none focus:border-blue-500 ${isEdit ? 'opacity-60 cursor-not-allowed' : ''}">
                        </div>
                        <div>
                            <label class="block text-slate-600 mb-1 font-semibold">Serial 編號:</label>
                            <input id="inputSerial" type="text" value="${assetData.serial || 'SN'}" placeholder="請輸入 Serial" 
                                class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-slate-800 focus:outline-none focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-slate-600 mb-1 font-semibold">資產類型 (Type):</label>
                            <select id="inputDesc" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-slate-800 focus:outline-none focus:border-blue-500">${typeOptionsHtml}</select>
                        </div>
                        <div>
                            <label class="block text-slate-600 mb-1 font-semibold">備註 (Remark):</label>
                            <input id="inputRemark" type="text" value="${assetData.remark || ''}" placeholder="請輸入備註 (選填)" 
                                class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-slate-800 focus:outline-none focus:border-blue-500">
                        </div>
                    </div>
                    <div class="flex gap-2 mt-5">
                        <button id="btnSaveForm" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold py-2.5 rounded-xl transition-all shadow-md">確認儲存</button>
                        <button id="btnCloseForm" class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs py-2.5 rounded-xl transition-all">取消</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);

            document.getElementById('btnSaveForm').onclick = () => {
                const eamEl = document.getElementById('inputEam');
                if (!eamEl || !eamEl.value.trim()) { 
                    alert("EAM 編號不能為空！"); 
                    return; 
                }
                const eam = eamEl.value.trim();
                const targetWard = assetData.ward || document.getElementById('wardSelect').value;

                const serialEl = document.getElementById('inputSerial');
                const descEl = document.getElementById('inputDesc');
                const remarkEl = document.getElementById('inputRemark');

                const serialVal = serialEl ? serialEl.value.trim() : (assetData.serial || 'SN');
                const descVal = descEl ? descEl.value : (assetData.description || ASSET_TYPES[0].label);
                const remarkVal = remarkEl ? remarkEl.value.trim() : (assetData.remark || '');

                modal.remove();

                if (isEdit) {
                    assetData.serial = serialVal; 
                    assetData.dept = "NSD"; 
                    assetData.description = descVal; 
                    assetData.remark = remarkVal; 
                    assetData.ward = targetWard;
                    updateAssetInSheet(assetData, assetData.eam);
                } else {
                    const existingAsset = allAssets.find(a => a.eam.toLowerCase() === eam.toLowerCase());
                    if (existingAsset) {
                        existingAsset.block = assetData.block; 
                        existingAsset.floor = assetData.floor; 
                        existingAsset.ward = targetWard;
                        existingAsset.x = assetData.x; 
                        existingAsset.y = assetData.y;

                        alert(`⚠️ 偵測到 EAM [${eam}] 已存在。\n系統已自動幫您將其移動至新位置，原本的詳細資料保持不變！`);
                        updateAssetInSheet(existingAsset, existingAsset.eam);
                    } else {
                        const newAsset = { 
                            eam, 
                            serial: serialVal, 
                            dept: "NSD", 
                            description: descVal, 
                            remark: remarkVal, 
                            block: assetData.block, 
                            floor: assetData.floor, 
                            ward: targetWard, 
                            x: assetData.x, 
                            y: assetData.y 
                        };
                        addNewAssetApi(newAsset);
                    }
                }
            };

            document.getElementById('btnCloseForm').onclick = () => modal.remove();
        }

        function openActionModal(asset) {
            const existingModal = document.getElementById('customActionModal');
            if (existingModal) existingModal.remove();

            const typeConfig = getAssetTypeConfig(asset.description);
            const modal = document.createElement('div');
            modal.id = 'customActionModal';
            modal.className = 'fixed inset-0 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center z-50 p-4';
            modal.innerHTML = `
                <div class="bg-white border border-slate-200 rounded-2xl p-6 w-full max-w-xs shadow-2xl text-slate-800 text-center">
                    <div class="w-10 h-10 mx-auto mb-2 rounded-xl bg-blue-50 flex items-center justify-center border border-blue-100 ${typeConfig.color}">
                        <i class="fa-solid ${typeConfig.icon} text-base"></i>
                    </div>
                    <h3 class="text-xs font-bold mb-1 text-blue-600">${asset.eam}</h3>
                    <p class="text-[11px] text-slate-500 mb-4">${asset.description}</p>
                    
                    <div class="space-y-2">
                        <button id="btnEdit" class="w-full bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold py-2.5 px-4 rounded-xl transition-all shadow flex items-center justify-center gap-2 cursor-pointer">
                            <i class="fa-solid fa-pen-to-square"></i> 更改資產資訊
                        </button>

                        <button id="btnEditRemark" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold py-2.5 px-4 rounded-xl transition-all shadow flex items-center justify-center gap-2 cursor-pointer">
                            <i class="fa-solid fa-note-sticky"></i> 修改備註 (Remark)
                        </button>
                        
                        <button id="btnMove" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold py-2.5 px-4 rounded-xl transition-all shadow flex items-center justify-center gap-2 cursor-pointer">
                            <i class="fa-solid fa-location-crosshairs"></i> 在地圖中點擊更改位置
                        </button>
                        
                        <button id="btnCondemn" class="w-full bg-amber-500 hover:bg-amber-400 text-white text-xs font-semibold py-2.5 px-4 rounded-xl transition-all shadow flex items-center justify-center gap-2 cursor-pointer">
                            <i class="fa-solid fa-file-arrow-up"></i> Condemn / Surplus (報廢/盈餘)
                        </button>
                        <button id="btnDelete" class="w-full bg-rose-600 hover:bg-rose-500 text-white text-xs font-semibold py-2.5 px-4 rounded-xl transition-all shadow flex items-center justify-center gap-2 cursor-pointer">
                            <i class="fa-solid fa-trash"></i> 刪除此資產
                        </button>
                    </div>

                    <button id="btnCloseModal" class="w-full mt-3 bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs py-2 rounded-xl transition-all cursor-pointer">取消</button>
                </div>
            `;
            document.body.appendChild(modal);

            document.getElementById('btnEdit').onclick = () => {
                modal.remove();
                openAssetFormModal(asset, true);
            };

            document.getElementById('btnEditRemark').onclick = () => {
                modal.remove();
                openEditRemarkModal(asset);
            };

            document.getElementById('btnMove').onclick = () => {
                modal.remove();
                isMovingAsset = asset;
                isRelocatingMode = true; 
                const banner = document.getElementById('selectionBanner');
                const bannerText = document.getElementById('bannerText');
                if (banner && bannerText) {
                    banner.classList.remove('hidden');
                    bannerText.innerText = `請在地圖點擊 [${asset.eam}] 的新位置...`;
                }
            
                const mapContainer = document.getElementById('mapContainer');
                if (mapContainer) {
                    mapContainer.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            };

            document.getElementById('btnCondemn').onclick = () => {
                modal.remove();
                if (typeof openCondemnUploadModal === 'function') {
                    openCondemnUploadModal(asset);
                } else {
                    alert("找不到 openCondemnUploadModal 函數！");
                }
            };

            document.getElementById('btnDelete').onclick = () => {
                modal.remove();
                if (confirm(`確定要刪除資產 [${asset.eam}] 嗎？`)) {
                    deleteAssetFromSheet(asset.eam);
                }
            };

            document.getElementById('btnCloseModal').onclick = () => modal.remove();
        }
        
        function cancelRelocate() {
            isMovingAsset = null; isRelocatingMode = false;
            const banner = document.getElementById('selectionBanner');
            if (banner) banner.classList.add('hidden');
        }

        window.openScannerModal = function() {
            const existingModal = document.getElementById('scannerModal');
            if (existingModal) existingModal.remove();

            const modal = document.createElement('div');
            modal.id = 'scannerModal';
            modal.className = 'fixed inset-0 bg-slate-950/80 backdrop-blur-xs flex items-center justify-center z-50 p-4';
            modal.innerHTML = `
                <div class="bg-white border border-slate-200 rounded-2xl p-5 w-full max-w-sm shadow-2xl text-slate-800 text-center">
                    <div class="flex items-center justify-between mb-3">
                        <h3 class="text-xs font-bold text-slate-800 flex items-center gap-2">
                            <i class="fa-solid fa-camera text-blue-600"></i> 即時相機條碼掃描器
                        </h3>
                        <button id="btnCloseScanner" class="text-slate-400 hover:text-slate-600 text-sm p-1 font-bold">✕</button>
                    </div>

                    <div id="qr-reader" class="w-full rounded-xl overflow-hidden bg-slate-900 border border-slate-200 mb-3" style="min-height: 220px;"></div>
                    <p class="text-[11px] text-slate-500">提示：請將條碼或 QR Code 放入視窗中央即可自動讀取。</p>
                </div>
            `;
            document.body.appendChild(modal);

            const html5QrCode = new Html5Qrcode("qr-reader");
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 5, qrbox: { width: 250, height: 130 }, aspectRatio: 1.0 },
                (decodedText) => {
                    html5QrCode.stop().then(() => {
                        modal.remove();
                        handleBarcodeScan(decodedText);
                    });
                },
                () => {}
            ).catch(err => {
                alert("無法啟動相機：" + err);
                modal.remove();
            });

            document.getElementById('btnCloseScanner').onclick = () => {
                if (html5QrCode.isScanning) {
                    html5QrCode.stop().then(() => modal.remove());
                } else {
                    modal.remove();
                }
            };
        };

        function handleBarcodeScan(rawInput) {
            if (!rawInput) return;
            let cleanedEam = String(rawInput).trim().replace(/^0+/, '')
                .replace(/g/gi, '0').replace(/o/gi, '0').replace(/i/gi, '1').replace(/l/gi, '1');

            const targetAsset = allAssets.find(asset => String(asset.eam || '').trim().replace(/^0+/, '').toLowerCase() === cleanedEam.toLowerCase());

            if (targetAsset) {
                locateAndHighlightAsset(targetAsset);
                openActionModal(targetAsset);
            } else {
                const currentWard = document.getElementById('wardSelect').value;
                if (!currentWard) {
                    alert(`掃描到新 EAM [${cleanedEam}]，請先在上方選單選擇目標「單位 (Ward)」！`);
                    return;
                }

                pendingNewAssetEam = cleanedEam;
                isRelocatingMode = false; 
                isMovingAsset = null;

                const banner = document.getElementById('selectionBanner');
                const bannerText = document.getElementById('bannerText');
                if (banner && bannerText) {
                    banner.classList.remove('hidden');
                    bannerText.innerText = `請在地圖點擊新資產 [${cleanedEam}] 的擺放位置...`;
                }

                alert(`已成功識別新 EAM：${cleanedEam}\n請直接在地圖的目標位置點擊一下以完成新增！`);
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            fetchHierarchy();
            fetchAllAssets();

            const img = document.getElementById('floorPlanImg');
            if (img) {
                img.onload = () => {
                    img.classList.remove('hidden');
                    const placeholderText = document.getElementById('placeholderText');
                    if (placeholderText) placeholderText.classList.add('hidden');
                    updateMarkersLayerSize();
                    if (currentFilteredAssets) renderAssetMarkers(currentFilteredAssets);
                };
            }

            window.addEventListener('resize', updateMarkersLayerSize);
        });
    </script>
</body>
