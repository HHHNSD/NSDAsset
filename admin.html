            mapWrapper.style.position = 'relative';
            mapWrapper.style.width = '100%';
            mapWrapper.style.aspectRatio = `${floorPlanImg.naturalWidth} / ${floorPlanImg.naturalHeight}`;
            mapWrapper.style.height = 'auto';
            mapWrapper.style.margin = '0 auto';

            floorPlanImg.style.position = 'absolute';
            floorPlanImg.style.top = '0';
            floorPlanImg.style.left = '0';
            floorPlanImg.style.width = '100%';
            floorPlanImg.style.height = '100%';
            floorPlanImg.style.objectFit = 'contain';

            const currentWidth = floorPlanImg.clientWidth;
            const baseWidth = 1000; 
            let scale = currentWidth / baseWidth;
            
            if (window.innerWidth < 768) {
                scale = scale * 0.25; 
            }

            scale = Math.max(0.2, Math.min(1.0, scale));

            if (markersLayer) {
                markersLayer.style.setProperty('--map-scale', scale);
            }
        }

            const existingDescsFromAssets = (allAssets || [])

            const comboOptions = [...new Map(
                [
                    ...ASSET_TYPES.map(t => [t.label.toLowerCase(), { label: t.label, icon: t.icon, source: 'preset' }]),
                    ...existingDescsFromAssets.map(d => [d.toLowerCase(), { label: d, icon: getAssetTypeConfig(d).icon, source: 'history' }]),
                    ...(currentDesc ? [[currentDesc.toLowerCase(), { label: currentDesc, icon: getAssetTypeConfig(currentDesc).icon, source: 'current' }]] : [])
                ].entries()
            ).values()];

            function getActiveKeywordToken(rawText) {
                const str = String(rawText || '');
                const lastSepIdx = Math.max(str.lastIndexOf(' '), str.lastIndexOf('／'), str.lastIndexOf('/'), str.lastIndexOf(','), str.lastIndexOf('，'), str.lastIndexOf('；'), str.lastIndexOf(';'));
                const tail = lastSepIdx >= 0 ? str.slice(lastSepIdx + 1) : str;
                return tail.trim().toLowerCase();
            }

            function applyComboOptionSelection(chosenLabel, mode = 'replace') {
                if (!descInputEl) return;
                const currentVal = descInputEl.value || '';
                if (mode === 'append') {
                    const base = currentVal.trim();
                    descInputEl.value = base ? `${base} ${chosenLabel}` : chosenLabel;
                } else {
                    descInputEl.value = chosenLabel;
                }
                if (descDropdownEl) descDropdownEl.classList.add('hidden');
                descInputEl.focus();
            }

            function renderDescComboList(showAll = false) {
                if (!descDropdownEl || !descInputEl) return;
                const fullQuery = descInputEl.value.trim().toLowerCase();
                const tokenQuery = showAll ? '' : getActiveKeywordToken(descInputEl.value);

                const matches = comboOptions.filter(opt => {
                    const lbl = opt.label.toLowerCase();
                    if (!tokenQuery) return true;
                    return lbl.includes(tokenQuery) || (fullQuery && lbl.includes(fullQuery));
                });

                const trimmedCustom = descInputEl.value.trim();
                const exactExists = comboOptions.some(o => o.label.toLowerCase() === trimmedCustom.toLowerCase());

                let html = '';
                if (trimmedCustom && !exactExists) {
                    const safeCustom = trimmedCustom.replace(/"/g, '&quot;');
                    html += `
                        <div class="px-3 py-2 bg-blue-50/70 hover:bg-blue-100/80 flex items-center justify-between gap-2 text-xs">
                            <button type="button" data-combo-select="${safeCustom}" data-combo-mode="replace" class="combo-item-btn flex-1 text-left font-bold text-blue-800 truncate cursor-pointer">
                                <i class="fa-solid fa-keyboard mr-1.5 text-blue-600"></i>使用自訂：「${trimmedCustom}」
                            </button>
                        </div>
                    `;
                }

                if (matches.length === 0 && !trimmedCustom) {
                    html += `<div class="px-3 py-3 text-[11px] text-slate-400 text-center">無符合的 Description，可直接輸入自訂文字</div>`;
                } else {
                    html += matches.slice(0, 40).map(opt => {
                        const safeLabel = opt.label.replace(/"/g, '&quot;');
                        const hasBaseText = Boolean(descInputEl.value.trim()) && descInputEl.value.trim().toLowerCase() !== opt.label.toLowerCase();
                        return `
                            <div class="px-3 py-2 hover:bg-slate-50 flex items-center justify-between gap-2 text-xs">
                                <button type="button" data-combo-select="${safeLabel}" data-combo-mode="replace" class="combo-item-btn flex-1 text-left flex items-center gap-2 min-w-0 cursor-pointer">
                                    <i class="fa-solid ${opt.icon || 'fa-box'} text-slate-500 shrink-0"></i>
                                    <span class="font-semibold text-slate-800 truncate">${opt.label}</span>
                                </button>
                                ${hasBaseText ? `
                                    <button type="button" data-combo-select="${safeLabel}" data-combo-mode="append" title="在現有文字後加上此選項"
                                        class="combo-item-btn shrink-0 text-[10px] bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 px-2 py-0.5 rounded-md font-bold cursor-pointer">
                                        + 附加
                                    </button>
                                ` : ''}
                            </div>
                        `;
                    }).join('');
                }

                descDropdownEl.innerHTML = html;
                descDropdownEl.classList.remove('hidden');

                descDropdownEl.querySelectorAll('.combo-item-btn').forEach(btn => {
                    btn.onclick = (ev) => {
                        ev.stopPropagation();
                        const val = btn.getAttribute('data-combo-select') || '';
                        const mode = btn.getAttribute('data-combo-mode') || 'replace';
                        applyComboOptionSelection(val, mode);
                    };
                });
            }

            if (descInputEl && descDropdownEl) {
                descInputEl.addEventListener('focus', () => renderDescComboList(false));
                descInputEl.addEventListener('input', () => renderDescComboList(false));
                modal.addEventListener('click', (ev) => {
                    if (!descDropdownEl.contains(ev.target) && ev.target !== descInputEl && !btnToggleDescCombo?.contains(ev.target)) {
                        descDropdownEl.classList.add('hidden');
                    }
                });
            }

            if (btnToggleDescCombo && descDropdownEl) {
                btnToggleDescCombo.onclick = (ev) => {
                    ev.stopPropagation();
                    if (descDropdownEl.classList.contains('hidden')) {
                        renderDescComboList(true);
                        descInputEl?.focus();
                    } else {
                        descDropdownEl.classList.add('hidden');
                    }
                };
            }

            if (btnClearDescCombo && descInputEl) {
                btnClearDescCombo.onclick = (ev) => {
                    ev.stopPropagation();
                    descInputEl.value = '';
                    renderDescComboList(true);
                    descInputEl.focus();
                };
            }

            document.getElementById('btnSaveForm').onclick = () => {

                    alert("EAM 編號不能為空！"); 
                    return;

                const targetWard = assetData.ward || document.getElementById('wardSelect').value;

                const serialEl = document.getElementById('inputSerial');
                const descEl = document.getElementById('inputDesc');
                const deptEl = document.getElementById('inputDept');
                const remarkEl = document.getElementById('inputRemark');
                const pairEl = document.getElementById('inputPair');

                const serialVal = serialEl ? serialEl.value.trim() : (assetData.serial || 'SN');
                const descVal = descEl ? descEl.value.trim() : (assetData.description || '');
                if (!descVal) {
                    alert("Description 不能為空！");
                    if (descEl) descEl.focus();
                    return;
                }
                const deptVal = deptEl && deptEl.value.trim() ? deptEl.value.trim() : 'NSD';
                const remarkVal = remarkEl ? remarkEl.value.trim() : (assetData.remark || '');
                const pairVal = pairEl ? parsePairedEamList(pairEl.value).filter(x => x.toLowerCase() !== eam.toLowerCase()).join(', ') : (assetData.pair || '');

                modal.remove();

                if (isEdit) {
                    assetData.serial = serialVal; 
                    assetData.dept = deptVal; 
                    assetData.description = descVal; 
                    assetData.remark = remarkVal; 
                    assetData.pair = pairVal;
                    assetData.ward = targetWard;
                    updateAssetInSheet(assetData, assetData.eam);
                } else {
                    const existingAsset = allAssets.find(a => a.eam.toLowerCase() === eam.toLowerCase());
                    if (existingAsset) {
                        if (isLockedStatusWard(existingAsset.ward)) {
                            alert(`⚠️ Asset [${eam}] 已處於 [${existingAsset.ward}] 狀態，不可直接在地圖移動。`);

                        if (pairVal) existingAsset.pair = pairVal;

                            targetWard,
                            assetData.x,
                            assetData.y

                            serial: serialVal, 
                            dept: deptVal, 
                            description: descVal, 
                            remark: remarkVal,
                            pair: pairVal,
                            block: assetData.block, 
                            floor: assetData.floor, 
                            ward: targetWard, 
                            x: assetData.x, 
                            y: assetData.y

                        addNewAssetApi(newAsset);
                    }
                }
            };

            document.getElementById('btnCloseForm').onclick = () => modal.remove();
        }

        // ========== 商場指南式搖桿控制邏輯 ==========
        let joyUserScale = 1.0;
        let joyOffsetX = 0;
        let joyOffsetY = 0;
        let isDraggingJoystick = false;
        let dragStartPointerX = 0;
        let dragStartPointerY = 0;
        let dragStartOffsetX = 0;
        let dragStartOffsetY = 0;
        let hasStartedWardNavigationFromTGF = false;

        function computeResponsiveJoystickScale() {
            const mapWrapper = document.getElementById('mapWrapper');
            const wrapperWidth = mapWrapper ? mapWrapper.clientWidth : window.innerWidth;
            const autoFactor = Math.max(0.55, Math.min(1.0, wrapperWidth / 640));
            return parseFloat((autoFactor * joyUserScale).toFixed(2));
        }

        function applyJoystickTransform() {
            const pad = document.getElementById('kioskJoystick');
            if (!pad) return;
            const finalScale = computeResponsiveJoystickScale();
            pad.style.transform = `translate3d(${joyOffsetX}px, ${joyOffsetY}px, 0) scale(${finalScale})`;
        }

        function adjustJoystickScale(delta) {
            joyUserScale = Math.max(0.5, Math.min(1.45, parseFloat((joyUserScale + delta).toFixed(2))));
            applyJoystickTransform();
        }

        function resetJoystickTransform() {
            joyUserScale = 1.0;
            joyOffsetX = 0;
            joyOffsetY = 0;
            applyJoystickTransform();
        }

        function initJoystickInteractions() {
            const pad = document.getElementById('kioskJoystick');
            const handle = document.getElementById('joystickDragHandle');
            if (!pad || !handle) return;

            handle.addEventListener('pointerdown', (e) => {
                if (e.button !== undefined && e.button !== 0 && e.pointerType === 'mouse') return;
                e.stopPropagation();
                isDraggingJoystick = true;
                dragStartPointerX = e.clientX;
                dragStartPointerY = e.clientY;
                dragStartOffsetX = joyOffsetX;
                dragStartOffsetY = joyOffsetY;
                try { handle.setPointerCapture(e.pointerId); } catch (_) {}
            });

            handle.addEventListener('pointermove', (e) => {
                if (!isDraggingJoystick) return;
                e.stopPropagation();
                const dx = e.clientX - dragStartPointerX;
                const dy = e.clientY - dragStartPointerY;

                const mapWrapper = document.getElementById('mapWrapper');
                const maxX = mapWrapper ? Math.max(20, mapWrapper.clientWidth - 90) : 400;
                const maxY = mapWrapper ? Math.max(20, mapWrapper.clientHeight - 90) : 400;

                joyOffsetX = Math.max(-60, Math.min(maxX, dragStartOffsetX + dx));
                joyOffsetY = Math.max(-maxY, Math.min(60, dragStartOffsetY + dy));
                applyJoystickTransform();
            });

            const stopDrag = (e) => {
                if (!isDraggingJoystick) return;
                isDraggingJoystick = false;
                try { handle.releasePointerCapture(e.pointerId); } catch (_) {}
            };

            handle.addEventListener('pointerup', stopDrag);
            handle.addEventListener('pointercancel', stopDrag);
            applyJoystickTransform();
        }

        function normalizeJoyKey(val) {
            return String(val || '').trim().toLowerCase().replace(/[^a-z0-9]/g, '');
        }

        function parseFloorOrderRank(floorStr) {
            const s = String(floorStr || '').trim().toUpperCase();
            if (!s) return 999;
            if (s.includes('B2') || s === '-2' || s === '2/F B') return -20;
            if (s.includes('B1') || s === '-1' || s === '1/F B') return -10;
            if (s === 'G/F' || s === 'GF' || s === 'G') return 0;
            const m = s.match(/(\d+)\s*\/\s*F/) || s.match(/^(\d+)F?$/);
            if (m) return parseInt(m[1], 10);
            if (s.includes('SYSTEM')) return 500;
            return 200;
        }

        function getOrderedBlockList() {
            const blockSelect = document.getElementById('blockSelect');
            const rawBlocks = blockSelect
                ? Array.from(blockSelect.options).map(o => o.value).filter(v => v && v.trim() !== '')
                : [...new Set((floorHierarchyData || []).map(h => h.block).filter(Boolean))];

            const priorityOrder = [
                { keys: ['t', 'tblock'], rank: 1 },
                { keys: ['m', 'mainblock', 'mblock'], rank: 2 },
                { keys: ['annex', 'annexbuilding'], rank: 3 },
                { keys: ['system', 'sys'], rank: 4 }
            ];

            function getBlockRank(b) {
                const nb = normalizeJoyKey(b);
                for (const item of priorityOrder) {
                    if (item.keys.some(k => nb === k || nb.includes(k))) {
                        return item.rank;
                    }
                }
                return 99;
            }

            return [...new Set(rawBlocks)].sort((a, b) => {
                const ra = getBlockRank(a);
                const rb = getBlockRank(b);
                if (ra !== rb) return ra - rb;
                return String(a).localeCompare(String(b));
            });
        }

        function getOrderedFloorsForBlock(blockVal) {
            const targetBlock = String(blockVal || '').trim();
            if (!targetBlock) return [];

            const items = (floorHierarchyData || []).filter(
                h => String(h.block || '').trim().toLowerCase() === targetBlock.toLowerCase() && h.floor
            );
            const floors = [...new Set(items.map(h => String(h.floor).trim()))];

            const nb = normalizeJoyKey(targetBlock);
            const explicitSeq = nb.startsWith('t')
                ? ['G/F', '1/F', '2/F', '3/F', '4/F', '5/F']
                : (nb.startsWith('m') || nb.includes('main'))
                    ? ['G/F', '1/F', '2/F', '3/F', '4/F']
                    : null;

            return floors.sort((a, b) => {
                const ua = a.toUpperCase();
                const ub = b.toUpperCase();
                if (explicitSeq) {
                    const ia = explicitSeq.indexOf(ua);
                    const ib = explicitSeq.indexOf(ub);
                    if (ia !== -1 && ib !== -1) return ia - ib;
                    if (ia !== -1) return -1;
                    if (ib !== -1) return 1;
                }
                const ra = parseFloorOrderRank(ua);
                const rb = parseFloorOrderRank(ub);
                if (ra !== rb) return ra - rb;
                return ua.localeCompare(ub, undefined, { numeric: true });
            });
        }

        function getOrderedWardsForBlockFloor(blockVal, floorVal) {
            const bKey = String(blockVal || '').trim().toLowerCase();
            const fKey = String(floorVal || '').trim().toLowerCase();
            return (floorHierarchyData || [])
                .filter(h =>
                    String(h.block || '').trim().toLowerCase() === bKey &&
                    String(h.floor || '').trim().toLowerCase() === fKey &&
                    h.wardKey
                )
                .map(h => String(h.wardKey).trim());
        }

        function buildGlobalNavigationSlots() {
            const slots = [];
            const orderedBlocks = getOrderedBlockList();

            orderedBlocks.forEach(blk => {
                const floors = getOrderedFloorsForBlock(blk);
                floors.forEach(flr => {
                    const wards = getOrderedWardsForBlockFloor(blk, flr);
                    if (wards.length > 0) {
                        wards.forEach(wKey => {
                            slots.push({ block: blk, floor: flr, ward: wKey });
                        });
                    } else {
                        slots.push({ block: blk, floor: flr, ward: '' });
                    }
                });
            });

            return slots;
        }

        function getTBlockGFStartSlot(slots) {
            const list = Array.isArray(slots) && slots.length > 0 ? slots : buildGlobalNavigationSlots();
            if (list.length === 0) return null;

            const tGF = list.find(s => {
                const nb = normalizeJoyKey(s.block);
                const nf = normalizeJoyKey(s.floor);
                return nb.startsWith('t') && (nf === 'gf' || nf === 'g');
            });
            if (tGF) return tGF;

            const tAny = list.find(s => normalizeJoyKey(s.block).startsWith('t'));
            return tAny || list[0];
        }

        function applyNavigationSlot(slot) {
            if (!slot) return;
            const blockSelect = document.getElementById('blockSelect');
            const floorSelect = document.getElementById('floorSelect');
            const wardSelect = document.getElementById('wardSelect');
            if (!blockSelect || !floorSelect || !wardSelect) return;

            blockSelect.value = slot.block || '';
            onBlockChange();

            if (slot.floor) {
                const fOpt = Array.from(floorSelect.options).find(
                    o => String(o.value || '').trim().toLowerCase() === String(slot.floor).trim().toLowerCase()
                );
                floorSelect.value = fOpt ? fOpt.value : slot.floor;
                onFloorChange();
            }

            if (slot.ward) {
                const wOpt = Array.from(wardSelect.options).find(
                    o => String(o.value || '').trim().toLowerCase() === String(slot.ward).trim().toLowerCase()
                );
                wardSelect.value = wOpt ? wOpt.value : slot.ward;
                onWardChange();
            } else if (wardSelect.options.length > 1) {
                wardSelect.selectedIndex = 1;
                onWardChange();
            }

            syncCurrentSelectedUnitAndJoystick(
                blockSelect.value || '',
                floorSelect.value || '',
                wardSelect.value || ''
            );
        }

        function resolveMatchingBlockValue(quadKey) {
            const orderedBlocks = getOrderedBlockList();
            const q = normalizeJoyKey(quadKey);
            if (!q) return '';

            if (q === 't' || q === 'tblock') {
                return orderedBlocks.find(b => {
                    const nb = normalizeJoyKey(b);
                    return nb === 't' || nb === 'tblock' || nb.startsWith('t');
                }) || '';
            }
            if (q === 'm' || q === 'mblock' || q === 'mainblock') {
                return orderedBlocks.find(b => {
                    const nb = normalizeJoyKey(b);
                    return nb === 'm' || nb === 'mblock' || nb.includes('main') || nb.startsWith('m');
                }) || '';
            }
            if (q === 'annex' || q === 'annexbuilding') {
                return orderedBlocks.find(b => normalizeJoyKey(b).includes('annex')) || '';
            }
            if (q === 'system' || q === 'sys') {
                return orderedBlocks.find(b => normalizeJoyKey(b).includes('sys')) || '';
            }

            return orderedBlocks.find(b => normalizeJoyKey(b) === q)
                || orderedBlocks.find(b => normalizeJoyKey(b).includes(q) || q.includes(normalizeJoyKey(b)))
                || '';
        }

        function getCurrentWardNameOnly() {

            return wardVal;
        }

            const quadThemeMap = {

                }
            };

            document.querySelectorAll('.joy-block-quad').forEach(btn => {
                const quadKey = String(btn.getAttribute('data-joy-block') || '').toUpperCase();
                const theme = quadThemeMap[quadKey] || quadThemeMap.T;
                const allThemeClasses = [
                    ...theme.idle, ...theme.active,
                    ...theme.mainIdle, ...theme.mainActive,
                    ...theme.subIdle, ...theme.subActive
                ];
                btn.classList.remove(...allThemeClasses);

                const mainLabel = btn.querySelector('.joy-main-label');
                const subLabel = btn.querySelector('.joy-sub-label');
                if (mainLabel) mainLabel.classList.remove(...theme.mainIdle, ...theme.mainActive);
                if (subLabel) subLabel.classList.remove(...theme.subIdle, ...theme.subActive);

                const resolved = resolveMatchingBlockValue(quadKey);
                const isActive = Boolean(resolved && blockVal && resolved.toLowerCase() === blockVal.toLowerCase());

                if (isActive) {
                    btn.classList.add(...theme.active);
                    if (mainLabel) mainLabel.classList.add(...theme.mainActive);
                    if (subLabel) subLabel.classList.add(...theme.subActive);
                } else {
                    btn.classList.add(...theme.idle);
                    if (mainLabel) mainLabel.classList.add(...theme.mainIdle);
                    if (subLabel) subLabel.classList.add(...theme.subIdle);
                }
            });

            applyJoystickTransform();
        }

        function selectJoystickBlock(quadKey) {
            const matchedBlock = resolveMatchingBlockValue(quadKey);
            if (!matchedBlock) {
                alert(`找不到對應的棟別：${quadKey}`);
                return;
            }

            hasStartedWardNavigationFromTGF = true;
            const floors = getOrderedFloorsForBlock(matchedBlock);
            const firstFloor = floors[0] || '';
            const wards = firstFloor ? getOrderedWardsForBlockFloor(matchedBlock, firstFloor) : [];
            applyNavigationSlot({
                block: matchedBlock,
                floor: firstFloor,
                ward: wards[0] || ''
            });
        }

        function stepFloorWithBlockTransition(floorStep) {
            const slots = buildGlobalNavigationSlots();
            if (slots.length === 0) return;

            hasStartedWardNavigationFromTGF = true;
            const curBlock = String(document.getElementById('blockSelect')?.value || '').trim();
            const curFloor = String(document.getElementById('floorSelect')?.value || '').trim();

            if (!curBlock) {
                applyNavigationSlot(getTBlockGFStartSlot(slots) || slots[0]);
                return;
            }

            const orderedBlocks = getOrderedBlockList();
            const bIdx = orderedBlocks.findIndex(b => b.toLowerCase() === curBlock.toLowerCase());
            if (bIdx === -1) {
                applyNavigationSlot(getTBlockGFStartSlot(slots) || slots[0]);
                return;
            }

            const floorsInBlock = getOrderedFloorsForBlock(orderedBlocks[bIdx]);
            const fIdx = floorsInBlock.findIndex(f => f.toLowerCase() === curFloor.toLowerCase());

            if (floorStep > 0) {
                if (fIdx !== -1 && fIdx + 1 < floorsInBlock.length) {
                    const nextFloor = floorsInBlock[fIdx + 1];
                    const nextWards = getOrderedWardsForBlockFloor(orderedBlocks[bIdx], nextFloor);
                    applyNavigationSlot({ block: orderedBlocks[bIdx], floor: nextFloor, ward: nextWards[0] || '' });
                } else {
                    const nextBlockIdx = (bIdx + 1) % orderedBlocks.length;
                    const nextBlock = orderedBlocks[nextBlockIdx];
                    const nextBlockFloors = getOrderedFloorsForBlock(nextBlock);
                    const targetFloor = nextBlockFloors[0] || '';
                    const targetWards = targetFloor ? getOrderedWardsForBlockFloor(nextBlock, targetFloor) : [];
                    applyNavigationSlot({ block: nextBlock, floor: targetFloor, ward: targetWards[0] || '' });
                }
            } else {
                if (fIdx > 0) {
                    const prevFloor = floorsInBlock[fIdx - 1];
                    const prevWards = getOrderedWardsForBlockFloor(orderedBlocks[bIdx], prevFloor);
                    applyNavigationSlot({ block: orderedBlocks[bIdx], floor: prevFloor, ward: prevWards[0] || '' });
                } else {
                    const prevBlockIdx = (bIdx - 1 + orderedBlocks.length) % orderedBlocks.length;
                    const prevBlock = orderedBlocks[prevBlockIdx];
                    const prevBlockFloors = getOrderedFloorsForBlock(prevBlock);
                    const targetFloor = prevBlockFloors[prevBlockFloors.length - 1] || '';
                    const targetWards = targetFloor ? getOrderedWardsForBlockFloor(prevBlock, targetFloor) : [];
                    applyNavigationSlot({ block: prevBlock, floor: targetFloor, ward: targetWards[0] || '' });
                }
            }
        }

        function cycleJoystickFloor(direction = 1) {
            stepFloorWithBlockTransition(direction);
        }

        function cycleJoystickWard(direction = 1) {
            const slots = buildGlobalNavigationSlots();
            if (slots.length === 0) return;

            const startSlot = getTBlockGFStartSlot(slots) || slots[0];
            if (!hasStartedWardNavigationFromTGF) {
                hasStartedWardNavigationFromTGF = true;
                applyNavigationSlot(startSlot);
                return;
            }

            const curBlock = String(document.getElementById('blockSelect')?.value || '').trim().toLowerCase();
            const curFloor = String(document.getElementById('floorSelect')?.value || '').trim().toLowerCase();
            const curWard = String(document.getElementById('wardSelect')?.value || '').trim().toLowerCase();

            let currentSlotIdx = slots.findIndex(s =>
                s.block.toLowerCase() === curBlock &&
                s.floor.toLowerCase() === curFloor &&
                s.ward.toLowerCase() === curWard
            );

            if (currentSlotIdx === -1) {
                currentSlotIdx = slots.findIndex(s =>
                    s.block.toLowerCase() === curBlock &&
                    s.floor.toLowerCase() === curFloor
                );
            }

            if (currentSlotIdx === -1) {
                applyNavigationSlot(startSlot);
                return;
            }

            const nextSlotIdx = (currentSlotIdx + (direction >= 0 ? 1 : -1) + slots.length) % slots.length;
            applyNavigationSlot(slots[nextSlotIdx]);
        }

        function exportPendingActionCsv() {
            if (pendingActionList.length === 0) {
                alert('目前未登記 Asset 清單沒有資料可匯出！');
                return;
            }

            const escapeCsvCell = (val) => {
                const str = String(val ?? '');
                if (/[",\r\n]/.test(str)) {
                    return `"${str.replace(/"/g, '""')}"`;
                }
                return str;
            };

            const headers = ['Action Type', 'EAM Number', 'Serial Number', 'Description', 'Location', 'Remarks'];
            const rows = pendingActionList.map(item => {
                const live = findAssetByEam(item.eam);
                const actionType = item.actionType === 'Transfer' ? 'Transfer' : 'Condemn/Surplus';
                const eamNum = String((live && live.eam) || item.eam || '').trim();
                const serialNum = normalizeSerialValue((live && live.serial) || item.serial);
                const desc = String((live && live.description) || item.description || '').trim();
                const loc = String((live && live.ward) || item.ward || '').trim();
                const rem = item.remarksSummary || (
                    item.actionType === 'Transfer'
                        ? `Ward: ${item.targetWard || '-'} | Reason: ${item.reason || '-'}`
                        : `損壞: ${item.faultRemark || '-'} | 跟進/單號: ${item.followupRemark || '-'}`
                );
                return [actionType, eamNum, serialNum, desc, loc, rem].map(escapeCsvCell).join(',');
            });

            const csvContent = '\uFEFF' + [headers.join(','), ...rows].join('\r\n');
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);

            const now = new Date();
            const pad = (n) => String(n).padStart(2, '0');
            const dateTag = `${now.getFullYear()}${pad(now.getMonth() + 1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}`;
            const fileName = `NSD_Unregistered_Transfer_Condemn_Surplus_${dateTag}.csv`;

            const link = document.createElement('a');
            link.href = url;
            link.setAttribute('download', fileName);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        // ========== Stocktake 記錄與四個核心名詞比對邏輯 ==========
        // 四個名詞統一：
        // 1. 非所屬 Asset：報表中的 Unidentified 項目僅顯示其 EAM 和 OWNER，並集中於「非所屬 Asset」欄位點擊查看（不混入一般地圖 Asset 列表）。
        // 2. 已掃描 Asset（原 Successful）：核對系統清單（EAM + S/N）是否有此物品；若找不到則歸入「未登記 Asset」；已核對找到的則列為「已掃描 Asset」（不 Highlight）。
        // 3. 未掃描 Asset（原 Unscanned Asset）：核對系統清單（EAM + S/N）是否有此物品；若找不到則歸入「未登記 Asset」；有找到的則列為「未掃描 Asset」並於地圖 Highlight。
        // 4. 未登記 Asset：報表有但系統清單（EAM + S/N + Description）找不到、待補登的物品，記錄表與分類皆統一使用「未登記 Asset」。

        let stocktakeSessions = [];
        let activeStocktakeSessionId = null;
        let stocktakeMapOverlayEnabled = false;

        function ensureSessionBuckets(session) {
            if (!session || typeof session !== 'object') return session;
            if (typeof session.selectedForMap !== 'boolean') {
                session.selectedForMap = session.id === activeStocktakeSessionId;
            }
            if (!Array.isArray(session.unscanned)) session.unscanned = [];
            if (!Array.isArray(session.scanned)) {
                session.scanned = Array.isArray(session.successful) ? [...session.successful] : [];
            }
            if (!Array.isArray(session.nonBelonging)) {
                session.nonBelonging = Array.isArray(session.unidentified) ? [...session.unidentified] : [];
            }
            if (!Array.isArray(session.unregistered)) {
                session.unregistered = [];
            }
            return session;
        }

        function getCheckedStocktakeSessions() {
            if (!Array.isArray(stocktakeSessions) || stocktakeSessions.length === 0) return [];
            const checked = stocktakeSessions.filter(s => Boolean(s && s.selectedForMap));
            if (checked.length > 0) return checked;
            const active = getActiveStocktakeSession();
            return active ? [active] : [];
        }

        function getMergedUnscannedSetFromCheckedSessions() {
            const set = new Set();
            const sessions = getCheckedStocktakeSessions();
            sessions.forEach(s => {
                const ens = ensureSessionBuckets(s);
                (ens.unscanned || []).forEach(u => {
                    const kEam = normalizeLookupKey(u.matchedEam || u.eam);
                    const kSn = normalizeLookupKey(u.matchedSerial || u.serial);
                    if (kEam) set.add(`eam:${kEam}`);
                    if (kSn && kSn !== 'na') set.add(`sn:${kSn}`);
                });
            });
            return set;
        }

        function getUnscannedEamSetForMode() {
            if (!stocktakeMapOverlayEnabled) return null;
            const set = new Set();
            const sessions = getCheckedStocktakeSessions();
            sessions.forEach(s => {
                const ens = ensureSessionBuckets(s);
                (ens.unscanned || []).forEach(u => {
                    const k = normalizeLookupKey(u.matchedEam || u.eam);
                    if (k) set.add(k);
                });
            });
            return set;
        }

        function filterAssetsForRightPanel(list) {
            const unscannedSet = getUnscannedEamSetForMode();
            if (!unscannedSet) return list;
            return (list || []).filter(item => {
                const k = normalizeLookupKey(item && item.eam);
                return k && unscannedSet.has(k);
            });
        }

        async function fetchStocktakeSessionsFromSheet() {
            try {
                const res = await fetch(`${GAS_API_URL}?action=getStocktakeSessions&_t=${Date.now()}`);
                const data = await res.json();
                if (Array.isArray(data)) {
                    const prevSelectedMap = new Map(
                        (stocktakeSessions || []).map(s => [s.id, Boolean(s.selectedForMap)])
                    );
                    stocktakeSessions = data.map((s, idx) => {
                        const ens = ensureSessionBuckets(s);
                        if (prevSelectedMap.has(ens.id)) {
                            ens.selectedForMap = prevSelectedMap.get(ens.id);
                        } else {
                            ens.selectedForMap = idx === 0;
                        }
                        return ens;
                    });
                    if (!activeStocktakeSessionId || !stocktakeSessions.some(s => s.id === activeStocktakeSessionId)) {
                        activeStocktakeSessionId = stocktakeSessions.length > 0 ? stocktakeSessions[0].id : null;
                    }
                    updateStocktakeBadges();
                    renderSidebarWithPriority();
                    const wardVal = document.getElementById('wardSelect')?.value || '';
                    if (wardVal && stocktakeMapOverlayEnabled) {
                        renderAssetMarkers(currentFilteredAssets);
                    }
                }
            } catch (err) {
                console.warn('讀取 Google Sheet Stocktake 記錄失敗:', err);
            }
        }

        async function saveStocktakeSessionToSheet(session) {
            const res = await fetch(GAS_API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'saveStocktakeSession', session })
            }).then(r => r.json());

            if (res && res.status === 'error') {
                throw new Error(res.message || '寫入 Google Sheet 失敗');
            }
        }

        async function deleteStocktakeSession(sessionId) {
            if (!confirm('確定要從 Google Sheet 刪除此筆 Stocktake 記錄嗎？')) return;
            try {
                const res = await fetch(GAS_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'deleteStocktakeSession', sessionId })
                }).then(r => r.json());

                if (res && res.status === 'error') {
                    throw new Error(res.message || '刪除失敗');
                }

                stocktakeSessions = stocktakeSessions.filter(s => s.id !== sessionId);
                if (activeStocktakeSessionId === sessionId) {

        function normalizeLookupKey(val) {
            return String(val ?? '')
                .normalize('NFKC')
                .replace(/\u00a0/g, ' ')
                .trim()
                .replace(/^0+/, '')
                .toLowerCase();
        }

        function findSystemAssetForReportRow(row) {
            const rawEam = String(row.eam || '').trim();
            const rawSerial = String(row.serial || '').trim();
            const kEam = normalizeLookupKey(rawEam);
            const kSn = normalizeLookupKey(rawSerial);

            const hasValidEam = Boolean(kEam && !['n/a', 'na', 'none', 'nil', '-'].includes(kEam));
            const hasValidSn = Boolean(kSn && !['n/a', 'na', 'none', 'nil', '-'].includes(kSn));

            const assetPool = (allAssets || []).filter(a => !isNonAssetItem(a));
            if (assetPool.length === 0) return null;

            if (hasValidEam && hasValidSn) {
                const exactBoth = assetPool.find(a =>
                    normalizeLookupKey(a.eam) === kEam && normalizeLookupKey(a.serial) === kSn
                );
                if (exactBoth) return exactBoth;
            }

            if (hasValidEam) {
                const byEam = assetPool.find(a => normalizeLookupKey(a.eam) === kEam);
                if (byEam) return byEam;
            }

            if (hasValidSn) {
                const bySn = assetPool.find(a => normalizeLookupKey(a.serial) === kSn);
                if (bySn) return bySn;
            }

            return null;
        }

        function classifyStocktakeRows(parsedRows) {
            const unscanned = [];     // 未掃描 Asset
            const scanned = [];       // 已掃描 Asset
            const nonBelonging = [];  // 非所屬 Asset
            const unregistered = [];  // 未登記 Asset

            parsedRows.forEach(row => {
                const statusLower = String(row.status || '').trim().toLowerCase();
                const isNonBelongingStatus =
                    statusLower.includes('unidentified') ||
                    statusLower.includes('非所屬') ||
                    statusLower.includes('non-belonging') ||
                    statusLower.includes('other dept') ||
                    statusLower.includes('not in dept');

                if (isNonBelongingStatus) {
                    nonBelonging.push({
                        eam: String(row.eam || '').trim() || 'N/A',
                        owner: String(row.owner || row.dept || row.ward || row.description || '').trim() || 'N/A'
                    });
                    return;
                }

                const isScannedStatus =
                    statusLower.includes('success') ||
                    statusLower.includes('scanned') ||
                    statusLower.includes('matched') ||
                    statusLower.includes('found') ||
                    statusLower.includes('已掃描');

                const matchedSystemAsset = findSystemAssetForReportRow(row);

                if (isScannedStatus) {
                    if (matchedSystemAsset) {
                        scanned.push({
                            eam: String(row.eam || matchedSystemAsset.eam || '').trim() || 'N/A',
                            serial: normalizeSerialValue(row.serial || matchedSystemAsset.serial),
                            description: String(matchedSystemAsset.description || row.description || '').trim() || '無類型',
                            ward: String(matchedSystemAsset.ward || row.ward || '').trim() || 'N/A',
                            matchedEam: String(matchedSystemAsset.eam || '').trim(),
                            matchedSerial: normalizeSerialValue(matchedSystemAsset.serial)
                        });
                    } else {
                        unregistered.push({
                            eam: String(row.eam || '').trim() || 'N/A',
                            serial: normalizeSerialValue(row.serial),
                            description: String(row.description || '').trim() || '未登記項目',
                            ward: String(row.ward || '').trim() || 'N/A'
                        });
                    }
                    return;
                }

                if (matchedSystemAsset) {
                    unscanned.push({
                        eam: String(row.eam || matchedSystemAsset.eam || '').trim() || 'N/A',
                        serial: normalizeSerialValue(row.serial || matchedSystemAsset.serial),
                        description: String(matchedSystemAsset.description || row.description || '').trim() || '無類型',
                        ward: String(matchedSystemAsset.ward || row.ward || '').trim() || 'N/A',
                        matchedEam: String(matchedSystemAsset.eam || '').trim(),
                        matchedSerial: normalizeSerialValue(matchedSystemAsset.serial)
                    });
                } else {
                    unregistered.push({
                        eam: String(row.eam || '').trim() || 'N/A',
                        serial: normalizeSerialValue(row.serial),
                        description: String(row.description || '').trim() || '未登記項目',
                        ward: String(row.ward || '').trim() || 'N/A'
                    });
                }
            });

            return { unscanned, scanned, nonBelonging, unregistered };
        }

        function parseStocktakeRowsFromMatrix(matrix) {
            if (!Array.isArray(matrix) || matrix.length === 0) return [];
            let headerRowIdx = -1;
            let colMap = { eam: -1, serial: -1, description: -1, status: -1, owner: -1, ward: -1 };

            for (let r = 0; r < Math.min(matrix.length, 25); r++) {
                const row = matrix[r] || [];
                const tempMap = { eam: -1, serial: -1, description: -1, status: -1, owner: -1, ward: -1 };
                let score = 0;

                row.forEach((cell, cIdx) => {
                    const h = String(cell ?? '').trim().toLowerCase();
                    if (!h) return;
                    if (h === 'eam' || h.includes('eam') || h.includes('asset no') || h.includes('asset id') || h.includes('編號')) {
                        if (tempMap.eam === -1) tempMap.eam = cIdx;
                        score++;
                    }
                    if (h === 's/n' || h === 'sn' || h.includes('serial') || h.includes('序號')) {
                        if (tempMap.serial === -1) tempMap.serial = cIdx;
                        score++;
                    }
                    if (h.includes('desc') || h.includes('type') || h.includes('name') || h.includes('item') || h.includes('類型') || h.includes('名稱') || h.includes('描述')) {
                        if (tempMap.description === -1) tempMap.description = cIdx;
                        score++;
                    }
                    if (h.includes('status') || h.includes('result') || h.includes('state') || h.includes('狀態') || h.includes('結果')) {
                        if (tempMap.status === -1) tempMap.status = cIdx;
                        score++;
                    }
                    if (h.includes('owner') || h.includes('custodian') || h.includes('dept') || h.includes('部門') || h.includes('所屬')) {
                        if (tempMap.owner === -1) tempMap.owner = cIdx;
                        score++;
                    }
                    if (h.includes('ward') || h.includes('loc') || h.includes('單位') || h.includes('位置')) {
                        if (tempMap.ward === -1) tempMap.ward = cIdx;
                        score++;
                    }
                });

                if (score >= 2 || (tempMap.eam !== -1 && (tempMap.status !== -1 || tempMap.serial !== -1 || tempMap.description !== -1))) {
                    headerRowIdx = r;
                    colMap = tempMap;
                    break;
                }
            }

            const startIdx = headerRowIdx >= 0 ? headerRowIdx + 1 : 0;
            if (headerRowIdx === -1) {
                colMap = { eam: 0, serial: 1, description: 2, status: 3, owner: 4, ward: 5 };
            }

            const results = [];
            for (let i = startIdx; i < matrix.length; i++) {
                const row = matrix[i] || [];
                const eamVal = colMap.eam >= 0 ? String(row[colMap.eam] ?? '').trim() : '';
                const serialVal = colMap.serial >= 0 ? String(row[colMap.serial] ?? '').trim() : '';
                const descVal = colMap.description >= 0 ? String(row[colMap.description] ?? '').trim() : '';
                const statusVal = colMap.status >= 0 ? String(row[colMap.status] ?? '').trim() : '';
                const ownerVal = colMap.owner >= 0 ? String(row[colMap.owner] ?? '').trim() : '';
                const wardVal = colMap.ward >= 0 ? String(row[colMap.ward] ?? '').trim() : '';

                if (!eamVal && !serialVal && !descVal && !statusVal) continue;
                const combinedLower = `${eamVal} ${serialVal} ${descVal} ${statusVal}`.toLowerCase();
                if (combinedLower.includes('total') || combinedLower.includes('總計') || combinedLower.includes('summary')) continue;

                results.push({
                    eam: eamVal,
                    serial: serialVal,
                    description: descVal,
                    status: statusVal,
                    owner: ownerVal,
                    ward: wardVal
                });
            }
            return results;
        }

        function parseCsvTextToMatrix(text) {
            const rows = [];
            let curRow = [];
            let curVal = '';
            let inQuotes = false;

            for (let i = 0; i < text.length; i++) {
                const ch = text[i];
                const next = text[i + 1];

                if (inQuotes) {
                    if (ch === '"' && next === '"') {
                        curVal += '"';
                        i++;
                    } else if (ch === '"') {
                        inQuotes = false;
                    } else {
                        curVal += ch;
                    }
                } else {
                    if (ch === '"') {
                        inQuotes = true;
                    } else if (ch === ',') {
                        curRow.push(curVal);
                        curVal = '';
                    } else if (ch === '\r' && next === '\n') {
                        curRow.push(curVal);
                        rows.push(curRow);
                        curRow = [];
                        curVal = '';
                        i++;
                    } else if (ch === '\n' || ch === '\r') {
                        curRow.push(curVal);
                        rows.push(curRow);
                        curRow = [];
                        curVal = '';
                    } else {
                        curVal += ch;
                    }
                }
            }
            if (curVal.length > 0 || curRow.length > 0) {
                curRow.push(curVal);
                rows.push(curRow);
            }
            return rows;
        }

        async function parseStocktakeFile(file) {
            const fileName = String(file.name || '').toLowerCase();
            if (fileName.endsWith('.csv') || fileName.endsWith('.txt')) {
                const text = await file.text();
                return parseStocktakeRowsFromMatrix(parseCsvTextToMatrix(text));
            }
            const buffer = await file.arrayBuffer();
            const workbook = XLSX.read(buffer, { type: 'array' });
            const firstSheetName = workbook.SheetNames[0];
            const sheet = workbook.Sheets[firstSheetName];
            const matrix = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
            return parseStocktakeRowsFromMatrix(matrix);
        }

                                                <p class="text-[11px] text-slate-700 truncate">${item.description || ''}</p>
                                            </div>
                                            <span class="text-[10px] bg-rose-100 text-rose-700 px-2 py-0.5 rounded-md font-bold shrink-0">${item.ward || 'N/A'}</span>
                                        </div>
                                    `).join('')}
                                </div>
                            `}
                        </div>

                        <!-- 2. 已掃描 Asset（核對系統清單有找到 -> 不 Highlight） -->
                        <div class="border border-emerald-200 rounded-2xl p-3 bg-emerald-50/30">
                            <div class="font-bold text-emerald-700 mb-2 flex items-center justify-between">
                                <span><i class="fa-solid fa-circle-check mr-1"></i> 已掃描 Asset（核對系統清單已確認，不 Highlight）</span>
                                <span class="bg-emerald-600 text-white text-[10px] px-2 py-0.5 rounded-full">${scanned.length}</span>
                            </div>
                            ${scanned.length === 0 ? '<p class="text-[11px] text-slate-400">無已掃描 Asset</p>' : `
                                <div class="space-y-1.5 max-h-40 overflow-y-auto">
                                    ${scanned.map(item => `
                                        <div data-locate-eam="${item.matchedEam || item.eam}" class="stocktake-locate-row bg-white border border-emerald-100 hover:border-emerald-400 rounded-xl px-3 py-2 flex items-center justify-between gap-2 cursor-pointer">
                                            <div class="min-w-0">
                                                <span class="font-bold text-emerald-800">${item.eam}</span>
                                                <span class="text-[11px] text-slate-500 ml-2">SN: ${item.serial || 'N/A'}</span>
                                                <p class="text-[11px] text-slate-700 truncate">${item.description || ''}</p>
                                            </div>
                                            <span class="text-[10px] bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-md font-bold shrink-0">${item.ward || 'N/A'}</span>
                                        </div>
                                    `).join('')}
                                </div>
                            `}
                        </div>

                        <!-- 3. 非所屬 Asset（僅顯示 EAM 和 OWNER，點擊查看詳情／定位） -->
                        <div class="border border-amber-200 rounded-2xl p-3 bg-amber-50/30">
                            <div class="font-bold text-amber-800 mb-2 flex items-center justify-between">
                                <span><i class="fa-solid fa-user-tag mr-1"></i> 非所屬 Asset（顯示 EAM 與 OWNER，點擊查看）</span>
                                <span class="bg-amber-600 text-white text-[10px] px-2 py-0.5 rounded-full">${nonBelonging.length}</span>
                            </div>
                            ${nonBelonging.length === 0 ? '<p class="text-[11px] text-slate-400">無非所屬 Asset</p>' : `
                                <div class="space-y-1.5 max-h-40 overflow-y-auto">
                                    ${nonBelonging.map(item => `
                                        <div data-nonbelonging-eam="${String(item.eam || '').replace(/"/g, '&quot;')}" data-nonbelonging-owner="${String(item.owner || '').replace(/"/g, '&quot;')}" class="nonbelonging-item-row bg-white border border-amber-200 hover:border-amber-500 rounded-xl px-3 py-2 flex items-center justify-between gap-2 cursor-pointer transition-all">
                                            <div class="flex items-center gap-3 min-w-0">
                                                <span class="font-bold text-amber-900">EAM: ${item.eam}</span>
                                                <span class="text-[11px] text-slate-700 truncate">OWNER: <strong>${item.owner}</strong></span>
                                            </div>
                                            <span class="text-[10px] text-amber-700 font-bold shrink-0"><i class="fa-solid fa-up-right-from-square mr-1"></i>查看</span>
                                        </div>
                                    `).join('')}
                                </div>
                            `}
                        </div>

                        <!-- 4. 未登記 Asset（報表有但系統清單找不到 -> 點擊可直接新增補登） -->
                        <div class="border border-purple-200 rounded-2xl p-3 bg-purple-50/30">
                            <div class="font-bold text-purple-800 mb-2 flex items-center justify-between">
                                <span><i class="fa-solid fa-file-circle-plus mr-1"></i> 未登記 Asset（系統清單找不到，點擊可補登）</span>
                                <span class="bg-purple-600 text-white text-[10px] px-2 py-0.5 rounded-full">${unregistered.length}</span>
                            </div>
                            ${unregistered.length === 0 ? '<p class="text-[11px] text-slate-400">無未登記 Asset</p>' : `
                                <div class="space-y-1.5 max-h-44 overflow-y-auto">
                                    ${unregistered.map(item => `
                                        <div class="bg-white border border-purple-100 rounded-xl px-3 py-2 flex items-center justify-between gap-2">
                                            <div class="min-w-0">
                                                <span class="font-bold text-purple-900">${item.eam}</span>
                                                <span class="text-[11px] text-slate-500 ml-2">SN: ${item.serial || 'N/A'}</span>
                                                <p class="text-[11px] text-slate-700 truncate">${item.description || '未登記項目'}</p>
                                            </div>
                                            <button type="button" data-reg-eam="${item.eam}" data-reg-sn="${item.serial || ''}" data-reg-desc="${item.description || ''}"
                                                class="btn-register-unregistered px-2.5 py-1 rounded-lg bg-purple-600 hover:bg-purple-500 text-white text-[11px] font-bold shrink-0 cursor-pointer">
                                                補登 Asset
                                            </button>
                                        </div>
                                    `).join('')}
                                </div>
                            `}
                        </div>
                    `;

                    document.getElementById('btnSwitchSessionPicker').onclick = () => {
                        currentTab = 'list';
                        renderTabView();
                    };

                    bodyEl.querySelectorAll('.stocktake-locate-row').forEach(rowEl => {
                        rowEl.onclick = () => {
                            const targetEam = rowEl.getAttribute('data-locate-eam');
                            const found = (allAssets || []).find(a => String(a.eam || '').trim().toLowerCase() === String(targetEam || '').trim().toLowerCase());
                            if (found) {
                                modal.remove();
                                onSelectAssetFromList(found);
                            } else {
                                alert(`系統清單中找不到 EAM [${targetEam}]`);
                            }
                        };
                    });

                    bodyEl.querySelectorAll('.nonbelonging-item-row').forEach(rowEl => {
                        rowEl.onclick = () => {
                            const nbEam = rowEl.getAttribute('data-nonbelonging-eam') || 'N/A';
                            const nbOwner = rowEl.getAttribute('data-nonbelonging-owner') || 'N/A';
                            const found = (allAssets || []).find(a => normalizeLookupKey(a.eam) === normalizeLookupKey(nbEam));
                            if (found) {
                                modal.remove();
                                onSelectAssetFromList(found);
                                setTimeout(() => openActionModal(found), 120);
                            } else {
                                alert(`非所屬 Asset 明細\n\nEAM：${nbEam}\nOWNER：${nbOwner}\n\n（此項目不屬於目前系統資產清單，未列入一般地圖 Asset 列表）`);
                            }
                        };
                    });

                    bodyEl.querySelectorAll('.btn-register-unregistered').forEach(btn => {
                        btn.onclick = () => {
                            const curWard = document.getElementById('wardSelect')?.value;
                            const curBlock = document.getElementById('blockSelect')?.value || '';
                            const curFloor = document.getElementById('floorSelect')?.value || '';
                            if (!curWard || isLockedStatusWard(curWard)) {
                                alert('請先在上方選單選擇有效的「單位 (Ward)」後再補登 Asset！');
                                return;
                            }
                            const regEam = btn.getAttribute('data-reg-eam') || '';
                            const regSn = btn.getAttribute('data-reg-sn') || 'SN';
                            const regDesc = btn.getAttribute('data-reg-desc') || ASSET_TYPES[0].label;
                            modal.remove();
                            openAssetFormModal({
                                eam: regEam,
                                serial: regSn,
                                dept: 'NSD',
                                description: regDesc,
                                block: curBlock,
                                floor: curFloor,
                                ward: curWard,
                                x: 50,
                                y: 50
                            }, false);
                        };
                    });
                }
            }

            toggleOverlayBtn.onclick = () => {
                toggleStocktakeMapOverlay();
                modal.remove();
            };

            fileInput.onchange = async (e) => {
                const file = e.target.files && e.target.files[0];
                if (!file) return;
                try {
                    const parsedRows = await parseStocktakeFile(file);
                    if (!parsedRows || parsedRows.length === 0) {
                        alert('報表中找不到可解析的盤點資料列，請確認欄位名稱（如 EAM、S/N、Description、Status、Owner）。');
                        return;
                    }

                    const classified = classifyStocktakeRows(parsedRows);
                    const newSession = {
                        id: 'st_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                        fileName: file.name,
                        uploadedAt: new Date().toISOString(),
                        totalRows: parsedRows.length,
                        selectedForMap: true,
                        unscanned: classified.unscanned,
                        scanned: classified.scanned,
                        nonBelonging: classified.nonBelonging,
                        unregistered: classified.unregistered
                    };

                    await saveStocktakeSessionToSheet(newSession);

                    stocktakeSessions.forEach(s => { s.selectedForMap = false; });
                    stocktakeSessions.unshift(newSession);
                    activeStocktakeSessionId = newSession.id;
                    stocktakeMapOverlayEnabled = true;

                    updateStocktakeBadges();

                    const wardVal = document.getElementById('wardSelect')?.value || '';
                    if (wardVal) {
                        renderAssetMarkers(currentFilteredAssets);
                    }
                    renderSidebarWithPriority();

                    alert(
                        `✅ 報表「${file.name}」已儲存至 Google Sheet 並完成分類：\n` +
                        `• 未掃描 Asset（地圖 Highlight）：${classified.unscanned.length} 項\n` +
                        `• 已掃描 Asset（不 Highlight）：${classified.scanned.length} 項\n` +
                        `• 非所屬 Asset（EAM + OWNER）：${classified.nonBelonging.length} 項\n` +
                        `• 未登記 Asset（系統清單找不到）：${classified.unregistered.length} 項`
                    );

                    currentTab = 'detail';
                    renderTabView();
                } catch (err) {
                    alert('解析或儲存 Stocktake 報表失敗: ' + err);
                } finally {
                    fileInput.value = '';
                }
            };

            document.getElementById('btnCloseStocktakeModal').onclick = () => modal.remove();
            tabListBtn.onclick = () => { currentTab = 'list'; renderTabView(); };
            tabDetailBtn.onclick = () => { currentTab = 'detail'; renderTabView(); };

            renderTabView();
        }
    </script>
</body>
</html>
