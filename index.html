<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>醫院資產與平面圖管理系統</title>
    <!-- 引入 Tailwind CSS 與 FontAwesome -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- 引入 html5-qrcode 條碼掃描庫 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col font-sans">

    <!-- 頂部導覽與連動選單列 -->
    <header class="bg-white border-b border-slate-200 px-3 sm:px-6 py-3 flex flex-col sm:flex-row items-center justify-between gap-3 shadow-sm z-20">
        <div class="flex items-center space-x-3 w-full sm:w-auto justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-50 p-2 rounded-xl border border-blue-100">
                    <i class="fa-solid fa-hospital text-blue-600 text-base"></i>
                </div>
                <h1 class="text-xs sm:text-sm font-bold tracking-wider text-slate-800">醫院資產與平面圖管理系統</h1>
            </div>
        </div>
    
        <!-- 階層連動選單區塊：在手機上自動撐滿寬度 (w-full) -->
        <div class="grid grid-cols-3 gap-1.5 w-full sm:w-auto bg-slate-50 p-2 rounded-xl border border-slate-200 shadow-inner">
            <div class="flex flex-col">
                <label class="text-[10px] font-semibold text-slate-600 mb-0.5">棟別:</label>
                <select id="blockSelect" onchange="onBlockChange()" class="w-full bg-white text-slate-800 text-[11px] rounded-lg px-2 py-1 border border-slate-300 focus:outline-none focus:border-blue-500">
                    <option value="">載入中...</option>
                </select>
            </div>
            <div class="flex flex-col">
                <label class="text-[10px] font-semibold text-slate-600 mb-0.5">樓層:</label>
                <select id="floorSelect" onchange="onFloorChange()" class="w-full bg-white text-slate-800 text-[11px] rounded-lg px-2 py-1 border border-slate-300 focus:outline-none focus:border-blue-500">
                    <option value="">請選擇</option>
                </select>
            </div>
            <div class="flex flex-col">
                <label class="text-[10px] font-semibold text-slate-600 mb-0.5">單位:</label>
                <select id="wardSelect" onchange="onWardChange()" class="w-full bg-white text-slate-800 text-[11px] rounded-lg px-2 py-1 border border-slate-300 focus:outline-none focus:border-blue-500">
                    <option value="">請選擇</option>
                </select>
            </div>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="flex-1 p-3 sm:p-6 grid grid-cols-1 lg:grid-cols-4 gap-4 sm:gap-6 items-stretch">
        
        <!-- 左側區域：平面圖與提示橫幅 -->
        <div class="lg:col-span-3 flex flex-col gap-3 w-full min-w-0">
            <div id="selectionBanner" class="hidden bg-amber-500 border-4 border-amber-300 text-white px-6 py-3 rounded-2xl shadow-xl flex items-center justify-between text-sm font-extrabold tracking-wide transition-all z-20">
                <div class="flex items-center gap-3">
                    <i class="fa-solid fa-bullhorn text-xl text-yellow-100 animate-pulse"></i>
                    <span id="bannerText" class="text-xs tracking-wider">請直接在地圖點選新位置...</span>
                </div>
                <button onclick="cancelRelocate()" class="bg-amber-700 hover:bg-amber-800 text-white px-3 py-1.5 rounded-xl text-xs font-bold shadow-md cursor-pointer transition-all border border-amber-400">取消</button>
            </div>

            <div id="mapContainer" class="w-full bg-white border border-slate-200 rounded-2xl relative shadow-sm overflow-hidden cursor-crosshair">
                <div id="placeholderText" class="text-center text-slate-400 pointer-events-none absolute inset-0 flex flex-col items-center justify-center z-10 bg-slate-50/80">
                    <i class="fa-solid fa-map-location-dot text-4xl mb-2 text-slate-300"></i>
                    <p class="text-xs text-slate-500">請從上方選單選擇單位以載入平面圖（點擊地圖任意處可新增資產）</p>
                </div>
                
                <div id="mapWrapper" class="relative w-full aspect-[12/9] bg-slate-50" onclick="handleMapClick(event)">
                    <img id="floorPlanImg" alt="Floor Plan" class="hidden absolute inset-0 w-full h-full object-fill pointer-events-auto" onclick="handleMapClick(event)">
                    <div id="markersLayer" class="absolute inset-0 pointer-events-none"></div>
                </div>
            </div>
        </div>

        <!-- 右側：資產清單與搜尋面板 -->
        <aside class="bg-white border border-slate-200 rounded-2xl p-4 flex flex-col h-full shadow-sm overflow-hidden min-h-0">
            <div class="pb-3 border-b border-slate-100 mb-3 space-y-2 shrink-0">
                <div class="flex items-center justify-between">
                    <h2 class="text-xs font-bold flex items-center gap-2 text-slate-700">
                        <i class="fa-solid fa-boxes-stacked text-blue-600"></i> 資產清單與搜尋
                    </h2>
                    <span id="assetCountBadge" class="text-[10px] bg-blue-50 text-blue-600 px-2 py-0.5 rounded-full border border-blue-100 font-semibold">0 項</span>
                </div>

                <div class="flex gap-2 items-center">
                    <div class="relative flex-1">
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-xs text-slate-400"></i>
                        <input id="assetSearchInput" type="text" oninput="onSearchInput(this.value)" placeholder="搜尋 EAM, Serial, Remark, Ward..." 
                            class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-8 pr-3 py-1.5 text-xs text-slate-800 focus:outline-none focus:border-blue-500 focus:bg-white transition-all">
                    </div>
                    <button onclick="openScannerModal()" title="開啟條碼掃描器" class="bg-blue-600 hover:bg-blue-500 text-white p-2 rounded-xl text-xs flex items-center justify-center shrink-0 shadow-sm transition-all cursor-pointer">
                        <i class="fa-solid fa-barcode text-sm"></i>
                    </button>
                </div>
            </div>

            <div id="assetListContainer" class="flex-1 overflow-y-auto space-y-2.5 pr-1 min-h-0">
                <p class="text-xs text-slate-400 text-center mt-12">請先選擇上方單位或輸入 EAM 搜尋</p>
            </div>
        </aside>
    </main>

    <!-- 核心運作腳本 -->
    <script>
        // 🌟 1. 設定你的 GAS Web App API 網址
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbz_z5U4DjeWY1k8dELIxaSxfMUW110kMnzutPXsqvCGQB3k5qJIwHRTJJmKha1eiNrBlQ/exec";

        // 全域變數初始化
        let allAssets = [];
        let floorHierarchyData = [];
        let rawHierarchyData = [];
        let currentFilteredAssets = [];
        let isMovingAsset = null;
        let isRelocatingMode = false;
        const floorPlanCache = {};
        let isFloorPlanLoaded = false;

        const DEPARTMENT_OPTIONS = ["NSD", "Ward 1A", "Ward 1B", "Ward 2A", "Ward 2B", "Ward 3A", "Ward 3B", "IT", "Admin"];
        const ASSET_TYPES = [
            { label: "Laptop", icon: "fa-laptop", category: "IT" },
            { label: "iPad", icon: "fa-tablet-screen-button", category: "IT" },
            { label: "Computer Hard Disk", icon: "fa-hard-drive", category: "IT" },
            { label: "Scanner", icon: "fa-barcode", category: "IT" },
            { label: "Printer", icon: "fa-print", category: "IT" },
            { label: "Medical Equipment", icon: "fa-suitcase-medical", category: "Medical" },
            { label: "Display Monitor", icon: "fa-desktop", category: "IT" },
            { label: "Office Asset", icon: "fa-chair", category: "Office" },
            { label: "Camera", icon: "fa-camera", category: "IT" }
        ];

        // 🌟 2. 替代 google.script.run 的跨網域 API 呼叫函數
        function fetchAllAssets() {
            fetch(`${GAS_API_URL}?action=getAllAssets`)
                .then(res => res.json())
                .then(data => {
                    allAssets = data || [];
                    window.allAssets = allAssets;
                    
                    // 🚀 讓一開網頁時，右側直接顯示全部資產（或你可以改成過濾特定單位）
                    renderAssetSidebarList(allAssets);

                    const wardSelect = document.getElementById('wardSelect');
                    if (wardSelect && wardSelect.value) {
                        onWardChange();
                    }
                })
                .catch(err => console.error("抓取資產失敗:", err));
         }

        function fetchHierarchy() {
            fetch(`${GAS_API_URL}?action=getHierarchy`)
                .then(res => res.json())
                .then(data => {
                    floorHierarchyData = data || [];
                    rawHierarchyData = data || [];
                    initDropdowns(floorHierarchyData);

                    // 🚀 當選單階層載入完成後，立刻在背景自動預載所有單位的地圖
                    floorHierarchyData.forEach(item => {
                        const wardKey = item.wardKey;
                        if (wardKey && !floorPlanCache[wardKey]) {
                            fetch(`${GAS_API_URL}?action=getFloorPlan&wardKey=${encodeURIComponent(wardKey)}`)
                                .then(res => res.json())
                                .then(planData => {
                                    if (planData && planData.base64) {
                                        floorPlanCache[wardKey] = planData.base64;
                                        console.log(`✅ 背景預載成功: ${wardKey}`);
                                    }
                                })
                                .catch(err => console.warn(`預載失敗: ${wardKey}`, err));
                        }
                    });
                })
                .catch(err => console.error("抓取選單階層失敗:", err));
        }

        function loadFloorPlan(wardKey) {
            var imgEl = document.getElementById('floorPlanImg');
            isFloorPlanLoaded = false;

            if (floorPlanCache[wardKey]) {
                imgEl.src = floorPlanCache[wardKey];
                imgEl.classList.remove('hidden');
                isFloorPlanLoaded = true;
                const placeholder = document.getElementById('placeholderText');
                if (placeholder) placeholder.classList.add('hidden');
                return;
            }

            fetch(`${GAS_API_URL}?action=getFloorPlan&wardKey=${encodeURIComponent(wardKey)}`)
                .then(res => res.json())
                .then(data => {
                    if (data && data.base64) {
                        floorPlanCache[wardKey] = data.base64;
                        imgEl.src = data.base64;
                        imgEl.classList.remove('hidden');
                        isFloorPlanLoaded = true;
                        const placeholder = document.getElementById('placeholderText');
                        if (placeholder) placeholder.classList.add('hidden');
                    } else {
                        imgEl.src = '';
                        imgEl.classList.add('hidden');
                        isFloorPlanLoaded = false;
                    }
                })
                .catch(err => {
                    console.error("載入平面圖失敗: ", err);
                    isFloorPlanLoaded = false;
                });
        }

        function openCondemnUploadModal(asset) {
        const existingModal = document.getElementById('condemnModal');
        if (existingModal) existingModal.remove();

        const modal = document.createElement('div');
        modal.id = 'condemnModal';
        modal.className = 'fixed inset-0 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center z-50 p-4';
        modal.innerHTML = `
            <div class="bg-white border border-slate-200 rounded-2xl p-6 w-full max-w-sm shadow-2xl text-slate-800">
                <h3 class="text-xs font-bold mb-3 text-amber-600 text-center flex items-center justify-center gap-2">
                    <i class="fa-solid fa-triangle-exclamation"></i> 處理報廢/盈餘 (Condemn/Surplus)
                </h3>
                <p class="text-[11px] text-slate-500 text-center mb-4">資產編號：<span class="font-bold text-slate-700">${asset.eam}</span></p>
                
                <div class="space-y-3 text-xs">
                    <div>
                        <label class="block text-slate-600 mb-1 font-semibold">選擇處理類型:</label>
                        <select id="condemnType" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-slate-800 focus:outline-none focus:border-amber-500">
                            <option value="Condemn">Condemn (報廢)</option>
                            <option value="Surplus">Surplus (轉出/盈餘)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-slate-600 mb-1 font-semibold">上傳 Condemn Form 檔案 / 拍照:</label>
                        <!-- 🌟 支援檔案上傳與手機直接拍照 accept="image/*" capture="environment" -->
                        <input id="condemnFile" type="file" accept="image/*,.pdf" capture="environment"
                            class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-amber-50 file:text-amber-700 hover:file:bg-amber-100 cursor-pointer border border-slate-200 rounded-xl p-1">
                        <p class="text-[10px] text-slate-400 mt-1">手機點擊可直接開啟相機拍照或選擇檔案。</p>
                    </div>
                    <div>
                        <label class="block text-slate-600 mb-1 font-semibold">補充說明 (會自動寫入備註):</label>
                        <textarea id="condemnRemark" placeholder="請輸入報廢原因或備註..." rows="2"
                            class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-slate-800 focus:outline-none focus:border-amber-500">${asset.remark || ''}</textarea>
                    </div>
                </div>

                <div class="flex gap-2 mt-5">
                    <button id="btnSubmitCondemn" class="flex-1 bg-amber-500 hover:bg-amber-400 text-white text-xs font-semibold py-2.5 rounded-xl transition-all shadow-md">
                        確認上傳並存檔
                    </button>
                    <button id="btnCloseCondemn" class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs py-2.5 rounded-xl transition-all">
                        取消
                    </button>
                </div>
            </div>
        `;
        document.body.appendChild(modal);

        document.getElementById('btnSubmitCondemn').onclick = () => {
            const type = document.getElementById('condemnType').value;
            const fileInput = document.getElementById('condemnFile');
            const remarkText = document.getElementById('condemnRemark').value.trim();

            // 更新前端物件的屬性
            asset.remark = `[${type}] ${remarkText}`;
            asset.block = "System";
            asset.floor = "System";
            asset.ward = type; // 將 Ward_Key 更新為 Condemn 或 Surplus
            
            modal.remove();

            // 如果有選擇檔案，透過 Base64 傳送到後端處理上傳與存檔
            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    const base64Data = e.target.result;
                    
                    // 🌟 改用 fetch POST 發送給 GAS Web App
                    fetch(GAS_API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({
                            action: 'saveCondemnAndAsset',
                            asset: asset,
                            base64Data: base64Data,
                            fileName: file.name
                        })
                    })
                    .then(res => res.json())
                    .then(res => {
                        if (res && res.status === "error") {
                            alert("❌ 檔案上傳失敗：" + res.message);
                        } else {
                            alert(`資產 [${asset.eam}] 之 ${type} 狀態與檔案已成功存檔！`);
                            fetchAllAssets();
                        }
                    })
                    .catch(err => {
                        alert("❌ 系統通訊失敗：" + err);
                        console.error(err);
                    });
                };
                reader.readAsDataURL(file);
            } else {
                // 如果沒有選檔案，直接呼叫更新試算表的 API
                updateAssetInSheet(asset);
                alert(`資產 [${asset.eam}] 狀態已更新為 ${type}！`);
            }
        };

        document.getElementById('btnCloseCondemn').onclick = () => modal.remove();
      }

        
        function updateAssetInSheet(asset) {
            fetch(GAS_API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'updateAsset', asset: asset })
            })
            .then(res => res.json())
            .then(() => {
                alert("資產更新成功！");
                fetchAllAssets();
            })
            .catch(err => alert("更新失敗: " + err));
        }

        function deleteAssetFromSheet(eam) {
            fetch(GAS_API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'deleteAsset', eam: eam })
            })
            .then(res => res.json())
            .then(() => {
                alert("資產已刪除！");
                fetchAllAssets();
            })
            .catch(err => alert("刪除失敗: " + err));
        }

        function addNewAssetApi(newAsset) {
            fetch(GAS_API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'addAsset', asset: newAsset })
            })
            .then(res => res.json())
            .then(() => {
                alert("新資產新增成功！");
                fetchAllAssets();
            })
            .catch(err => alert("新增失敗: " + err));
        }

        // 🌟 3. 選單連動邏輯
        function initDropdowns(hierarchy) {
            const blockSelect = document.getElementById('blockSelect');
            if (!blockSelect) return;
            const blocks = [...new Set(hierarchy.map(h => h.block))];
            blockSelect.innerHTML = '<option value="">請選擇棟別</option>' + 
                blocks.map(b => `<option value="${b}">${b}</option>`).join('');
        }

        function onBlockChange() {
            const block = document.getElementById('blockSelect').value;
            const floorSelect = document.getElementById('floorSelect');
            const wardSelect = document.getElementById('wardSelect');
            floorSelect.innerHTML = '<option value="">請選擇樓層</option>';
            wardSelect.innerHTML = '<option value="">請先選擇樓層</option>';
            if (!block) return;
            const floors = [...new Set(floorHierarchyData.filter(h => h.block === block).map(h => h.floor))];
            floorSelect.innerHTML += floors.map(f => `<option value="${f}">${f}</option>`).join('');
        }

        function onFloorChange() {
            const block = document.getElementById('blockSelect').value;
            const floor = document.getElementById('floorSelect').value;
            const wardSelect = document.getElementById('wardSelect');
            wardSelect.innerHTML = '<option value="">請選擇單位</option>';
            if (!floor) return;
            const wards = floorHierarchyData.filter(h => h.block === block && h.floor === floor);
            wardSelect.innerHTML += wards.map(w => `<option value="${w.wardKey}">${w.wardName} (${w.wardKey})</option>`).join('');
        }

        function onWardChange() {
            const wardKey = document.getElementById('wardSelect').value;
            if (!wardKey) return;
            loadFloorPlan(wardKey);
            currentFilteredAssets = allAssets.filter(a => a.ward && a.ward.trim().toLowerCase() === wardKey.trim().toLowerCase());
            window.currentLoadedAssets = currentFilteredAssets;
            renderAssetMarkers(currentFilteredAssets);
            renderAssetSidebarList(currentFilteredAssets);
        }

        // 🌟 4. 資產配置與圖示轉換
        function getAssetTypeConfig(description) {
            const desc = (description || '').toLowerCase();
            if (desc.includes('medical equipment')) {
                return { icon: 'fa-suitcase-medical', color: 'text-emerald-600', bg: 'bg-emerald-50', border: 'border-emerald-500' };
            } else if (desc.includes('office asset') || desc.includes('camera')) {
                return { icon: 'fa-chair', color: 'text-amber-600', bg: 'bg-amber-50', border: 'border-amber-500' };
            } else {
                let icon = 'fa-laptop';
                if (desc.includes('ipad') || desc.includes('tablet')) icon = 'fa-tablet-screen-button';
                else if (desc.includes('hard disk') || desc.includes('disk') || desc.includes('hdd')) icon = 'fa-hard-drive';
                else if (desc.includes('scanner')) icon = 'fa-barcode';
                else if (desc.includes('printer')) icon = 'fa-print';
                else if (desc.includes('monitor') || desc.includes('display')) icon = 'fa-desktop';
                else if (desc.includes('camera')) icon = 'fa-camera';
                return { icon: icon, color: 'text-blue-600', bg: 'bg-blue-50', border: 'border-blue-500' };
            }
        }

        // 🌟 5. 圖釘渲染與側邊欄
        function calculateMarkerPositions(assets) {
            if (!assets || !Array.isArray(assets)) return [];
            const GRID_X = 60, GRID_Y = 45;
            return assets.map(asset => {
                const snappedX = Math.round(asset.x * (GRID_X / 100)) / (GRID_X / 100);
                const snappedY = Math.round(asset.y * (GRID_Y / 100)) / (GRID_Y / 100);
                return { ...asset, baseX: snappedX, baseY: snappedY, offsetX: 0, offsetY: 0 };
            });
        }

        function renderAssetMarkers(assets, highlightEam = null) {
            updateMarkersLayerSize();
            const markersLayer = document.getElementById('markersLayer');
            const floorPlanImg = document.getElementById('floorPlanImg');
            if (!markersLayer) return;
            markersLayer.innerHTML = '';
            if (!floorPlanImg || floorPlanImg.classList.contains('hidden')) return;

            const processedAssets = calculateMarkerPositions(assets);
            processedAssets.forEach(asset => {
                if (asset.x === undefined || asset.y === undefined) return;
                const typeConfig = getAssetTypeConfig(asset.description);
                const marker = document.createElement('div');
                marker.className = 'asset-pin-marker absolute cursor-pointer transition-all pointer-events-auto z-10';

                const posX = asset.baseX !== undefined ? asset.baseX : asset.x;
                const posY = asset.baseY !== undefined ? asset.baseY : asset.y;
                marker.style.left = `${posX}%`;
                marker.style.top = `${posY}%`;

                let translateX = '-50%', translateY = '-50%';
                if (posX > 90) translateX = '-100%'; else if (posX < 10) translateX = '0px';
                if (posY > 90) translateY = '-100%'; else if (posY < 10) translateY = '0px';
                
                // 🌟 結合原本的位移與動態比例縮放
                marker.style.transform = `translate(${translateX}, ${translateY}) scale(var(--map-scale, 1))`;

                const isHighlighted = highlightEam && String(asset.eam).trim() === String(highlightEam).trim();
                marker.innerHTML = `
                    <div class="relative flex items-center justify-center w-7 h-7 rounded-full border-2 shadow-md transition-transform hover:scale-110 ${typeConfig.bg} ${typeConfig.border} ${
                        isHighlighted ? 'ring-4 ring-amber-400 animate-bounce scale-125 z-30' : ''
                    }">
                        <i class="fa-solid ${typeConfig.icon} text-xs ${typeConfig.color}"></i>
                    </div>
                `;
                
                marker.onclick = (e) => {
                    e.stopPropagation();
                    openActionModal(asset);
                };
                markersLayer.appendChild(marker);
            });
        }

        function renderAssetSidebarList(assets) {
            const listContainer = document.getElementById('assetListContainer');
            const badge = document.getElementById('assetCountBadge');
            if (!listContainer || !badge) return;
            listContainer.innerHTML = '';
            badge.innerText = `${assets.length} 項`;

            if (assets.length === 0) {
                listContainer.innerHTML = `<p class="text-sm text-slate-400 text-center mt-12 py-6 bg-slate-50 rounded-xl border border-dashed border-slate-200">未找到符合條件的資產</p>`;
                return;
            }

            assets.forEach(asset => {
                const typeConfig = getAssetTypeConfig(asset.description);
                const card = document.createElement('div');
                card.className = 'bg-gradient-to-br from-white to-slate-50/80 border border-slate-200/80 hover:border-blue-400 hover:ring-2 hover:ring-blue-100 rounded-2xl p-3.5 cursor-pointer transition-all shadow-xs hover:shadow-md flex items-center justify-between gap-3';
                card.setAttribute('data-eam', asset.eam);

                const remarkHtml = asset.remark ? `<p class="text-[11px] text-amber-600 mt-1 flex items-center gap-1"><i class="fa-solid fa-note-sticky"></i>備註: ${asset.remark}</p>` : '';
                const infoDiv = document.createElement('div');
                infoDiv.className = 'flex items-center gap-3.5 flex-1 min-w-0';
                infoDiv.innerHTML = `
                    <div class="w-10 h-10 rounded-xl bg-blue-50/80 flex items-center justify-center shrink-0 border border-blue-100/80 shadow-xs ${typeConfig.color}">
                        <i class="fa-solid ${typeConfig.icon} text-base"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-sm font-bold text-blue-700 tracking-wide truncate">${asset.eam}</span>
                            <span class="text-xs font-semibold bg-blue-50 text-blue-600 px-2 py-0.5 rounded-md border border-blue-100">${asset.ward || asset.dept}</span>
                        </div>
                        <p class="text-sm font-semibold text-slate-800 truncate">${asset.description}</p>
                        ${remarkHtml}
                        <div class="flex justify-between items-center mt-1.5 text-xs text-slate-500 font-medium">
                            <span>SN: <span class="text-slate-700">${asset.serial || 'N/A'}</span></span>
                            <span class="text-blue-600 font-bold bg-blue-50/50 px-1.5 py-0.5 rounded">${asset.block} | ${asset.floor}</span>
                        </div>
                    </div>
                `;
                infoDiv.onclick = () => locateAndHighlightAsset(asset);

                const actionBtn = document.createElement('button');
                actionBtn.className = 'p-2.5 text-slate-400 hover:text-blue-600 hover:bg-blue-50 rounded-xl transition-all shrink-0 border border-transparent hover:border-blue-100';
                actionBtn.innerHTML = `<i class="fa-solid fa-ellipsis-vertical text-sm"></i>`;
                actionBtn.onclick = (e) => {
                    e.stopPropagation();
                    openActionModal(asset);
                };

                card.appendChild(infoDiv);
                card.appendChild(actionBtn);
                listContainer.appendChild(card);
            });
        }

        function onSearchInput(query) {
            const keyword = query ? query.toLowerCase().trim() : "";
            if (!keyword) {
                onWardChange();
                return;
            }
            const matchedAssets = allAssets.filter(asset => {
                const eam = asset.eam ? asset.eam.toLowerCase().trim() : "";
                const serial = asset.serial ? asset.serial.toLowerCase().trim() : "";
                const remark = asset.remark ? asset.remark.toLowerCase().trim() : "";
                const ward = asset.ward ? asset.ward.toLowerCase().trim() : "";
                const description = asset.description ? asset.description.toLowerCase().trim() : "";
                return eam.includes(keyword) || serial.includes(keyword) || remark.includes(keyword) || ward.includes(keyword) || description.includes(keyword);
            });
            renderAssetSidebarList(matchedAssets);
        }

        function locateAndHighlightAsset(asset) {
            const blockSelect = document.getElementById('blockSelect');
            const floorSelect = document.getElementById('floorSelect');
            const wardSelect = document.getElementById('wardSelect');

            let targetBlock = asset.block;
            let targetFloor = asset.floor;
            let targetWard = asset.ward;

            if (blockSelect) blockSelect.value = targetBlock;
            onBlockChange();
            if (floorSelect) floorSelect.value = targetFloor;
            onFloorChange();
            if (wardSelect && targetWard) wardSelect.value = targetWard;

            onWardChange();

            let checkInterval = setInterval(() => {
                if (!isFloorPlanLoaded) return;
                clearInterval(checkInterval);
                executeHighlightAndScroll();
            }, 50);

            function executeHighlightAndScroll() {
                currentFilteredAssets = allAssets.filter(a => a.ward && a.ward.trim().toLowerCase() === targetWard.toLowerCase());
                renderAssetMarkers(currentFilteredAssets, asset.eam);

                const mapContainer = document.getElementById('mapContainer');
                if (mapContainer) mapContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });

                const assetCards = document.querySelectorAll('[data-eam]');
                assetCards.forEach(card => {
                    card.classList.remove('ring-4', 'ring-amber-400', 'bg-amber-50');
                    if (card.getAttribute('data-eam').toLowerCase() === String(asset.eam).trim().toLowerCase()) {
                        card.classList.add('ring-4', 'ring-amber-400', 'bg-amber-50');
                        card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                        setTimeout(() => card.classList.remove('ring-4', 'ring-amber-400', 'bg-amber-50'), 2000);
                    }
                });
            }
        }

        // 🌟 6. 地圖點擊與圖層縮放調整
        let isMapClickProcessing = false;
        function handleMapClick(event) {
            if (isMapClickProcessing) return;
            isMapClickProcessing = true;
            setTimeout(() => { isMapClickProcessing = false; }, 300);

            if (event) event.stopPropagation();
            const mapWrapper = document.getElementById('mapWrapper');
            if (!mapWrapper) return;
            const rect = mapWrapper.getBoundingClientRect();

            if (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom) return;

            const x = ((event.clientX - rect.left) / rect.width) * 100;
            const y = ((event.clientY - rect.top) / rect.height) * 100;

            const currentBlock = document.getElementById('blockSelect').value;
            const currentFloor = document.getElementById('floorSelect').value;
            const currentWard = document.getElementById('wardSelect').value;

            if (!currentWard) {
                alert("請先在上方選單選擇「單位 (Ward)」！");
                return;
            }

            if (isRelocatingMode && isMovingAsset) {
                isMovingAsset.x = parseFloat(x.toFixed(2));
                isMovingAsset.y = parseFloat(y.toFixed(2));
                isMovingAsset.block = currentBlock;
                isMovingAsset.floor = currentFloor;
                isMovingAsset.ward = currentWard;
                updateAssetInSheet(isMovingAsset);
                cancelRelocate();
                return;
            }

            const newAssetData = {
                eam: "", serial: "SN", dept: currentWard,
                description: ASSET_TYPES[0].label,
                block: currentBlock, floor: currentFloor, ward: currentWard,
                x: parseFloat(x.toFixed(2)), y: parseFloat(y.toFixed(2))
            };
            openAssetFormModal(newAssetData, false);
        }

        function updateMarkersLayerSize() {
            const floorPlanImg = document.getElementById('floorPlanImg');
            const mapWrapper = document.getElementById('mapWrapper');
            const markersLayer = document.getElementById('markersLayer');
            if (!floorPlanImg || !mapWrapper || floorPlanImg.classList.contains('hidden') || !floorPlanImg.complete || floorPlanImg.naturalWidth === 0) return;

            mapWrapper.style.position = 'relative';
            mapWrapper.style.width = '100%';
            mapWrapper.style.aspectRatio = `${floorPlanImg.naturalWidth} / ${floorPlanImg.naturalHeight}`;
            mapWrapper.style.height = 'auto';
            mapWrapper.style.margin = '0 auto';

            floorPlanImg.style.position = 'absolute';
            floorPlanImg.style.top = '0';
            floorPlanImg.style.left = '0';
            floorPlanImg.style.width = '100%';
            floorPlanImg.style.height = '100%';
            floorPlanImg.style.objectFit = 'contain';

            // 🌟 動態計算地圖縮放比例 (以 1000px 寬度為基準)
            const currentWidth = floorPlanImg.clientWidth;
            const baseWidth = 1000; 
            let scale = currentWidth / baseWidth;
            
            // 限制縮放範圍：避免手機縮太小看不清楚、電腦放大太大 (範圍維持在 0.6 倍到 1.3 倍之間)
            scale = Math.max(0.6, Math.min(1.3, scale));

            // 將比例寫入 markersLayer 的 CSS 變數中
            if (markersLayer) {
                markersLayer.style.setProperty('--map-scale', scale);
            }
        }

        // 🌟 7. Modal 彈窗介面與相機條碼掃描
        function openAssetFormModal(assetData, isEdit = false) {
            const existingModal = document.getElementById('customFormModal');
            if (existingModal) existingModal.remove();

            const deptOptionsHtml = DEPARTMENT_OPTIONS.map(dept => `<option value="${dept}" ${assetData.dept === dept ? 'selected' : ''}>${dept}</option>`).join('');
            const typeOptionsHtml = ASSET_TYPES.map(type => `<option value="${type.label}" ${assetData.description === type.label ? 'selected' : ''}>${type.label}</option>`).join('');

            const modal = document.createElement('div');
            modal.id = 'customFormModal';
            modal.className = 'fixed inset-0 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center z-50 p-4';
            modal.innerHTML = `
                <div class="bg-white border border-slate-200 rounded-2xl p-6 w-full max-w-sm shadow-2xl text-slate-800">
                    <h3 class="text-xs font-bold mb-4 text-blue-600 text-center flex items-center justify-center gap-2">
                        <i class="fa-solid fa-shapes"></i> ${isEdit ? '編輯資產資訊' : '新增 / 移動資產'}
                    </h3>
                    <div class="space-y-3 text-xs">
                        <div>
                            <label class="block text-slate-600 mb-1 font-semibold">EAM 編號:</label>
                            <input id="inputEam" type="text" value="${assetData.eam || ''}" ${isEdit ? 'disabled' : ''} placeholder="例如 EAM-1001" 
                                class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-slate-800 focus:outline-none focus:border-blue-500 ${isEdit ? 'opacity-60 cursor-not-allowed' : ''}">
                        </div>
                        <div>
                            <label class="block text-slate-600 mb-1 font-semibold">Serial 編號:</label>
                            <input id="inputSerial" type="text" value="${assetData.serial || 'SN'}" placeholder="請輸入 Serial" 
                                class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-slate-800 focus:outline-none focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-slate-600 mb-1 font-semibold">部門 (Dept):</label>
                            <select id="inputDept" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-slate-800 focus:outline-none focus:border-blue-500">${deptOptionsHtml}</select>
                        </div>
                        <div>
                            <label class="block text-slate-600 mb-1 font-semibold">資產類型 (Type):</label>
                            <select id="inputDesc" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-slate-800 focus:outline-none focus:border-blue-500">${typeOptionsHtml}</select>
                        </div>
                        <div>
                            <label class="block text-slate-600 mb-1 font-semibold">備註 (Remark):</label>
                            <input id="inputRemark" type="text" value="${assetData.remark || ''}" placeholder="請輸入備註 (選填)" 
                                class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-slate-800 focus:outline-none focus:border-blue-500">
                        </div>
                    </div>
                    <div class="flex gap-2 mt-5">
                        <button id="btnSaveForm" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold py-2.5 rounded-xl transition-all shadow-md">確認儲存</button>
                        <button id="btnCloseForm" class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs py-2.5 rounded-xl transition-all">取消</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);

            document.getElementById('btnSaveForm').onclick = () => {
                const eam = document.getElementById('inputEam').value.trim();
                const serial = document.getElementById('inputSerial').value.trim();
                const dept = document.getElementById('inputDept').value;
                const description = document.getElementById('inputDesc').value;
                const remark = document.getElementById('inputRemark').value.trim();
                const targetWard = assetData.ward || document.getElementById('wardSelect').value;

                if (!eam) { alert("EAM 編號不能為空！"); return; }
                modal.remove();

                if (isEdit) {
                    assetData.serial = serial; assetData.dept = dept; assetData.description = description; assetData.remark = remark; assetData.ward = targetWard;
                    updateAssetInSheet(assetData);
                } else {
                    const existingAsset = allAssets.find(a => a.eam.toLowerCase() === eam.toLowerCase());
                    if (existingAsset) {
                        existingAsset.block = assetData.block; existingAsset.floor = assetData.floor; existingAsset.ward = targetWard;
                        existingAsset.x = assetData.x; existingAsset.y = assetData.y; existingAsset.serial = serial;
                        existingAsset.dept = dept; existingAsset.description = description; existingAsset.remark = remark;
                        updateAssetInSheet(existingAsset);
                    } else {
                        const newAsset = { eam, serial, dept, description, remark, block: assetData.block, floor: assetData.floor, ward: targetWard, x: assetData.x, y: assetData.y };
                        addNewAssetApi(newAsset);
                    }
                }
            };
            document.getElementById('btnCloseForm').onclick = () => modal.remove();
        }

        function openActionModal(asset) {
            const existingModal = document.getElementById('customActionModal');
            if (existingModal) existingModal.remove();

            const typeConfig = getAssetTypeConfig(asset.description);
            const modal = document.createElement('div');
            modal.id = 'customActionModal';
            modal.className = 'fixed inset-0 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center z-50 p-4';
            modal.innerHTML = `
                <div class="bg-white border border-slate-200 rounded-2xl p-6 w-full max-w-xs shadow-2xl text-slate-800 text-center">
                    <div class="w-10 h-10 mx-auto mb-2 rounded-xl bg-blue-50 flex items-center justify-center border border-blue-100 ${typeConfig.color}">
                        <i class="fa-solid ${typeConfig.icon} text-base"></i>
                    </div>
                    <h3 class="text-xs font-bold mb-1 text-blue-600">${asset.eam}</h3>
                    <p class="text-[11px] text-slate-500 mb-4">${asset.description} (${asset.dept})</p>
                    
                    <div class="space-y-2">
                        <button id="btnEdit" class="w-full bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold py-2.5 px-4 rounded-xl transition-all shadow flex items-center justify-center gap-2">
                            <i class="fa-solid fa-pen-to-square"></i> 更改資產資訊
                        </button>
                        <button id="btnMove" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold py-2.5 px-4 rounded-xl transition-all shadow flex items-center justify-center gap-2">
                            <i class="fa-solid fa-location-crosshairs"></i> 在地圖中點擊更改位置
                        </button>
                        <!-- 🌟 完整補回 Condemn / Surplus 報廢與盈餘按鈕 -->
                        <button id="btnCondemn" class="w-full bg-amber-500 hover:bg-amber-400 text-white text-xs font-semibold py-2.5 px-4 rounded-xl transition-all shadow flex items-center justify-center gap-2">
                            <i class="fa-solid fa-file-arrow-up"></i> Condemn / Surplus (報廢/盈餘)
                        </button>
                        <button id="btnDelete" class="w-full bg-rose-600 hover:bg-rose-500 text-white text-xs font-semibold py-2.5 px-4 rounded-xl transition-all shadow flex items-center justify-center gap-2">
                            <i class="fa-solid fa-trash"></i> 刪除此資產
                        </button>
                    </div>

                    <button id="btnCloseModal" class="w-full mt-3 bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs py-2 rounded-xl transition-all">
                        取消
                    </button>
                </div>
            `;
            document.body.appendChild(modal);

            // 按鈕事件綁定
            document.getElementById('btnEdit').onclick = () => {
                modal.remove();
                openAssetFormModal(asset, true);
            };

            document.getElementById('btnMove').onclick = () => {
                modal.remove();
                isMovingAsset = asset;
                isRelocatingMode = true; 
                const banner = document.getElementById('selectionBanner');
                const bannerText = document.getElementById('bannerText');
                if (banner && bannerText) {
                    banner.classList.remove('hidden');
                    bannerText.innerText = `請在地圖點擊 [${asset.eam}] 的新位置...`;
                }
            };

            // 🌟 點擊 Condemn / Surplus 開啟上傳與處理視窗
            document.getElementById('btnCondemn').onclick = () => {
                modal.remove();
                if (typeof openCondemnUploadModal === 'function') {
                    openCondemnUploadModal(asset);
                } else {
                    alert("找不到 openCondemnUploadModal 函數，請確認是否有引入對應腳本！");
                }
            };

            document.getElementById('btnDelete').onclick = () => {
                modal.remove();
                if (confirm(`確定要刪除資產 [${asset.eam}] 嗎？`)) {
                    deleteAssetFromSheet(asset.eam);
                }
            };

            document.getElementById('btnCloseModal').onclick = () => modal.remove();
        }
        
        function cancelRelocate() {
            isMovingAsset = null; isRelocatingMode = false;
            const banner = document.getElementById('selectionBanner');
            if (banner) banner.classList.add('hidden');
        }

        // 🌟 8. 即時相機條碼掃描 Modal (全畫面 100% 獨立運行，解決 iframe 鎖定)
        window.openScannerModal = function() {
            const existingModal = document.getElementById('scannerModal');
            if (existingModal) existingModal.remove();

            const modal = document.createElement('div');
            modal.id = 'scannerModal';
            modal.className = 'fixed inset-0 bg-slate-950/80 backdrop-blur-xs flex items-center justify-center z-50 p-4';
            modal.innerHTML = `
                <div class="bg-white border border-slate-200 rounded-2xl p-5 w-full max-w-sm shadow-2xl text-slate-800 text-center">
                    <div class="flex items-center justify-between mb-3">
                        <h3 class="text-xs font-bold text-slate-800 flex items-center gap-2">
                            <i class="fa-solid fa-camera text-blue-600"></i> 即時相機條碼掃描器
                        </h3>
                        <button id="btnCloseScanner" class="text-slate-400 hover:text-slate-600 text-sm p-1 font-bold">✕</button>
                    </div>

                    <div id="qr-reader" class="w-full rounded-xl overflow-hidden bg-slate-900 border border-slate-200 mb-3" style="min-height: 220px;"></div>
                    <p class="text-[11px] text-slate-500">提示：請將條碼或 QR Code 放入視窗中央即可自動讀取。</p>
                </div>
            `;
            document.body.appendChild(modal);

            const html5QrCode = new Html5Qrcode("qr-reader");
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 220, height: 120 } },
                (decodedText) => {
                    html5QrCode.stop().then(() => {
                        modal.remove();
                        handleBarcodeScan(decodedText);
                    });
                },
                () => {}
            ).catch(err => {
                alert("無法啟動相機，請確認已授予相機權限：" + err);
                modal.remove();
            });

            document.getElementById('btnCloseScanner').onclick = () => {
                if (html5QrCode.isScanning) {
                    html5QrCode.stop().then(() => modal.remove());
                } else {
                    modal.remove();
                }
            };
        };

        function handleBarcodeScan(rawInput) {
            if (!rawInput) return;
            const cleanedEam = String(rawInput).trim().replace(/^0+/, '');
            const targetAsset = allAssets.find(asset => String(asset.eam || '').trim().replace(/^0+/, '').toLowerCase() === cleanedEam.toLowerCase());

            if (targetAsset) {
                locateAndHighlightAsset(targetAsset);
                openActionModal(targetAsset);
            } else {
                alert('找不到資產 [' + cleanedEam + ']！請在平面圖點擊目標位置以新增此資產。');
            }
        }

        // 🌟 9. 頁面初始化與圖片載入監聽
        document.addEventListener("DOMContentLoaded", () => {
            console.log("🚀 網頁載入中，開始抓取階層選單與所有資產...");
            fetchHierarchy();
            fetchAllAssets();

            const img = document.getElementById('floorPlanImg');
            if (img) {
                img.onload = () => {
                    img.classList.remove('hidden');
                    const placeholderText = document.getElementById('placeholderText');
                    if (placeholderText) placeholderText.classList.add('hidden');
                    updateMarkersLayerSize();
                    if (currentFilteredAssets) renderAssetMarkers(currentFilteredAssets);
                };
            }

            window.addEventListener('resize', updateMarkersLayerSize);

            // 🚀 新增：延遲 1 秒後在背景默默預載所有單位的地圖到快取中
            setTimeout(() => {
                if (floorHierarchyData && floorHierarchyData.length > 0) {
                    console.log("🚀 開始在背景預載所有平面圖...");
                    floorHierarchyData.forEach(item => {
                        const wardKey = item.wardKey;
                        if (wardKey && !floorPlanCache[wardKey]) {
                            fetch(`${GAS_API_URL}?action=getFloorPlan&wardKey=${encodeURIComponent(wardKey)}`)
                                .then(res => res.json())
                                .then(data => {
                                    if (data && data.base64) {
                                        floorPlanCache[wardKey] = data.base64;
                                        console.log(`✅ 預載成功: ${wardKey}`);
                                    }
                                })
                                .catch(err => console.warn(`預載失敗: ${wardKey}`, err));
                        }
                    });
                }
            }, 500);
        });
    </script>
</body>
