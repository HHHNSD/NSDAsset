<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NSD Asset Management System (檢視 / 移動 / 備註)</title>
    <!-- 引入 Tailwind CSS 與 FontAwesome -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- 引入 html5-qrcode 條碼掃描庫 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <style>
        .kiosk-quad-btn {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        #mapViewport {
            touch-action: pan-x pan-y;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col font-sans">

    <!-- 頂部導覽與連動選單列 -->
    <header class="bg-white border-b border-slate-200 px-3 sm:px-6 py-3 flex flex-col sm:flex-row items-center justify-between gap-3 shadow-sm z-20">
        <div class="flex items-center space-x-3 w-full sm:w-auto justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-50 p-2.5 rounded-xl border border-blue-100 shadow-xs">
                    <i class="fa-solid fa-hospital text-blue-600 text-xl sm:text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-base sm:text-xl font-black tracking-wide text-slate-800">
                        NSD Asset Management System
                        <span class="text-xs font-bold bg-blue-100 text-blue-800 px-2 py-0.5 rounded-full border border-blue-200 align-middle ml-1">Viewer (檢視 / 移動 / 備註)</span>
                    </h1>
                    <p class="text-[10px] text-slate-400 font-medium">NSD IT &amp; Supplies Asset Viewer</p>
                </div>
            </div>
        </div>
    
        <!-- 階層連動選單區塊 -->
        <div class="grid grid-cols-3 gap-2 w-full sm:w-auto bg-slate-50 p-2.5 rounded-2xl border border-slate-200 shadow-inner">
            <div class="flex flex-col">
                <label class="text-[11px] font-bold text-slate-600 mb-1">棟別 (Block):</label>
                <select id="blockSelect" onchange="onBlockChange()" class="w-full bg-white text-slate-800 text-xs font-semibold rounded-xl px-2.5 py-1.5 border border-slate-300 focus:outline-none focus:border-blue-500 shadow-xs cursor-pointer">
                    <option value="">載入中...</option>
                </select>
            </div>
            <div class="flex flex-col">
                <label class="text-[11px] font-bold text-slate-600 mb-1">樓層 (Floor):</label>
                <select id="floorSelect" onchange="onFloorChange()" class="w-full bg-white text-slate-800 text-xs font-semibold rounded-xl px-2.5 py-1.5 border border-slate-300 focus:outline-none focus:border-blue-500 shadow-xs cursor-pointer">
                    <option value="">請選擇</option>
                </select>
            </div>
            <div class="flex flex-col">
                <label class="text-[11px] font-bold text-slate-600 mb-1">單位 (Ward):</label>
                <select id="wardSelect" onchange="onWardChange()" class="w-full bg-white text-slate-800 text-xs font-semibold rounded-xl px-2.5 py-1.5 border border-slate-300 focus:outline-none focus:border-blue-500 shadow-xs cursor-pointer">
                    <option value="">請選擇</option>
                </select>
            </div>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="flex-1 p-4 sm:p-6 grid grid-cols-1 lg:grid-cols-4 gap-6 items-stretch overflow-hidden">
        
        <!-- 左側區域：平面圖、搖桿導覽與提示橫幅 -->
        <div class="lg:col-span-3 flex flex-col gap-3 w-full min-w-0">
            <!-- 移動模式提示橫幅 -->
            <div id="selectionBanner" class="hidden bg-amber-500 border-4 border-amber-300 text-white px-5 py-3 rounded-2xl shadow-xl flex items-center justify-between text-sm font-extrabold tracking-wide transition-all z-20">
                <div class="flex items-center gap-3">
                    <i class="fa-solid fa-bullhorn text-xl text-yellow-100 animate-pulse"></i>
                    <span id="bannerText" class="text-xs tracking-wider">請直接在地圖點選新位置...</span>
                </div>
                <button type="button" onclick="cancelRelocate()" class="bg-amber-700 hover:bg-amber-800 text-white px-3 py-1.5 rounded-xl text-xs font-bold shadow-md cursor-pointer transition-all border border-amber-400">取消</button>
            </div>

            <!-- 套用地圖 (Stocktake Overlay) 狀態提示條 -->
            <div id="overlayStatusBanner" class="hidden bg-indigo-50 border border-indigo-200 text-indigo-800 px-4 py-2 rounded-2xl flex items-center justify-between text-xs font-semibold">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-layer-group text-indigo-600"></i>
                    <span id="overlayStatusText">盤點套用地圖已開啟：顯示未掃描資產</span>
                </div>
                <button type="button" onclick="toggleStocktakeOverlay(false)" class="text-[11px] bg-white hover:bg-indigo-100 text-indigo-700 border border-indigo-200 px-2.5 py-1 rounded-xl font-bold cursor-pointer transition">
                    關閉套用
                </button>
            </div>

            <!-- 地圖容器 -->
            <div id="mapContainer" class="w-full bg-white border border-slate-200 rounded-2xl relative shadow-sm overflow-hidden">
                
                <!-- 尚未選單位時的歡迎遮罩 -->
                <div id="placeholderText" class="text-center pointer-events-none absolute inset-0 flex flex-col items-center justify-center z-10 bg-slate-50/90 backdrop-blur-xs p-6">
                    <div class="w-16 h-16 bg-blue-100/80 rounded-3xl flex items-center justify-center mb-4 text-blue-600 shadow-sm border border-blue-200">
                        <i class="fa-solid fa-map-location-dot text-3xl"></i>
                    </div>
                    <h3 class="text-base sm:text-lg font-black text-slate-800 mb-1">歡迎使用 NSD 資產地圖檢視系統</h3>
                    <p class="text-xs text-slate-500 mb-2 font-medium">請選擇右上角單位、使用左下角搖桿導覽，或透過右側獨立欄位搜尋資產</p>
                </div>

                <!-- 可縮放平面圖視窗 -->
                <div id="mapViewport" class="w-full overflow-auto relative bg-slate-50">
                    <div id="mapZoomStage" class="origin-top-left transition-transform duration-150" style="transform: scale(1);">
                        <div id="mapWrapper" class="relative w-full aspect-[12/9] bg-slate-50 cursor-crosshair" onclick="handleMapClick(event)">
                            <img id="floorPlanImg" alt="Floor Plan" class="hidden absolute inset-0 w-full h-full object-fill pointer-events-auto" onclick="handleMapClick(event)">
                            <div id="markersLayer" class="absolute inset-0 pointer-events-none"></div>
                        </div>
                    </div>
                </div>

                <!-- 浮動搖桿導覽控制面板（含縮放 / 重設 + 90°四等分圓盤） -->
                <div id="joystickPanel" class="fixed sm:absolute bottom-4 left-4 z-30 bg-white/95 backdrop-blur-md border border-slate-200/90 rounded-3xl p-3 shadow-xl w-64 sm:w-72 select-none">
                    <!-- 頂部：目前單位名稱 + 縮放/重設按鈕 -->
                    <div class="flex items-center justify-between gap-1.5 pb-2 mb-2 border-b border-slate-100">
                        <div id="joystickStatusLabel" class="text-xs font-extrabold text-slate-800 truncate flex-1" title="尚未選擇單位">
                            <i class="fa-solid fa-grip-dots-vertical text-indigo-500 mr-1 text-[10px]"></i>尚未選擇單位
                        </div>
                        <div class="flex items-center gap-1 shrink-0">
                            <button type="button" onclick="adjustMapZoom(-0.2)" title="縮小平面圖" class="w-7 h-7 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs flex items-center justify-center cursor-pointer transition">
                                <i class="fa-solid fa-minus"></i>
                            </button>
                            <button type="button" onclick="adjustMapZoom(0.2)" title="放大平面圖" class="w-7 h-7 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs flex items-center justify-center cursor-pointer transition">
                                <i class="fa-solid fa-plus"></i>
                            </button>
                            <button type="button" onclick="resetMapZoom()" title="重設縮放" class="w-7 h-7 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs flex items-center justify-center cursor-pointer transition">
                                <i class="fa-solid fa-rotate-left"></i>
                            </button>
                        </div>
                    </div>

                    <!-- 上一樓層 -->
                    <button type="button" onclick="stepJoystickFloor(1)" class="w-full py-1.5 px-3 mb-2 rounded-full bg-gradient-to-r from-sky-500 to-indigo-600 hover:from-sky-400 hover:to-indigo-500 text-white text-xs font-extrabold shadow-xs flex items-center justify-center gap-1.5 cursor-pointer transition">
                        <i class="fa-solid fa-chevron-up text-[10px]"></i>
                        <span id="joystickFloorUpText">Floor ▲</span>
                    </button>

                    <!-- 中間列：左單位 + 精準四等分圓形棟別 + 右單位 -->
                    <div class="flex items-center justify-between gap-2 my-1">
                        <button type="button" onclick="stepJoystickWard(-1)" title="上一個單位" class="h-24 sm:h-28 w-10 sm:w-11 rounded-full bg-emerald-600 hover:bg-emerald-500 text-white flex flex-col items-center justify-center shadow-xs cursor-pointer transition shrink-0">
                            <i class="fa-solid fa-chevron-left text-xs mb-0.5"></i>
                            <span class="text-[10px] font-extrabold leading-tight">單位</span>
                        </button>

                        <!-- 中央圓形 4 格：精準 90° 四等分 + 文字置中 -->
                        <div class="relative w-24 h-24 sm:w-28 sm:h-28 mx-auto rounded-full border-2 border-slate-300 shadow-inner grid grid-cols-2 grid-rows-2 overflow-hidden shrink-0"
                            style="background: conic-gradient(from 0deg, rgba(224,242,254,0.95) 0deg 90deg, rgba(250,245,255,0.95) 90deg 180deg, rgba(254,243,199,0.95) 180deg 270deg, rgba(224,231,255,0.95) 270deg 360deg);">

                            <!-- 左上：T Block -->
                            <button type="button" data-joy-block="T" onclick="selectJoystickBlock('T')" title="T Block"
                                class="kiosk-quad-btn joy-block-quad w-full h-full flex flex-col items-center justify-center text-center p-2 bg-transparent cursor-pointer z-10 transition">
                                <span class="joy-main-label text-xs font-black leading-tight text-sky-950">T</span>
                                <span class="joy-sub-label text-[8px] font-bold leading-tight text-sky-950">Block</span>
                            </button>

                            <!-- 右上：M Block -->
                            <button type="button" data-joy-block="M" onclick="selectJoystickBlock('M')" title="M Block"
                                class="kiosk-quad-btn joy-block-quad w-full h-full flex flex-col items-center justify-center text-center p-2 bg-transparent cursor-pointer z-10 transition">
                                <span class="joy-main-label text-xs font-black leading-tight text-indigo-950">M</span>
                                <span class="joy-sub-label text-[8px] font-bold leading-tight text-indigo-950">Block</span>
                            </button>

                            <!-- 左下：Annex -->
                            <button type="button" data-joy-block="ANNEX" onclick="selectJoystickBlock('ANNEX')" title="Annex Building"
                                class="kiosk-quad-btn joy-block-quad w-full h-full flex flex-col items-center justify-center text-center p-2 bg-transparent cursor-pointer z-10 transition">
                                <span class="joy-main-label text-[10px] font-black leading-tight text-amber-950">Annex</span>
                                <span class="joy-sub-label text-[7.5px] font-bold leading-tight text-amber-950">Bldg</span>
                            </button>

                            <!-- 右下：Sys -->
                            <button type="button" data-joy-block="SYSTEM" onclick="selectJoystickBlock('SYSTEM')" title="System"
                                class="kiosk-quad-btn joy-block-quad w-full h-full flex flex-col items-center justify-center text-center p-2 bg-transparent cursor-pointer z-10 transition">
                                <span class="joy-main-label text-[10px] font-black leading-tight text-purple-950">Sys</span>
                                <span class="joy-sub-label text-[7.5px] font-bold leading-tight text-purple-950">tem</span>
                            </button>

                            <!-- 貫穿全圓的十字分隔線 -->
                            <div class="pointer-events-none absolute inset-x-0 top-1/2 -translate-y-1/2 h-[1.5px] bg-white/90 z-20"></div>
                            <div class="pointer-events-none absolute inset-y-0 left-1/2 -translate-x-1/2 w-[1.5px] bg-white/90 z-20"></div>

                            <!-- 圓心徽章 -->
                            <div class="pointer-events-none absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-6 h-6 sm:w-7 sm:h-7 rounded-full bg-white border-2 border-slate-200 shadow-md flex items-center justify-center z-30">
                                <span id="joystickCenterBadge" class="text-[8px] sm:text-[9px] font-black text-indigo-600">棟</span>
                            </div>
                        </div>

                        <button type="button" onclick="stepJoystickWard(1)" title="下一個單位" class="h-24 sm:h-28 w-10 sm:w-11 rounded-full bg-emerald-600 hover:bg-emerald-500 text-white flex flex-col items-center justify-center shadow-xs cursor-pointer transition shrink-0">
                            <i class="fa-solid fa-chevron-right text-xs mb-0.5"></i>
                            <span class="text-[10px] font-extrabold leading-tight">單位</span>
                        </button>
                    </div>

                    <!-- 下一樓層 -->
                    <button type="button" onclick="stepJoystickFloor(-1)" class="w-full py-1.5 px-3 mt-2 rounded-full bg-gradient-to-r from-amber-500 to-rose-500 hover:from-amber-400 hover:to-rose-400 text-white text-xs font-extrabold shadow-xs flex items-center justify-center gap-1.5 cursor-pointer transition">
                        <span id="joystickFloorDownText">Floor ▼</span>
                        <i class="fa-solid fa-chevron-down text-[10px]"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- 右側：獨立欄位資產清單、Stocktake 疊加與搜尋面板 -->
        <aside class="bg-white border border-slate-200 rounded-2xl p-4 flex flex-col h-full shadow-sm overflow-hidden min-h-0">
            <div class="pb-3 border-b border-slate-100 mb-3 space-y-2 shrink-0">
                <div class="flex items-center justify-between gap-1">
                    <h2 class="text-xs font-bold flex items-center gap-1.5 text-slate-700">
                        <i class="fa-solid fa-boxes-stacked text-blue-600"></i> 獨立欄位搜尋與清單
                    </h2>
                    <div class="flex items-center gap-1.5">
                        <button type="button" onclick="openStocktakeOverlayModal()" title="選擇現有盤點紀錄疊加至地圖（唯讀檢視）"
                            class="text-[10px] bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 px-2 py-0.5 rounded-full font-bold cursor-pointer transition-colors flex items-center gap-1">
                            <i class="fa-solid fa-layer-group"></i>
                            <span id="stocktakeOverlayBtnLabel">套用地圖</span>
                        </button>
                        <button type="button" onclick="resetSearchFilters()" title="清除所有搜尋條件" class="text-[10px] bg-slate-100 hover:bg-slate-200 text-slate-600 px-2 py-0.5 rounded-full font-semibold cursor-pointer transition-colors">
                            清除
                        </button>
                        <span id="assetCountBadge" class="text-[10px] bg-blue-50 text-blue-600 px-2 py-0.5 rounded-full border border-blue-100 font-semibold">0 項</span>
                    </div>
                </div>

                <!-- Record Type + 5 個獨立欄位 -->
                <div class="grid grid-cols-2 gap-2 text-xs">
                    <div class="col-span-2">
                        <label class="block text-[10px] font-bold text-slate-500 mb-0.5">Record Type (資產類別)</label>
                        <select id="searchRecordTypeSelect" onchange="applyMultiFieldSearch()"
                            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-1.5 text-xs text-slate-800 focus:outline-none focus:border-blue-500 focus:bg-white transition-all cursor-pointer">
                            <option value="ALL">全部 (0 項可選)</option>
                            <option value="Asset">僅 Asset (0 項可選)</option>
                            <option value="Non-Asset">僅 Non-Asset (0 項可選)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 mb-0.5">EAM</label>
                        <input id="searchEamInput" list="eamDatalist" type="text" oninput="applyMultiFieldSearch()" onchange="applyMultiFieldSearch()" placeholder="輸入或選 EAM..."
                            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-1.5 text-xs text-slate-800 focus:outline-none focus:border-blue-500 focus:bg-white transition-all">
                        <datalist id="eamDatalist"></datalist>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 mb-0.5">S/N (Serial)</label>
                        <input id="searchSerialInput" list="serialDatalist" type="text" oninput="applyMultiFieldSearch()" onchange="applyMultiFieldSearch()" placeholder="輸入或選 S/N..."
                            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-1.5 text-xs text-slate-800 focus:outline-none focus:border-blue-500 focus:bg-white transition-all">
                        <datalist id="serialDatalist"></datalist>
                    </div>
                    <div class="col-span-2">
                        <label class="block text-[10px] font-bold text-slate-500 mb-0.5">Type (現有資產類型)</label>
                        <input id="searchTypeInput" list="typeDatalist" type="text" oninput="applyMultiFieldSearch()" onchange="applyMultiFieldSearch()" placeholder="輸入或選現有 Type..."
                            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-1.5 text-xs text-slate-800 focus:outline-none focus:border-blue-500 focus:bg-white transition-all">
                        <datalist id="typeDatalist"></datalist>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 mb-0.5">Remark (備註)</label>
                        <input id="searchRemarkInput" list="remarkDatalist" type="text" oninput="applyMultiFieldSearch()" onchange="applyMultiFieldSearch()" placeholder="輸入或選 Remark..."
                            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-1.5 text-xs text-slate-800 focus:outline-none focus:border-blue-500 focus:bg-white transition-all">
                        <datalist id="remarkDatalist"></datalist>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 mb-0.5">Location (Ward Key，如 NS)</label>
                        <input id="searchLocationInput" list="locationDatalist" type="text" oninput="applyMultiFieldSearch()" onchange="applyMultiFieldSearch()" placeholder="輸入 Ward Key..."
                            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-1.5 text-xs text-slate-800 focus:outline-none focus:border-blue-500 focus:bg-white transition-all">
                        <datalist id="locationDatalist"></datalist>
                    </div>
                </div>

                <div class="flex justify-end pt-0.5">
                    <button type="button" onclick="openScannerModal()" title="開啟條碼掃描器" class="w-full bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 shrink-0 shadow-sm transition-all cursor-pointer hover:shadow">
                        <i class="fa-solid fa-barcode text-sm"></i>
                        <span>條碼掃描定位</span>
                    </button>
                </div>
            </div>

            <div id="assetListContainer" class="flex-1 overflow-y-auto space-y-2.5 pr-1 min-h-0">
                <p class="text-xs text-slate-400 text-center mt-12">請先選擇上方單位或使用獨立欄位搜尋</p>
            </div>
        </aside>
    </main>

    <!-- 核心運作腳本（Viewer 權限：檢視 / 移動位置 / 修改 Remark / Stocktake 唯讀套用地圖） -->
    <script>
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbz_z5U4DjeWY1k8dELIxaSxfMUW110kMnzutPXsqvCGQB3k5qJIwHRTJJmKha1eiNrBlQ/exec";
        const LOCKED_STATUS_WARDS = ['transfer', 'condemn', 'surplus', 'suplus'];

        let allAssets = [];
        let floorHierarchyData = [];
        let rawHierarchyData = [];
        let currentFilteredAssets = [];
        let isMovingAsset = null;
        let isRelocatingMode = false;
        const floorPlanCache = {};
        let isFloorPlanLoaded = false;

        // 縮放狀態
        let currentMapZoom = 1.0;

        // Stocktake 盤點套用地圖狀態（Viewer 僅支援讀取現有盤點紀錄並疊加檢視，不提供上傳檔案或新增未登記資產）
        let stocktakeSessions = [];
        let selectedStocktakeSessionIds = new Set();
        let stocktakeMapOverlayEnabled = false;

        function isLockedStatusWard(wardOrStatus) {
            return LOCKED_STATUS_WARDS.includes(String(wardOrStatus || '').trim().toLowerCase());
        }

        function normalizeLookupKey(val) {
            return String(val || '').trim().replace(/^0+/, '').toLowerCase();
        }

        function normalizeRecordType(rawType) {
            const val = String(rawType || '').trim().toLowerCase();
            if (val === 'non-asset' || val === 'nonasset' || val === 'non asset') return 'Non-Asset';
            return 'Asset';
        }

        function isNonAssetItem(asset) {
            return normalizeRecordType(asset?.recordType) === 'Non-Asset';
        }

        function findAssetByEam(eam) {
            const key = normalizeLookupKey(eam);
            if (!key) return null;
            return (allAssets || []).find(a => normalizeLookupKey(a.eam) === key) || null;
        }

        // ==============================
        // 地圖縮放與搖桿控制
        // ==============================
        function applyJoystickTransform() {
            const stage = document.getElementById('mapZoomStage');
            if (!stage) return;
            stage.style.transform = `scale(${currentMapZoom})`;
            stage.style.width = `${100 / currentMapZoom}%`;
            updateMarkersLayerSize();
        }

        function adjustMapZoom(delta) {
            currentMapZoom = Math.max(0.8, Math.min(2.6, parseFloat((currentMapZoom + delta).toFixed(2))));
            applyJoystickTransform();
        }

        function resetMapZoom() {
            currentMapZoom = 1.0;
            const viewport = document.getElementById('mapViewport');
            if (viewport) {
                viewport.scrollTop = 0;
                viewport.scrollLeft = 0;
            }
            applyJoystickTransform();
        }

        function normalizeJoyKey(val) {
            return String(val || '').trim().toLowerCase();
        }

        function getCurrentWardNameOnly() {
            const wardVal = document.getElementById('wardSelect')?.value || '';
            if (!wardVal) return '';
            const found = floorHierarchyData.find(h => String(h.wardKey || '').trim().toLowerCase() === wardVal.trim().toLowerCase());
            return found ? `${found.wardName} (${found.wardKey})` : wardVal;
        }

        function resolveMatchingBlockValue(quadKey) {
            const blocks = [...new Set(floorHierarchyData.map(h => String(h.block || '').trim()).filter(Boolean))];
            const q = String(quadKey || '').toUpperCase();
            if (q === 'T') return blocks.find(b => /^t( |\s|-|_)/i.test(b) || b.toLowerCase() === 't block') || '';
            if (q === 'M') return blocks.find(b => /^m( |\s|-|_)/i.test(b) || b.toLowerCase().includes('main')) || '';
            if (q === 'ANNEX') return blocks.find(b => b.toLowerCase().includes('annex')) || '';
            if (q === 'SYSTEM') return blocks.find(b => b.toLowerCase().includes('sys')) || (blocks.includes('System') ? 'System' : '');
            return '';
        }

        function selectJoystickBlock(quadKey) {
            const blockSelect = document.getElementById('blockSelect');
            if (!blockSelect) return;
            const targetBlock = resolveMatchingBlockValue(quadKey);
            if (!targetBlock) {
                updateJoystickUI();
                return;
            }
            blockSelect.value = targetBlock;
            onBlockChange();

            const floorSelect = document.getElementById('floorSelect');
            if (floorSelect && floorSelect.options.length > 1) {
                floorSelect.selectedIndex = 1;
                onFloorChange();
                const wardSelect = document.getElementById('wardSelect');
                if (wardSelect && wardSelect.options.length > 1) {
                    wardSelect.selectedIndex = 1;
                    onWardChange();
                }
            }
            updateJoystickUI();
        }

        function stepJoystickFloor(direction) {
            const blockSelect = document.getElementById('blockSelect');
            const floorSelect = document.getElementById('floorSelect');
            if (!blockSelect || !floorSelect || !blockSelect.value) return;

            const options = Array.from(floorSelect.options).filter(o => o.value);
            if (options.length === 0) return;
            const idx = options.findIndex(o => o.value === floorSelect.value);
            const nextIdx = idx === -1 ? 0 : (idx - direction + options.length) % options.length;
            floorSelect.value = options[nextIdx].value;
            onFloorChange();

            const wardSelect = document.getElementById('wardSelect');
            if (wardSelect && wardSelect.options.length > 1) {
                wardSelect.selectedIndex = 1;
                onWardChange();
            }
            updateJoystickUI();
        }

        function stepJoystickWard(direction) {
            const wardSelect = document.getElementById('wardSelect');
            if (!wardSelect) return;
            const options = Array.from(wardSelect.options).filter(o => o.value);
            if (options.length === 0) return;
            const idx = options.findIndex(o => o.value === wardSelect.value);
            const nextIdx = idx === -1 ? 0 : (idx + direction + options.length) % options.length;
            wardSelect.value = options[nextIdx].value;
            onWardChange();
            updateJoystickUI();
        }

        function updateJoystickUI() {
            const blockVal = document.getElementById('blockSelect')?.value || '';
            const floorVal = document.getElementById('floorSelect')?.value || '';
            const wardNameOnly = getCurrentWardNameOnly();

            const statusEl = document.getElementById('joystickStatusLabel');
            const centerEl = document.getElementById('joystickCenterBadge');
            const upEl = document.getElementById('joystickFloorUpText');
            const downEl = document.getElementById('joystickFloorDownText');

            if (statusEl) {
                const labelText = wardNameOnly || '尚未選擇單位';
                statusEl.innerHTML = `<i class="fa-solid fa-grip-dots-vertical text-indigo-500 mr-1 text-[10px]"></i>${labelText}`;
                statusEl.title = labelText;
            }

            if (centerEl) {
                if (!blockVal) {
                    centerEl.innerText = '棟';
                } else {
                    const nb = normalizeJoyKey(blockVal);
                    if (nb.startsWith('t')) centerEl.innerText = 'T';
                    else if (nb.startsWith('m') || nb.includes('main')) centerEl.innerText = 'M';
                    else if (nb.includes('annex')) centerEl.innerText = 'ANX';
                    else if (nb.includes('sys')) centerEl.innerText = 'SYS';
                    else centerEl.innerText = blockVal.slice(0, 3).toUpperCase();
                }
            }

            if (upEl) upEl.innerText = floorVal ? `Floor ▲ (${floorVal})` : 'Floor ▲';
            if (downEl) downEl.innerText = floorVal ? `Floor ▼ (${floorVal})` : 'Floor ▼';

            const activeTextMap = {
                T:      'text-sky-700',
                M:      'text-indigo-700',
                ANNEX:  'text-amber-700',
                SYSTEM: 'text-purple-700'
            };

            const normalTextMap = {
                T:      'text-sky-950',
                M:      'text-indigo-950',
                ANNEX:  'text-amber-950',
                SYSTEM: 'text-purple-950'
            };

            const allPossibleClasses = [
                'text-sky-700', 'text-sky-950',
                'text-indigo-700', 'text-indigo-950',
                'text-amber-700', 'text-amber-950',
                'text-purple-700', 'text-purple-950',
                'underline', 'decoration-2', 'underline-offset-2'
            ];

            document.querySelectorAll('.joy-block-quad').forEach(btn => {
                const quadKey = String(btn.getAttribute('data-joy-block') || '').toUpperCase();
                const resolved = resolveMatchingBlockValue(quadKey);
                const isActive = Boolean(resolved && blockVal && resolved.toLowerCase() === blockVal.toLowerCase());

                btn.classList.add('bg-transparent');
                const labels = btn.querySelectorAll('.joy-main-label, .joy-sub-label');
                labels.forEach(el => {
                    el.classList.remove(...allPossibleClasses);
                    if (isActive) {
                        el.classList.add(activeTextMap[quadKey] || 'text-slate-950', 'underline', 'decoration-2', 'underline-offset-2');
                    } else {
                        el.classList.add(normalTextMap[quadKey] || 'text-slate-900');
                    }
                });
            });

            applyJoystickTransform();
        }

        // ==============================
        // Stocktake 盤點疊加模式（唯讀檢視，不可上傳或新增未登記資產）
        // ==============================
        function getSelectedStocktakeSessions() {
            return (stocktakeSessions || []).filter(s => selectedStocktakeSessionIds.has(String(s.id || s.sessionId || s.title)));
        }

        function hydrateMatchedItem(u) {
            const eam = u.matchedEam || u.eam || '';
            const live = findAssetByEam(eam);
            return {
                ...u,
                matchedEam: live ? live.eam : eam,
                matchedSerial: live ? live.serial : (u.matchedSerial || u.serial || ''),
                matchedDescription: live ? live.description : (u.matchedDescription || u.description || ''),
                matchedBlock: live ? live.block : (u.matchedBlock || u.block || ''),
                matchedFloor: live ? live.floor : (u.matchedFloor || u.floor || ''),
                matchedWard: live ? live.ward : (u.matchedWard || u.ward || u.inputWard || ''),
                matchedX: live ? live.x : (u.matchedX ?? u.x),
                matchedY: live ? live.y : (u.matchedY ?? u.y)
            };
        }

        function getAllOverlayUnscannedAssets() {
            const selectedSessions = getSelectedStocktakeSessions();
            if (!selectedSessions || selectedSessions.length === 0) return [];

            const result = [];
            const seenKeys = new Set();

            selectedSessions.forEach(session => {
                (session.unscanned || []).forEach(u => {
                    const hydrated = hydrateMatchedItem(u);
                    const eamKey = normalizeLookupKey(hydrated.matchedEam || hydrated.eam);
                    const snKey = normalizeLookupKey(hydrated.matchedSerial || hydrated.serial);
                    const uniqueKey = eamKey ? `eam:${eamKey}` : (snKey ? `sn:${snKey}` : `row:${hydrated.rowIndex || result.length}`);
                    if (seenKeys.has(uniqueKey)) return;
                    seenKeys.add(uniqueKey);

                    const liveAsset = findAssetByEam(hydrated.matchedEam || hydrated.eam);
                    if (liveAsset) {
                        result.push(liveAsset);
                    } else {
                        result.push({
                            recordType: 'Asset',
                            eam: hydrated.matchedEam || hydrated.eam || '',
                            serial: hydrated.matchedSerial || hydrated.serial || 'N/A',
                            description: hydrated.matchedDescription || hydrated.description || '未命名 Asset',
                            block: hydrated.matchedBlock || '',
                            floor: hydrated.matchedFloor || '',
                            ward: hydrated.matchedWard || hydrated.inputWard || '',
                            remark: hydrated.inputRemark || '',
                            x: hydrated.matchedX,
                            y: hydrated.matchedY,
                            _isOverlayOnly: true
                        });
                    }
                });
            });

            return result;
        }

        function toggleStocktakeOverlay(enabled) {
            stocktakeMapOverlayEnabled = Boolean(enabled);
            const banner = document.getElementById('overlayStatusBanner');
            const bannerText = document.getElementById('overlayStatusText');
            const btnLabel = document.getElementById('stocktakeOverlayBtnLabel');

            if (stocktakeMapOverlayEnabled && getSelectedStocktakeSessions().length > 0) {
                const count = getAllOverlayUnscannedAssets().length;
                if (banner) banner.classList.remove('hidden');
                if (bannerText) bannerText.innerText = `盤點套用地圖已開啟：共 ${count} 項未掃描資產（右側清單已完整列出，可用篩選器過濾）`;
                if (btnLabel) btnLabel.innerText = `套用中 (${count})`;
            } else {
                stocktakeMapOverlayEnabled = false;
                if (banner) banner.classList.add('hidden');
                if (btnLabel) btnLabel.innerText = '套用地圖';
            }

            const wardSelect = document.getElementById('wardSelect');
            if (wardSelect && wardSelect.value) {
                renderAssetMarkers(currentFilteredAssets);
            }
            applyMultiFieldSearch();
        }

        function fetchStocktakeSessions() {
            return fetch(`${GAS_API_URL}?action=getStocktakeSessions&_t=${Date.now()}`)
                .then(res => res.json())
                .then(data => {
                    if (Array.isArray(data)) {
                        stocktakeSessions = data;
                    } else if (data && Array.isArray(data.sessions)) {
                        stocktakeSessions = data.sessions;
                    } else {
                        stocktakeSessions = [];
                    }
                    return stocktakeSessions;
                })
                .catch(err => {
                    console.warn("讀取盤點紀錄失敗:", err);
                    stocktakeSessions = [];
                    return [];
                });
        }

        // ==============================
        // 搜尋與篩選邏輯
        // ==============================
        function getCurrentSearchCriteria() {
            return {
                recordType: document.getElementById('searchRecordTypeSelect')?.value || 'ALL',
                eam: document.getElementById('searchEamInput')?.value || '',
                serial: document.getElementById('searchSerialInput')?.value || '',
                type: document.getElementById('searchTypeInput')?.value || '',
                remark: document.getElementById('searchRemarkInput')?.value || '',
                location: document.getElementById('searchLocationInput')?.value || ''
            };
        }

        function filterAssetsByCriteria(assets, criteria, excludeField = null) {
            const recType = excludeField === 'recordType' ? 'ALL' : (criteria.recordType || 'ALL');
            const eamKw = excludeField === 'eam' ? '' : (criteria.eam || '').toLowerCase().trim();
            const serialKw = excludeField === 'serial' ? '' : (criteria.serial || '').toLowerCase().trim();
            const typeKw = excludeField === 'type' ? '' : (criteria.type || '').toLowerCase().trim();
            const remarkKw = excludeField === 'remark' ? '' : (criteria.remark || '').toLowerCase().trim();
            const locationKw = excludeField === 'location' ? '' : (criteria.location || '').toLowerCase().trim();

            return (assets || []).filter(asset => {
                if (recType !== 'ALL' && normalizeRecordType(asset.recordType) !== recType) return false;
                const eam = String(asset.eam || '').toLowerCase().trim();
                const serial = String(asset.serial || '').toLowerCase().trim();
                const description = String(asset.description || '').toLowerCase().trim();
                const remark = String(asset.remark || '').toLowerCase().trim();
                const ward = String(asset.ward || '').toLowerCase().trim();

                if (eamKw && !eam.includes(eamKw)) return false;
                if (serialKw && !serial.includes(serialKw)) return false;
                if (typeKw && !description.includes(typeKw)) return false;
                if (remarkKw && !remark.includes(remarkKw)) return false;
                if (locationKw && !ward.includes(locationKw)) return false;
                return true;
            });
        }

        function setDatalistValues(datalistId, values) {
            const dl = document.getElementById(datalistId);
            if (!dl) return;
            const sorted = [...new Set(
                (values || [])
                    .filter(v => v !== undefined && v !== null && String(v).trim() !== '')
                    .map(v => String(v).trim())
            )].sort((x, y) => x.localeCompare(y, undefined, { numeric: true, sensitivity: 'base' }));

            dl.innerHTML = sorted.map(v => `<option value="${v.replace(/"/g, '&quot;')}"></option>`).join('');
        }

        function syncLinkedSearchDatalists(criteria) {
            const isOverlayActive = Boolean(stocktakeMapOverlayEnabled && getSelectedStocktakeSessions().length > 0);
            const wardSelect = document.getElementById('wardSelect');
            const basePool = isOverlayActive
                ? getAllOverlayUnscannedAssets()
                : ((wardSelect && wardSelect.value) ? currentFilteredAssets : allAssets);

            const recType = criteria.recordType || 'ALL';
            const poolForType = filterAssetsByCriteria(basePool, criteria, 'recordType');
            const sel = document.getElementById('searchRecordTypeSelect');
            if (sel) {
                const totalCount = poolForType.length;
                const assetCount = poolForType.filter(a => normalizeRecordType(a.recordType) === 'Asset').length;
                const nonAssetCount = poolForType.filter(a => normalizeRecordType(a.recordType) === 'Non-Asset').length;
                sel.innerHTML = `
                    <option value="ALL" ${recType === 'ALL' ? 'selected' : ''}>全部 (${totalCount} 項可選)</option>
                    <option value="Asset" ${recType === 'Asset' ? 'selected' : ''} ${assetCount === 0 && recType !== 'Asset' ? 'disabled' : ''}>僅 Asset (${assetCount} 項可選)</option>
                    <option value="Non-Asset" ${recType === 'Non-Asset' ? 'selected' : ''} ${nonAssetCount === 0 && recType !== 'Non-Asset' ? 'disabled' : ''}>僅 Non-Asset (${nonAssetCount} 項可選)</option>
                `;
            }

            const filteredForFields = filterAssetsByCriteria(basePool, criteria, null);
            setDatalistValues('eamDatalist', filteredForFields.filter(a => !isNonAssetItem(a)).map(a => a.eam));
            setDatalistValues('serialDatalist', filteredForFields.filter(a => !isNonAssetItem(a)).map(a => a.serial));
            setDatalistValues('typeDatalist', filteredForFields.map(a => a.description));
            setDatalistValues('remarkDatalist', filteredForFields.map(a => a.remark));
            setDatalistValues('locationDatalist', filteredForFields.map(a => a.ward));
        }

        function populateSearchDatalists() {
            syncLinkedSearchDatalists(getCurrentSearchCriteria());
        }

        function hasActiveMultiSearch() {
            const c = getCurrentSearchCriteria();
            return Boolean(
                (c.recordType && c.recordType !== 'ALL') ||
                c.eam.trim() ||
                c.serial.trim() ||
                c.type.trim() ||
                c.remark.trim() ||
                c.location.trim()
            );
        }

        function renderSidebarWithPriority(fallbackAssets = null) {
            const isOverlayActive = Boolean(stocktakeMapOverlayEnabled && getSelectedStocktakeSessions().length > 0);
            const hasFilter = hasActiveMultiSearch();

            // 套用地圖開啟時：無視右上角單位，完整顯示已勾選 Stocktake 的未掃描資產；篩選器有條件時才過濾
            if (isOverlayActive) {
                const overlayPool = getAllOverlayUnscannedAssets();
                const finalList = hasFilter
                    ? filterAssetsByCriteria(overlayPool, getCurrentSearchCriteria(), null)
                    : overlayPool;
                renderAssetSidebarList(finalList);
                return;
            }

            if (hasFilter) {
                const matchedAssets = filterAssetsByCriteria(allAssets, getCurrentSearchCriteria(), null);
                renderAssetSidebarList(matchedAssets);
                return;
            }
            if (Array.isArray(fallbackAssets)) {
                renderAssetSidebarList(fallbackAssets);
                return;
            }
            const wardSelect = document.getElementById('wardSelect');
            if (wardSelect && wardSelect.value) {
                renderAssetSidebarList(currentFilteredAssets);
            } else {
                renderAssetSidebarList(allAssets);
            }
        }

        function applyMultiFieldSearch() {
            const criteria = getCurrentSearchCriteria();
            syncLinkedSearchDatalists(criteria);
            renderSidebarWithPriority();
        }

        function resetSearchFilters() {
            const recSel = document.getElementById('searchRecordTypeSelect');
            if (recSel) recSel.value = 'ALL';
            ['searchEamInput', 'searchSerialInput', 'searchTypeInput', 'searchRemarkInput', 'searchLocationInput'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.value = '';
            });
            applyMultiFieldSearch();
        }

        // ==============================
        // 資料載入與平面圖渲染
        // ==============================
        function fetchAllAssets(focusEam = null) {
            return fetch(`${GAS_API_URL}?action=getAllAssets&_t=${Date.now()}`)
                .then(res => res.json())
                .then(data => {
                    allAssets = data || [];
                    window.allAssets = allAssets;
                    populateSearchDatalists();

                    if (focusEam) {
                        const updatedAsset = allAssets.find(a => String(a.eam || '').trim() === String(focusEam).trim());
                        if (updatedAsset) {
                            locateAndHighlightAsset(updatedAsset);
                            return;
                        }
                    }

                    const wardSelect = document.getElementById('wardSelect');
                    if (wardSelect && wardSelect.value) {
                        currentFilteredAssets = allAssets.filter(a => a.ward && a.ward.trim().toLowerCase() === wardSelect.value.trim().toLowerCase());
                        window.currentLoadedAssets = currentFilteredAssets;
                        renderAssetMarkers(currentFilteredAssets);
                    }
                    renderSidebarWithPriority(wardSelect && wardSelect.value ? currentFilteredAssets : allAssets);
                })
                .catch(err => console.error("抓取資產失敗:", err));
        }

        function fetchHierarchy() {
            fetch(`${GAS_API_URL}?action=getHierarchy&_t=${Date.now()}`)
                .then(res => res.json())
                .then(data => {
                    floorHierarchyData = data || [];
                    rawHierarchyData = data || [];
                    initDropdowns(floorHierarchyData);
                    populateSearchDatalists();
                    updateJoystickUI();

                    floorHierarchyData.forEach(item => {
                        const wardKey = item.wardKey;
                        if (wardKey && !floorPlanCache[wardKey]) {
                            fetch(`${GAS_API_URL}?action=getFloorPlan&wardKey=${encodeURIComponent(wardKey)}`)
                                .then(res => res.json())
                                .then(planData => {
                                    if (planData && planData.base64) {
                                        floorPlanCache[wardKey] = planData.base64;
                                    }
                                })
                                .catch(err => console.warn(`預載失敗: ${wardKey}`, err));
                        }
                    });
                })
                .catch(err => console.error("抓取選單階層失敗:", err));
        }

        function loadFloorPlan(wardKey) {
            var imgEl = document.getElementById('floorPlanImg');
            isFloorPlanLoaded = false;

            if (floorPlanCache[wardKey]) {
                imgEl.src = floorPlanCache[wardKey];
                imgEl.classList.remove('hidden');
                isFloorPlanLoaded = true;
                const placeholder = document.getElementById('placeholderText');
                if (placeholder) placeholder.classList.add('hidden');
                return;
            }

            fetch(`${GAS_API_URL}?action=getFloorPlan&wardKey=${encodeURIComponent(wardKey)}`)
                .then(res => res.json())
                .then(data => {
                    if (data && data.base64) {
                        floorPlanCache[wardKey] = data.base64;
                        imgEl.src = data.base64;
                        imgEl.classList.remove('hidden');
                        isFloorPlanLoaded = true;
                        const placeholder = document.getElementById('placeholderText');
                        if (placeholder) placeholder.classList.add('hidden');
                    } else {
                        imgEl.src = '';
                        imgEl.classList.add('hidden');
                        isFloorPlanLoaded = false;
                    }
                })
                .catch(err => {
                    console.error("載入平面圖失敗: ", err);
                    isFloorPlanLoaded = false;
                });
        }

        // ==============================
        // Viewer 允許的寫入操作：僅修改 Remark 與更改位置
        // ==============================
        function openEditRemarkModal(asset) {
            if (asset._isOverlayOnly) {
                alert("此項目尚未正式登記於資產總表，Viewer 權限無法新增或修改未登記資產。");
                return;
            }
            const existingModal = document.getElementById('editRemarkModal');
            if (existingModal) existingModal.remove();

            const modal = document.createElement('div');
            modal.id = 'editRemarkModal';
            modal.className = 'fixed inset-0 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center z-50 p-4';
            modal.innerHTML = `
                <div class="bg-white border border-slate-200 rounded-2xl p-6 w-full max-w-sm shadow-2xl text-slate-800">
                    <h3 class="text-xs font-bold mb-2 text-blue-600 text-center flex items-center justify-center gap-2">
                        <i class="fa-solid fa-pen-to-square"></i> 修改備註 (Remark)
                    </h3>
                    <p class="text-[11px] text-slate-500 text-center mb-4">

                    <div class="space-y-3 text-xs">

                                class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-slate-800 focus:outline-none focus:border-blue-500">${asset.remark || ''}</textarea>
                        </div>
                    </div>

                    <div class="flex gap-2 mt-5">
                        <button id="btnSaveRemark" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold py-2.5 rounded-xl transition-all shadow-md cursor-pointer">儲存備註</button>
                        <button id="btnCancelRemark" class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs py-2.5 rounded-xl transition-all cursor-pointer">取消</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);

            const remarkInput = document.getElementById('editRemarkInput');
            remarkInput.focus();

            document.getElementById('btnSaveRemark').onclick = () => {
                const updatedAsset = { ...asset, remark: remarkInput.value.trim() };
                modal.remove();
                updateAssetInSheet(updatedAsset, updatedAsset.eam);
            };
            document.getElementById('btnCancelRemark').onclick = () => modal.remove();
        }

        function updateAssetInSheet(asset, focusEam = null) {
            if (!asset || asset._isOverlayOnly) return Promise.resolve();
            asset.dept = asset.dept || "NSD";
            return fetch(GAS_API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'updateAsset', asset: asset })
            })
            .then(res => res.json())
            .then(() => {
                alert("資產更新成功！");
                return fetchAllAssets(focusEam || asset.eam);
            })
            .catch(err => alert("更新失敗: " + err));
        }

        function initDropdowns(hierarchy) {
            const blockSelect = document.getElementById('blockSelect');
            if (!blockSelect) return;
            const blocks = [...new Set(hierarchy.map(h => h.block))];
            blockSelect.innerHTML = '<option value="">請選擇棟別</option>' + 
                blocks.map(b => `<option value="${b}">${b}</option>`).join('');
        }

        function onBlockChange() {
            const block = document.getElementById('blockSelect').value;
            const floorSelect = document.getElementById('floorSelect');
            const wardSelect = document.getElementById('wardSelect');
            floorSelect.innerHTML = '<option value="">請選擇樓層</option>';
            wardSelect.innerHTML = '<option value="">請先選擇樓層</option>';
            updateJoystickUI();
            if (!block) return;
            const floors = [...new Set(floorHierarchyData.filter(h => h.block === block).map(h => h.floor))];
            floorSelect.innerHTML += floors.map(f => `<option value="${f}">${f}</option>`).join('');
        }

        function onFloorChange() {
            const block = document.getElementById('blockSelect').value;
            const floor = document.getElementById('floorSelect').value;
            const wardSelect = document.getElementById('wardSelect');
            wardSelect.innerHTML = '<option value="">請選擇單位</option>';
            updateJoystickUI();
            if (!floor) return;
            const wards = floorHierarchyData.filter(h => h.block === block && h.floor === floor);
            wardSelect.innerHTML += wards.map(w => `<option value="${w.wardKey}">${w.wardName} (${w.wardKey})</option>`).join('');
        }

        function onWardChange() {
            const wardKey = document.getElementById('wardSelect').value;
            updateJoystickUI();
            if (!wardKey) return;
            cancelRelocate();
            loadFloorPlan(wardKey);
            currentFilteredAssets = allAssets.filter(a => a.ward && a.ward.trim().toLowerCase() === wardKey.trim().toLowerCase());
            window.currentLoadedAssets = currentFilteredAssets;
            renderAssetMarkers(currentFilteredAssets);
            syncLinkedSearchDatalists(getCurrentSearchCriteria());
            renderSidebarWithPriority(currentFilteredAssets);
        }

        function getAssetTypeConfig(description) {

            if (desc.includes('laptop') || desc.includes('notebook') || desc.includes('thinkpad') || desc.includes('probook') || desc.includes('elitebook')) {
                return { icon: 'fa-house-laptop', color: 'text-blue-600', bg: 'bg-blue-50', border: 'border-blue-500' };
            }
            if (desc.includes('ipad') || desc.includes('ios tablet')) {
                return { icon: 'fa-tablet-screen-button', color: 'text-indigo-600', bg: 'bg-indigo-50', border: 'border-indigo-500' };

            if (desc.includes('tablet') || desc.includes('handheld') || desc.includes('microsoft spro') || desc.includes('pda')) {
                return { icon: 'fa-tablet', color: 'text-violet-600', bg: 'bg-violet-50', border: 'border-violet-500' };
            }
            if (desc.includes('monitor') || desc.includes('display') || desc.includes('lcd')) {

            }
            if (desc.includes('television') || desc.includes('tv')) {
                return { icon: 'fa-tv', color: 'text-cyan-600', bg: 'bg-cyan-50', border: 'border-cyan-500' };
            }
            if ((desc.includes('printer') && (desc.includes('thermal') || desc.includes('label') || desc.includes('spp-r'))) || desc.includes('bixolon')) {
                return { icon: 'fa-print', color: 'text-purple-600', bg: 'bg-purple-50', border: 'border-purple-500' };

            }
            if (desc.includes('camera') || desc.includes('video system') || desc.includes('endoscope')) {
                return { icon: 'fa-camera', color: 'text-orange-600', bg: 'bg-orange-50', border: 'border-orange-500' };

            if (desc.includes('cabinet') || desc.includes('shelv') || desc.includes('storage') || desc.includes('locker')) {

            }

        function calculateMarkerPositions(assets) {
            if (!assets || !Array.isArray(assets)) return [];
            const GRID_X = 60, GRID_Y = 45;
            return assets.map(asset => {
                const snappedX = Math.round(asset.x * (GRID_X / 100)) / (GRID_X / 100);
                const snappedY = Math.round(asset.y * (GRID_Y / 100)) / (GRID_Y / 100);
                return { ...asset, baseX: snappedX, baseY: snappedY, offsetX: 0, offsetY: 0 };
            });
        }

        function renderAssetMarkers(assets, highlightEam = null) {
            updateMarkersLayerSize();
            const markersLayer = document.getElementById('markersLayer');
            const floorPlanImg = document.getElementById('floorPlanImg');
            if (!markersLayer) return;
            markersLayer.innerHTML = '';
            if (!floorPlanImg || floorPlanImg.classList.contains('hidden')) return;

            const isOverlayActive = Boolean(stocktakeMapOverlayEnabled && getSelectedStocktakeSessions().length > 0);
            const unscannedEamSet = new Set(
                isOverlayActive
                    ? getAllOverlayUnscannedAssets().map(a => normalizeLookupKey(a.eam)).filter(Boolean)
                    : []
            );

            const processedAssets = calculateMarkerPositions(assets);
            processedAssets.forEach(asset => {
                if (asset.x === undefined || asset.y === undefined || asset.x === '' || asset.y === '') return;
                const typeConfig = getAssetTypeConfig(asset.description);
                const marker = document.createElement('div');
                marker.className = 'asset-pin-marker absolute cursor-pointer transition-all pointer-events-auto z-10';

                const posX = asset.baseX !== undefined ? asset.baseX : asset.x;
                const posY = asset.baseY !== undefined ? asset.baseY : asset.y;
                marker.style.left = `${posX}%`;
                marker.style.top = `${posY}%`;
                marker.style.transformOrigin = 'center center';
                marker.style.transform = `translate(-50%, -50%) scale(var(--map-scale, 1))`;

                const isHighlighted = highlightEam && String(asset.eam).trim() === String(highlightEam).trim();
                const isUnscannedOverlay = isOverlayActive && unscannedEamSet.has(normalizeLookupKey(asset.eam));

                marker.innerHTML = `
                    <div class="relative flex items-center justify-center w-7 h-7 rounded-full border-2 shadow-md transition-transform hover:scale-110 ${typeConfig.bg} ${
                        isUnscannedOverlay ? 'border-rose-500 ring-2 ring-rose-300' : typeConfig.border
                    } ${
                        isHighlighted ? 'ring-4 ring-amber-400 animate-bounce scale-125 z-30' : ''
                    }">
                        <i class="fa-solid ${typeConfig.icon} text-xs ${typeConfig.color}"></i>
                        ${isUnscannedOverlay ? '<span class="absolute -top-1 -right-1 w-2.5 h-2.5 rounded-full bg-rose-600 border border-white"></span>' : ''}
                    </div>
                `;
                
                marker.onclick = (e) => {
                    e.stopPropagation();
                    openActionModal(asset);
                };
                markersLayer.appendChild(marker);
            });
        }

                actionBtn.className = 'p-2.5 text-slate-400 hover:text-blue-600 hover:bg-blue-50 rounded-xl transition-all shrink-0 border border-transparent hover:border-blue-100 cursor-pointer';
                actionBtn.innerHTML = `<i class="fa-solid fa-ellipsis-vertical text-sm"></i>`;
                actionBtn.onclick = (e) => {
