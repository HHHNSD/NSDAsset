
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NSD Asset Manage System (Viewer)</title>
    <!-- 引入 Tailwind CSS 與 FontAwesome -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- 引入 html5-qrcode 條碼掃描庫 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <style>
        @keyframes pairDashFlow {
            to {
                stroke-dashoffset: -16;
            }
        }
        .pair-connection-line {
            stroke-dasharray: 5, 3;
            animation: pairDashFlow 1.2s linear infinite;
            transition: stroke 0.2s ease, stroke-width 0.2s ease, opacity 0.2s ease;
        }
        .pair-connection-line.is-active {
            stroke: #f59e0b !important;
            stroke-width: 3.5 !important;
            opacity: 1 !important;
            filter: drop-shadow(0 0 4px rgba(245, 158, 11, 0.75));
        }
        .asset-pin-marker.pair-group-active > div {
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.55), 0 8px 16px rgba(0, 0, 0, 0.2);
            transform: scale(1.22);
            z-index: 35;
        }
    
        .kiosk-joystick-pad {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
            transform-origin: bottom left;
        }
        .kiosk-quad-btn {
            transition: transform 0.12s ease, background-color 0.15s ease, box-shadow 0.15s ease, color 0.15s ease;
        }
        .kiosk-quad-btn:active {
            transform: scale(0.95);
        }
        .kiosk-nav-btn {
            transition: transform 0.12s ease, background-color 0.15s ease, color 0.15s ease;
        }
        .kiosk-nav-btn:active {
            transform: scale(0.93);
        }
    
        /* 只有 Unscanned Asset 在地圖上 highlight */
        .stocktake-unscanned-pin > div {
            box-shadow: 0 0 0 4px rgba(244, 63, 94, 0.8), 0 8px 18px rgba(244, 63, 94, 0.48);
            transform: scale(1.26);
            z-index: 40;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col font-sans">

    <!-- 頂部導覽與連動選單列 -->
    <header class="bg-white border-b border-slate-200 px-3 sm:px-6 py-3 flex flex-col sm:flex-row items-center justify-between gap-3 shadow-sm z-20">
        <div class="flex items-center space-x-3 w-full sm:w-auto justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-50 p-2.5 rounded-xl border border-blue-100 shadow-xs">
                    <i class="fa-solid fa-hospital text-blue-600 text-xl sm:text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-base sm:text-xl font-black tracking-wide text-slate-800">NSD Asset Management System <span class="text-xs font-bold bg-sky-100 text-sky-800 px-2 py-0.5 rounded-full border border-sky-300 align-middle ml-1">Viewer</span></h1>
                    <p class="text-[10px] text-slate-400 font-medium">NSD Asset Management System</p>
                </div>
            </div>
        </div>
    
        <!-- 階層連動選單區塊 -->
        <div class="grid grid-cols-3 gap-2 w-full sm:w-auto bg-slate-50 p-2.5 rounded-2xl border border-slate-200 shadow-inner">
            <div class="flex flex-col">
                <label class="text-[11px] font-bold text-slate-600 mb-1">棟別 (Block):</label>
                <select id="blockSelect" onchange="onBlockChange()" class="w-full bg-white text-slate-800 text-xs font-semibold rounded-xl px-2.5 py-1.5 border border-slate-300 focus:outline-none focus:border-blue-500 shadow-xs cursor-pointer">
                    <option value="">載入中...</option>
                </select>
            </div>
            <div class="flex flex-col">
                <label class="text-[11px] font-bold text-slate-600 mb-1">樓層 (Floor):</label>
                <select id="floorSelect" onchange="onFloorChange()" class="w-full bg-white text-slate-800 text-xs font-semibold rounded-xl px-2.5 py-1.5 border border-slate-300 focus:outline-none focus:border-blue-500 shadow-xs cursor-pointer">
                    <option value="">請選擇</option>
                </select>
            </div>
            <div class="flex flex-col">
                <label class="text-[11px] font-bold text-slate-600 mb-1">單位 (Ward):</label>
                <select id="wardSelect" onchange="onWardChange()" class="w-full bg-white text-slate-800 text-xs font-semibold rounded-xl px-2.5 py-1.5 border border-slate-300 focus:outline-none focus:border-blue-500 shadow-xs cursor-pointer">
                    <option value="">請選擇</option>
                </select>
            </div>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="flex-1 p-6 grid grid-cols-1 lg:grid-cols-4 gap-6 items-stretch overflow-hidden">
        
        <!-- 左側區域：平面圖與提示橫幅 -->
        <div class="lg:col-span-3 flex flex-col gap-3 w-full min-w-0">
            <div id="selectionBanner" class="hidden bg-amber-500 border-4 border-amber-300 text-white px-6 py-3 rounded-2xl shadow-xl flex items-center justify-between text-sm font-extrabold tracking-wide transition-all z-20">
                <div class="flex items-center gap-3">
                    <i class="fa-solid fa-bullhorn text-xl text-yellow-100 animate-pulse"></i>
                    <span id="bannerText" class="text-xs tracking-wider">請直接在地圖點選新位置...</span>
                </div>
                <button onclick="cancelRelocate()" class="bg-amber-700 hover:bg-amber-800 text-white px-3 py-1.5 rounded-xl text-xs font-bold shadow-md cursor-pointer transition-all border border-amber-400">取消</button>
            </div>

            <div id="mapContainer" class="w-full bg-white border border-slate-200 rounded-2xl relative shadow-sm overflow-hidden cursor-crosshair">
                
                <div id="placeholderText" class="text-center pointer-events-none absolute inset-0 flex flex-col items-center justify-center z-10 bg-slate-50/90 backdrop-blur-xs p-6">
                    <div class="w-16 h-16 bg-blue-100/80 rounded-3xl flex items-center justify-center mb-4 text-blue-600 shadow-sm border border-blue-200">
                        <i class="fa-solid fa-map-location-dot text-3xl"></i>
                    </div>
                    <h3 class="text-base sm:text-lg font-black text-slate-800 mb-1">歡迎使用 NSD Asset 地圖管理系統</h3>
                    <p class="text-xs text-slate-500 mb-6 font-medium">請選擇右上角單位載入平面圖，或使用右側獨立欄位搜尋 Asset：</p>
                </div>
                
                <div id="mapWrapper" class="relative w-full aspect-[12/9] bg-slate-50" onclick="handleMapClick(event)">
                    <img id="floorPlanImg" alt="Floor Plan" class="hidden absolute inset-0 w-full h-full object-fill pointer-events-auto" onclick="handleMapClick(event)">
                    <div id="markersLayer" class="absolute inset-0 pointer-events-none"></div>

                    <!-- 地圖左下角：商場指南式快速切換搖桿（可拖曳、可縮放、自動隨螢幕比例縮放） -->
                    <div id="kioskJoystick" onclick="event.stopPropagation()"
                        class="kiosk-joystick-pad absolute bottom-3 left-3 z-20 bg-white/95 backdrop-blur-md border border-slate-200/90 rounded-2xl p-2 shadow-xl flex flex-col items-center gap-1 w-[196px] sm:w-[216px] pointer-events-auto">

                        <!-- 頂部拖曳列與縮放控制：最上方僅顯示 Ward Name -->
                        <div id="joystickDragHandle" title="按住拖曳移動搖桿位置"
                            class="w-full flex items-center justify-between gap-1 px-1 pb-1 border-b border-slate-100 cursor-grab active:cursor-grabbing">
                            <span id="joystickStatusLabel" class="text-[11px] font-black text-slate-800 truncate flex-1">
                                <i class="fa-solid fa-grip-dots-vertical text-slate-400 mr-1 text-[10px]"></i>尚未選擇單位
                            </span>
                            <div class="flex items-center gap-0.5 shrink-0" onpointerdown="event.stopPropagation()" onclick="event.stopPropagation()">
                                <button type="button" onclick="adjustJoystickScale(-0.15)" title="縮小搖桿"
                                    class="w-5 h-5 rounded-md bg-slate-100 hover:bg-slate-200 text-slate-600 flex items-center justify-center text-[10px] font-bold cursor-pointer">
                                    <i class="fa-solid fa-minus"></i>
                                </button>
                                <button type="button" onclick="adjustJoystickScale(0.15)" title="放大搖桿"
                                    class="w-5 h-5 rounded-md bg-slate-100 hover:bg-slate-200 text-slate-600 flex items-center justify-center text-[10px] font-bold cursor-pointer">
                                    <i class="fa-solid fa-plus"></i>
                                </button>
                                <button type="button" onclick="resetJoystickTransform()" title="重設位置與大小"
                                    class="w-5 h-5 rounded-md bg-slate-100 hover:bg-blue-100 text-slate-500 hover:text-blue-700 flex items-center justify-center text-[9px] font-bold cursor-pointer">
                                    <i class="fa-solid fa-rotate-left"></i>
                                </button>
                            </div>
                        </div>

                        <!-- 上：往上層 (Floor ▲) -->
                        <button type="button" onclick="cycleJoystickFloor(1)" title="往上層 Floor（到最高樓層自動換 Block）"
                            class="kiosk-nav-btn w-full h-6 rounded-xl bg-gradient-to-r from-sky-500 via-blue-600 to-indigo-600 hover:from-sky-400 hover:via-blue-500 hover:to-indigo-500 text-white border border-blue-400/50 flex items-center justify-center gap-1 text-[10px] font-extrabold cursor-pointer shadow-xs">
                            <i class="fa-solid fa-chevron-up text-[9px]"></i>
                            <span id="joystickFloorUpText">Floor ▲</span>
                        </button>

                        <!-- 中列：左(上一個單位) + 中央圓形4格(左上 T Block / 右上 M Block / 左下 Annex / 右下 Sys) + 右(下一個單位) -->
                        <div class="w-full grid grid-cols-[28px_1fr_28px] items-center gap-1">
                            <!-- 左：上一個單位（首次點擊從 T Block G/F 開始） -->
                            <button type="button" onclick="cycleJoystickWard(-1)" title="上一個單位（首次點擊從 T Block G/F 開始）"
                                class="kiosk-nav-btn h-24 rounded-xl bg-gradient-to-b from-teal-500 to-emerald-600 hover:from-teal-400 hover:to-emerald-500 text-white border border-emerald-400/50 flex flex-col items-center justify-center gap-1 cursor-pointer shadow-xs">
                                <i class="fa-solid fa-chevron-left text-[10px]"></i>
                                <span class="text-[8px] font-extrabold leading-none">單位</span>
                            </button>

                            <!-- 中央圓形 4 格：平均四等分 + 文字置中 -->
                            <div class="relative w-24 h-24 sm:w-28 sm:h-28 mx-auto rounded-full border-2 border-slate-300 shadow-inner grid grid-cols-2 grid-rows-2 overflow-hidden"
                                style="background: conic-gradient(from 0deg, rgba(224,242,254,0.95) 0deg 90deg, rgba(250,245,255,0.95) 90deg 180deg, rgba(254,243,199,0.95) 180deg 270deg, rgba(224,231,255,0.95) 270deg 360deg);">
                            
                                <!-- 左上：T Block -->
                                <button type="button" data-joy-block="T" onclick="selectJoystickBlock('T')" title="T Block"
                                    class="kiosk-quad-btn joy-block-quad w-full h-full flex flex-col items-center justify-center text-center p-2 bg-transparent cursor-pointer z-10 transition">
                                    <span class="joy-main-label text-xs font-black leading-tight">T</span>
                                    <span class="joy-sub-label text-[8px] font-bold leading-tight">Block</span>
                                </button>
                            
                                <!-- 右上：M Block -->
                                <button type="button" data-joy-block="M" onclick="selectJoystickBlock('M')" title="M Block"
                                    class="kiosk-quad-btn joy-block-quad w-full h-full flex flex-col items-center justify-center text-center p-2 bg-transparent cursor-pointer z-10 transition">
                                    <span class="joy-main-label text-xs font-black leading-tight">M</span>
                                    <span class="joy-sub-label text-[8px] font-bold leading-tight">Block</span>
                                </button>
                            
                                <!-- 左下：Annex -->
                                <button type="button" data-joy-block="ANNEX" onclick="selectJoystickBlock('ANNEX')" title="Annex Building"
                                    class="kiosk-quad-btn joy-block-quad w-full h-full flex flex-col items-center justify-center text-center p-2 bg-transparent cursor-pointer z-10 transition">
                                    <span class="joy-main-label text-[10px] font-black leading-tight">Annex</span>
                                    <span class="joy-sub-label text-[7.5px] font-bold leading-tight">Bldg</span>
                                </button>
                            
                                <!-- 右下：Sys -->
                                <button type="button" data-joy-block="SYSTEM" onclick="selectJoystickBlock('SYSTEM')" title="System"
                                    class="kiosk-quad-btn joy-block-quad w-full h-full flex flex-col items-center justify-center text-center p-2 bg-transparent cursor-pointer z-10 transition">
                                    <span class="joy-main-label text-[10px] font-black leading-tight">Sys</span>
                                    <span class="joy-sub-label text-[7.5px] font-bold leading-tight">tem</span>
                                </button>
                            
                                <!-- 貫穿全圓的十字分隔線 -->
                                <div class="pointer-events-none absolute inset-x-0 top-1/2 -translate-y-1/2 h-[1.5px] bg-white/90 z-20"></div>
                                <div class="pointer-events-none absolute inset-y-0 left-1/2 -translate-x-1/2 w-[1.5px] bg-white/90 z-20"></div>
                            
                                <!-- 圓心徽章 -->
                                <div class="pointer-events-none absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-6 h-6 sm:w-7 sm:h-7 rounded-full bg-white border-2 border-slate-200 shadow-md flex items-center justify-center z-30">
                                    <span id="joystickCenterBadge" class="text-[8px] sm:text-[9px] font-black text-indigo-600">棟</span>
                                </div>
                            </div>

                            <!-- 右：下一個單位（首次點擊從 T Block G/F 開始） -->
                            <button type="button" onclick="cycleJoystickWard(1)" title="下一個單位（首次點擊從 T Block G/F 開始）"
                                class="kiosk-nav-btn h-24 rounded-xl bg-gradient-to-b from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white border border-emerald-400/50 flex flex-col items-center justify-center gap-1 cursor-pointer shadow-xs">
                                <i class="fa-solid fa-chevron-right text-[10px]"></i>
                                <span class="text-[8px] font-extrabold leading-none">單位</span>
                            </button>
                        </div>

                        <!-- 下：往下層 (Floor ▼) -->
                        <button type="button" onclick="cycleJoystickFloor(-1)" title="往下層 Floor"
                            class="kiosk-nav-btn w-full h-6 rounded-xl bg-gradient-to-r from-amber-500 via-orange-500 to-rose-500 hover:from-amber-400 hover:via-orange-400 hover:to-rose-400 text-white border border-orange-300/60 flex items-center justify-center gap-1 text-[10px] font-extrabold cursor-pointer shadow-xs">
                            <span id="joystickFloorDownText">Floor ▼</span>
                            <i class="fa-solid fa-chevron-down text-[9px]"></i>
                        </button>
                    </div>

                </div>
            </div>
        </div>

        <!-- 右側：Stocktake 操作列 + 獨立欄位Asset清單與搜尋面板 -->
        <aside class="bg-white border border-slate-200 rounded-2xl p-4 flex flex-col h-full shadow-sm overflow-hidden min-h-0">
            <!-- 收合為單一「Stocktake 記錄」按鈕，節省空間 -->
            <div id="stocktakeToolbar" class="mb-3 pb-3 border-b border-slate-100 shrink-0">
                <button type="button" onclick="openStocktakeHistoryModal()"
                    class="w-full bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold px-3 py-2 rounded-xl shadow-xs flex items-center justify-between cursor-pointer transition-all">
                    <span class="flex items-center gap-2">
                        <i class="fa-solid fa-clipboard-list"></i>
                        <span>Stocktake 記錄</span>
                    </span>
                    <span class="flex items-center gap-1.5">
                        <span id="stocktakeOverlayStatusPill" class="hidden bg-emerald-400 text-slate-900 text-[10px] font-black px-2 py-0.5 rounded-full">地圖套用中</span>
                        <span id="stocktakeHistoryBadge" class="bg-white text-indigo-700 text-[10px] font-black px-2 py-0.5 rounded-full">0</span>
                    </span>
                </button>
            </div>

            <div class="pb-3 border-b border-slate-100 mb-3 space-y-2 shrink-0">
                <div class="flex items-center justify-between">
                    <h2 id="rightPanelListHeading" class="text-xs font-bold flex items-center gap-2 text-slate-700">
                        <i class="fa-solid fa-boxes-stacked text-blue-600"></i> 獨立欄位搜尋與清單
                    </h2>
                    <div class="flex items-center gap-1.5">
                        <button type="button" onclick="resetSearchFilters()" title="清除所有搜尋條件" class="text-[10px] bg-slate-100 hover:bg-slate-200 text-slate-600 px-2 py-0.5 rounded-full font-semibold cursor-pointer transition-colors">
                            清除篩選
                        </button>
                        <span id="assetCountBadge" class="text-[10px] bg-blue-50 text-blue-600 px-2 py-0.5 rounded-full border border-blue-100 font-semibold">0 項</span>
                    </div>
                </div>

                <!-- 5 個獨立欄位 -->
                <div class="grid grid-cols-2 gap-2 text-xs">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 mb-0.5">EAM</label>
                        <input id="searchEamInput" list="eamDatalist" type="text" oninput="applyMultiFieldSearch()" onchange="applyMultiFieldSearch()" placeholder="輸入或選 EAM..."
                            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-1.5 text-xs text-slate-800 focus:outline-none focus:border-blue-500 focus:bg-white transition-all">
                        <datalist id="eamDatalist"></datalist>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 mb-0.5">S/N (Serial)</label>
                        <input id="searchSerialInput" list="serialDatalist" type="text" oninput="applyMultiFieldSearch()" onchange="applyMultiFieldSearch()" placeholder="輸入或選 S/N..."
                            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-1.5 text-xs text-slate-800 focus:outline-none focus:border-blue-500 focus:bg-white transition-all">
                        <datalist id="serialDatalist"></datalist>
                    </div>
                    <div class="col-span-2">
                        <label class="block text-[10px] font-bold text-slate-500 mb-0.5">Type (現有 Asset 類型)</label>
                        <input id="searchTypeInput" list="typeDatalist" type="text" oninput="applyMultiFieldSearch()" onchange="applyMultiFieldSearch()" placeholder="輸入或選現有 Type..."
                            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-1.5 text-xs text-slate-800 focus:outline-none focus:border-blue-500 focus:bg-white transition-all">
                        <datalist id="typeDatalist"></datalist>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 mb-0.5">Remark (備註)</label>
                        <input id="searchRemarkInput" list="remarkDatalist" type="text" oninput="applyMultiFieldSearch()" onchange="applyMultiFieldSearch()" placeholder="輸入或選 Remark..."
                            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-1.5 text-xs text-slate-800 focus:outline-none focus:border-blue-500 focus:bg-white transition-all">
                        <datalist id="remarkDatalist"></datalist>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 mb-0.5">Location (Ward Key，如 NS)</label>
                        <input id="searchLocationInput" list="locationDatalist" type="text" oninput="applyMultiFieldSearch()" onchange="applyMultiFieldSearch()" placeholder="輸入 Ward Key..."
                            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-1.5 text-xs text-slate-800 focus:outline-none focus:border-blue-500 focus:bg-white transition-all">
                        <datalist id="locationDatalist"></datalist>
                    </div>
                </div>

                <div>
                    <label for="searchRecordTypeSelect" class="block text-[10px] font-bold text-slate-500 mb-0.5">RecordType 篩選</label>
                    <select id="searchRecordTypeSelect" onchange="applyMultiFieldSearch()"
                        class="w-full bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-1.5 text-xs font-bold text-slate-800 focus:outline-none focus:border-blue-500 focus:bg-white transition-all cursor-pointer">
                        <option value="ALL">全部 (Asset + Non-Asset)</option>
                        <option value="Asset">僅 Asset</option>
                        <option value="Non-Asset">僅 Non-Asset</option>
                    </select>
                </div>

                <div class="flex justify-end pt-0.5">
                    <button type="button" onclick="openScannerModal()" title="開啟條碼掃描器" class="w-full bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 shrink-0 shadow-sm transition-all cursor-pointer hover:shadow">
                        <i class="fa-solid fa-barcode text-sm"></i>
                        <span>掃描 EAM</span>
                    </button>
                </div>
            </div>

            <div id="assetListContainer" class="flex-1 overflow-y-auto space-y-2.5 pr-1 min-h-0">
                <p class="text-xs text-slate-400 text-center mt-12">請先選擇上方單位或使用獨立欄位搜尋</p>
            </div>
        </aside>
    </main>

    <!-- 核心運作腳本 -->
    <script>
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbz_z5U4DjeWY1k8dELIxaSxfMUW110kMnzutPXsqvCGQB3k5qJIwHRTJJmKha1eiNrBlQ/exec";
        const GITHUB_IMAGES_BASE_URL = "https://hhhnsd.github.io/NSDAsset/images/";
        const LOCKED_STATUS_WARDS = ['transfer', 'condemn', 'surplus', 'suplus'];

        function normalizeRecordType(raw) {
            const v = String(raw || '').trim().toLowerCase();
            if (v === 'non-asset' || v === 'nonasset' || v === 'non asset') {
                return 'Non-Asset';
            }
            return 'Asset';
        }

        function isNonAssetItem(item) {
            return normalizeRecordType(item && item.recordType) === 'Non-Asset';
        }

        function getItemDisplayTitle(item) {
            if (!item) return '';
            const desc = String(item.description || '').trim();
            if (isNonAssetItem(item)) {
                return desc || '未命名 Non-Asset 項目';
            }
            return desc || '未命名 Asset';
        }

        function getItemDisplayCode(item) {
            if (!item) return '';
            const eam = String(item.eam || '').trim();
            if (isNonAssetItem(item)) {
                return eam && !/^nonasset[-_]?\d+$/i.test(eam) && !eam.toUpperCase().startsWith('NONASSET-') ? eam : 'Non-Asset';
            }
            return eam || 'N/A';
        }

        let allAssets = [];
        let floorHierarchyData = [];
        let rawHierarchyData = [];

        // 簡化時間格式：只顯示 DD/MM/YYYY HH:mm，不顯示 GMT 與時區長串
        function formatShortDateTime(input) {
            if (!input) return '--/--/---- --:--';
            const rawStr = String(input).trim();
            const d = input instanceof Date ? input : new Date(rawStr);
            if (!Number.isNaN(d.getTime())) {
                const pad = (n) => String(n).padStart(2, '0');
                return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
            }
            return rawStr
                .replace(/\s*GMT[+-]\d{4}.*$/i, '')
                .replace(/:\d{2}(\s|$)/, '$1')
                .trim();
        }

        function normalizeSerialValue(val) {
            const s = String(val ?? '').normalize('NFKC').replace(/\u00a0/g, ' ').trim();
            return s !== '' ? s : 'N/A';
        }

        function isLockedStatusWard(wardOrStatus) {
            return LOCKED_STATUS_WARDS.includes(String(wardOrStatus || '').trim().toLowerCase());
        }

        function parsePairedEamList(pairValue) {
            if (!pairValue) return [];
            return [...new Set(
                String(pairValue)
                    .split(/[,，;\s]+/)
                    .map(s => s.trim())
                    .filter(Boolean)
            )];
        }

        function findAssetByEam(eamCode) {
            const target = String(eamCode || '').trim().toLowerCase();
            if (!target) return null;
            return (allAssets || []).find(a => String(a.eam || '').trim().toLowerCase() === target) || null;
        }

        function getPairOwnerAssets(asset) {
            if (!asset || !asset.eam) return [];
            const targetEamLower = String(asset.eam).trim().toLowerCase();
            if (!targetEamLower) return [];

            return (allAssets || []).filter(item => {
                if (!item || !item.eam) return false;
                const itemEamLower = String(item.eam).trim().toLowerCase();
                if (itemEamLower === targetEamLower) return false;
                const deps = parsePairedEamList(item.pair).map(e => e.toLowerCase());
                return deps.includes(targetEamLower);
            });
        }

        function renderClickableEamList(eamList, colorClass = 'text-indigo-700 hover:bg-indigo-100 bg-indigo-50/90 border-indigo-200') {
            if (!Array.isArray(eamList) || eamList.length === 0) {

            }
            return `<div class="flex flex-wrap justify-end gap-1">${

                }).join('')

        }

        function getDirectDependentAssets(asset) {
            if (!asset) return [];
            const depEams = parsePairedEamList(asset.pair);
            if (depEams.length === 0) return [];

            const selfEam = String(asset.eam || '').trim().toLowerCase();
            return (allAssets || []).filter(a => {
                const eamStr = String(a.eam || '').trim();
                return eamStr &&
                       eamStr.toLowerCase() !== selfEam &&
                       depEams.some(d => d.toLowerCase() === eamStr.toLowerCase());
            });
        }

        function getRelatedPairEamSet(targetEam) {
            const relatedSet = new Set();
            const cleanTarget = String(targetEam || '').trim().toLowerCase();
            if (!cleanTarget) return relatedSet;

            relatedSet.add(cleanTarget);

            (allAssets || []).forEach(item => {
                const itemEam = String(item.eam || '').trim().toLowerCase();
                if (!itemEam) return;
                const deps = parsePairedEamList(item.pair).map(e => e.toLowerCase());

                if (itemEam === cleanTarget) {
                    deps.forEach(d => relatedSet.add(d));
                } else if (deps.includes(cleanTarget)) {
                    relatedSet.add(itemEam);
                }
            });

            return relatedSet;
        }

        function highlightPairGroupOnMap(targetEam) {
            const relatedSet = getRelatedPairEamSet(targetEam);
            if (relatedSet.size <= 1) return;

            document.querySelectorAll('.asset-pin-marker').forEach(pin => {
                const pinEam = String(pin.getAttribute('data-pin-eam') || '').toLowerCase();
                if (relatedSet.has(pinEam)) {
                    pin.classList.add('pair-group-active');
                }
            });

            document.querySelectorAll('.pair-connection-line').forEach(line => {
                const fromEam = String(line.getAttribute('data-from-eam') || '').toLowerCase();
                const toEam = String(line.getAttribute('data-to-eam') || '').toLowerCase();
                const cleanTarget = String(targetEam || '').trim().toLowerCase();

            document.querySelectorAll('.asset-pin-marker.pair-group-active').forEach(pin => {

            document.querySelectorAll('.pair-connection-line.is-active').forEach(line => {
                line.classList.remove('is-active');
            });
        }

        function isPositionOccupied(x, y, occupiedCoords, threshold = 1.2) {
            return occupiedCoords.some(pt =>
                Math.abs(Number(pt.x) - Number(x)) < threshold &&
                Math.abs(Number(pt.y) - Number(y)) < threshold
            );
        }

        function clampCoord(val, min = 2, max = 98) {
            return parseFloat(Math.max(min, Math.min(max, val)).toFixed(2));
        }

        function computePairFollowCoordinate(baseX, baseY, index, wardAssets, alreadyPlacedCoords) {
            const k = index + 1;
            const step = 2 * k;

            const occupied = [
                ...alreadyPlacedCoords,
                ...(wardAssets || [])
                    .filter(a => a.x !== undefined && a.y !== undefined && a.x !== '' && a.y !== '')
                    .map(a => ({ x: Number(a.x), y: Number(a.y) }))
            ];

            const downX = clampCoord(baseX);
            const downY = clampCoord(baseY + step);
            if (!isPositionOccupied(downX, downY, occupied)) {
                return { x: downX, y: downY };
            }

            const rightX = clampCoord(baseX + step);
            const rightY = clampCoord(baseY);
            if (!isPositionOccupied(rightX, rightY, occupied)) {
                return { x: rightX, y: rightY };
            }

            const upX = clampCoord(baseX);
            const upY = clampCoord(baseY - step);
            if (!isPositionOccupied(upX, upY, occupied)) {
                return { x: upX, y: upY };
            }

            const leftX = clampCoord(baseX - step);
            const leftY = clampCoord(baseY);
            return { x: leftX, y: leftY };
        }

        function applyAssetListToLocalState(updatedList, focusEam = null, jumpToTargetPage = false) {
            const list = Array.isArray(updatedList) ? updatedList : [updatedList];
            if (list.length === 0) return;

            list.forEach(updatedAsset => {
                if (!updatedAsset || !updatedAsset.eam) return;
                const targetEam = String(updatedAsset.eam).trim().toLowerCase();
                const idx = allAssets.findIndex(a => String(a.eam || '').trim().toLowerCase() === targetEam);
                if (idx > -1) {
                    allAssets[idx] = { ...allAssets[idx], ...updatedAsset };
                } else {
                    allAssets.push({ ...updatedAsset });
                }
            });

            window.allAssets = allAssets;
            populateSearchDatalists();

            const targetFocus = focusEam
                ? allAssets.find(a => String(a.eam || '').trim().toLowerCase() === String(focusEam).trim().toLowerCase())
                : list[0];

            if (jumpToTargetPage && targetFocus) {
                locateAndHighlightAsset(targetFocus);
                return;
            }

            const wardSelect = document.getElementById('wardSelect');
            const selectedWard = wardSelect ? String(wardSelect.value || '').trim().toLowerCase() : '';

            if (targetFocus && targetFocus.ward && String(targetFocus.ward).trim().toLowerCase() !== selectedWard) {
                locateAndHighlightAsset(targetFocus);
                return;
            }

            if (selectedWard) {
                currentFilteredAssets = allAssets.filter(
                    a => a.ward && String(a.ward).trim().toLowerCase() === selectedWard
                );
                window.currentLoadedAssets = currentFilteredAssets;
                renderAssetMarkers(currentFilteredAssets, focusEam || (list[0] && list[0].eam));
            }

            renderSidebarWithPriority(selectedWard ? currentFilteredAssets : allAssets);

            if (focusEam) {
                setTimeout(() => {
                    document.querySelectorAll('[data-eam]').forEach(card => {
                        if (String(card.getAttribute('data-eam') || '').trim().toLowerCase() === String(focusEam).trim().toLowerCase()) {
                            card.classList.add('ring-4', 'ring-amber-400', 'bg-amber-50');
                            setTimeout(() => card.classList.remove('ring-4', 'ring-amber-400', 'bg-amber-50'), 2500);
                        }
                    });
                }, 50);
            }
        }

        function syncLocalAssetAfterUpdate(updatedAsset) {
            applyAssetListToLocalState([updatedAsset], updatedAsset && updatedAsset.eam, false);
        }

        async function batchUpdateAssetsInSheet(assetsToUpdate, focusEam = null) {
            try {
                for (const item of assetsToUpdate) {
                    item.dept = item.dept || "NSD";
                    item.pair = item.pair ? String(item.pair).trim() : "";
                    const res = await fetch(GAS_API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action: 'updateAsset', asset: item })
                    }).then(r => r.json());

                    if (res && res.status === 'error') {
                        throw new Error(res.message || `更新 [${item.eam}] 失敗`);
                    }
                }
                alert(`✅ 已成功更新 ${assetsToUpdate.length} 項Asset！`);
                applyAssetListToLocalState(assetsToUpdate, focusEam || (assetsToUpdate[0] && assetsToUpdate[0].eam), false);
            } catch (err) {
                alert("批次更新失敗: " + err);
            }
        }

                    <div id="pairMoveCheckboxList" class="border border-slate-200 rounded-xl divide-y divide-slate-100 max-h-56 overflow-y-auto bg-white mb-4">
                        ${dependents.map(dep => `

                primaryAsset.floor = targetFloor;
                primaryAsset.ward = targetWard;

                primaryAsset.y = targetY;

                const wardAssets = (allAssets || []).filter(
                    a => String(a.ward || '').trim().toLowerCase() === String(targetWard || '').trim().toLowerCase() &&
                         String(a.eam || '').trim().toLowerCase() !== String(primaryAsset.eam || '').trim().toLowerCase()
                );
                const placedCoords = [{ x: Number(targetX), y: Number(targetY) }];
                let followIndex = 0;

                const batchList = [primaryAsset];
                dependents.forEach(dep => {
                    if (checkedEams.has(String(dep.eam).trim())) {
                        const nextPt = computePairFollowCoordinate(
                            Number(targetX),
                            Number(targetY),
                            followIndex,
                            wardAssets,
                            placedCoords
                        );
                        followIndex += 1;
                        placedCoords.push(nextPt);

                        dep.block = targetBlock;
                        dep.floor = targetFloor;
                        dep.ward = targetWard;
                        dep.x = nextPt.x;
                        dep.y = nextPt.y;
                        dep.dept = "NSD";
                        batchList.push(dep);
                    }
                });

                modal.remove();

                if (batchList.length > 1) {
                    batchUpdateAssetsInSheet(batchList, primaryAsset.eam);
                } else {
                    updateAssetInSheet(primaryAsset, primaryAsset.eam);
                }
            };

        async function handleMapPinPairSelection(clickedAsset) {
            if (!isSelectingPairOnMap || !pendingPairTargetAsset || !clickedAsset) return false;

            const targetEam = String(pendingPairTargetAsset.eam || '').trim();
            const pickedEam = String(clickedAsset.eam || '').trim();

            if (!pickedEam) return true;

            if (pickedEam.toLowerCase() === targetEam.toLowerCase()) {
                alert("⚠️ 主件不能配對自己本身！");
                return true;
            }

            if (isLockedStatusWard(clickedAsset.ward)) {
                alert(`⚠️ 配件 [${pickedEam}] 已處於 [${clickedAsset.ward}] 狀態，無法加入配對。`);
                return true;
            }

            const currentList = parsePairedEamList(pendingPairTargetAsset.pair);
            const exists = currentList.some(e => e.toLowerCase() === pickedEam.toLowerCase());

            if (exists) {
                const removeConfirm = confirm(`配件 [${pickedEam}] 已配對在主件 [${targetEam}] 下，是否要解除此配件配對？`);
                if (removeConfirm) {
                    const nextList = currentList.filter(e => e.toLowerCase() !== pickedEam.toLowerCase());
                    pendingPairTargetAsset.pair = nextList.join(', ');
                    await updateAssetInSheet(pendingPairTargetAsset, targetEam);
                }
                return true;
            }

            currentList.push(pickedEam);
            pendingPairTargetAsset.pair = currentList.join(', ');
            alert(`✅ 已將配件 [${pickedEam}] (${clickedAsset.description || '無類型'}) 配對到主件 [${targetEam}]！
已配對配件：${pendingPairTargetAsset.pair}`);
            await updateAssetInSheet(pendingPairTargetAsset, targetEam);
            return true;
        }

        function filterAssetsByCriteria(assets, criteria, excludeField = null) {
            const recType = excludeField === 'recordType' ? 'ALL' : (criteria.recordType || 'ALL');
            const eamKw = excludeField === 'eam' ? '' : (criteria.eam || '').toLowerCase().trim();
            const serialKw = excludeField === 'serial' ? '' : (criteria.serial || '').toLowerCase().trim();
            const typeKw = excludeField === 'type' ? '' : (criteria.type || '').toLowerCase().trim();
            const remarkKw = excludeField === 'remark' ? '' : (criteria.remark || '').toLowerCase().trim();
            const locationKw = excludeField === 'location' ? '' : (criteria.location || '').toLowerCase().trim();

            return (assets || []).filter(asset => {
                const itemType = normalizeRecordType(asset.recordType);
                if (recType === 'Asset' && itemType !== 'Asset') return false;
                if (recType === 'Non-Asset' && itemType !== 'Non-Asset') return false;

                const eam = String(asset.eam || '').toLowerCase().trim();
                const serial = String(asset.serial || '').toLowerCase().trim();
                const description = String(asset.description || '').toLowerCase().trim();
                const remark = String(asset.remark || '').toLowerCase().trim();
                const ward = String(asset.ward || '').toLowerCase().trim();

                if (eamKw && !eam.includes(eamKw)) return false;
                if (serialKw && !serial.includes(serialKw)) return false;
                if (typeKw && !description.includes(typeKw)) return false;
                if (remarkKw && !remark.includes(remarkKw)) return false;
                if (locationKw && !ward.includes(locationKw)) return false;
                return true;
            });
        }

        function setDatalistValues(datalistId, values) {
            const dl = document.getElementById(datalistId);
            if (!dl) return;
            const sorted = [...new Set(
                (values || [])
                    .filter(v => v !== undefined && v !== null && String(v).trim() !== '')
                    .map(v => String(v).trim())
            )].sort((x, y) => x.localeCompare(y, undefined, { numeric: true, sensitivity: 'base' }));

            dl.innerHTML = sorted.map(v => `<option value="${v.replace(/"/g, '&quot;')}"></option>`).join('');
        }

        function syncLinkedSearchDatalists(criteria) {
            const isOverlayActive = Boolean(stocktakeMapOverlayEnabled && getSelectedStocktakeSessions().length > 0);
            const wardSelect = document.getElementById('wardSelect');
            const currentScopePool = isOverlayActive
                ? getAllOverlayUnscannedAssets()
                : ((wardSelect && wardSelect.value) ? currentFilteredAssets : allAssets);

            const basePool = currentScopePool;
            const recType = criteria.recordType || 'ALL';
            const poolForType = filterAssetsByCriteria(basePool, criteria, 'recordType');
            const sel = document.getElementById('searchRecordTypeSelect');
            if (sel) {
                const totalCount = poolForType.length;
                const assetCount = poolForType.filter(a => normalizeRecordType(a.recordType) === 'Asset').length;
                const nonAssetCount = poolForType.filter(a => normalizeRecordType(a.recordType) === 'Non-Asset').length;
                sel.innerHTML = `
                    <option value="ALL" ${recType === 'ALL' ? 'selected' : ''}>全部 (${totalCount} 項可選)</option>
                    <option value="Asset" ${recType === 'Asset' ? 'selected' : ''} ${assetCount === 0 && recType !== 'Asset' ? 'disabled' : ''}>僅 Asset (${assetCount} 項可選)</option>
                    <option value="Non-Asset" ${recType === 'Non-Asset' ? 'selected' : ''} ${nonAssetCount === 0 && recType !== 'Non-Asset' ? 'disabled' : ''}>僅 Non-Asset (${nonAssetCount} 項可選)</option>
                `;
            }
            const filteredForFields = filterAssetsByCriteria(basePool, criteria, null);
            setDatalistValues('eamDatalist', filteredForFields.filter(a => !isNonAssetItem(a)).map(a => a.eam));
            setDatalistValues('serialDatalist', filteredForFields.filter(a => !isNonAssetItem(a)).map(a => a.serial));
            setDatalistValues('typeDatalist', filteredForFields.map(a => a.description));
            setDatalistValues('remarkDatalist', filteredForFields.map(a => a.remark));
            setDatalistValues('locationDatalist', filteredForFields.map(a => a.ward));
        }

        function getAllOverlayUnscannedAssets() {
            const selectedSessions = getSelectedStocktakeSessions();
            if (!selectedSessions || selectedSessions.length === 0) return [];

            const result = [];
            const seenKeys = new Set();

            selectedSessions.forEach(session => {
                (session.unscanned || []).forEach(u => {
                    const hydrated = hydrateMatchedItem(u);
                    const eamKey = normalizeLookupKey(hydrated.matchedEam || hydrated.eam);
                    const snKey = normalizeLookupKey(hydrated.matchedSerial || hydrated.serial);
                    const uniqueKey = eamKey ? `eam:${eamKey}` : (snKey ? `sn:${snKey}` : `row:${hydrated.rowIndex || result.length}`);
                    if (seenKeys.has(uniqueKey)) return;
                    seenKeys.add(uniqueKey);

                    const liveAsset = findAssetByEam(hydrated.matchedEam || hydrated.eam);
                    if (liveAsset) {
                        result.push(liveAsset);
                    } else {
                        result.push({
                            recordType: 'Asset',
                            eam: hydrated.matchedEam || hydrated.eam || '',
                            serial: hydrated.matchedSerial || hydrated.serial || 'N/A',
                            description: hydrated.matchedDescription || hydrated.description || '未命名 Asset',
                            block: hydrated.matchedBlock || '',
                            floor: hydrated.matchedFloor || '',
                            ward: hydrated.matchedWard || hydrated.inputWard || '',
                            remark: hydrated.inputRemark || '',
                            x: hydrated.matchedX,
                            y: hydrated.matchedY
                        });
                    }
                });
            });

            return result;
        }

        function callWithSequentialWaits(buildUrl, onSuccess, onError, waitSteps = [5000, 30000, 60000]) {
            let settled = false;
            let lastError = null;
            let timerId = null;
            const controllers = new Set();

            function clearPendingTimer() {
                if (timerId !== null) {
                    clearTimeout(timerId);
                    timerId = null;
                }
            }

            function abortInFlightRequests() {
                controllers.forEach(ctrl => {
                    try { ctrl.abort(); } catch (_) {}
                });
                controllers.clear();
            }

            function sendRequest() {
                if (settled) return;
                const controller = new AbortController();
                controllers.add(controller);

                fetch(buildUrl(), { signal: controller.signal })
                    .then(res => {
                        if (!res.ok) throw new Error(`HTTP ${res.status}`);
                        return res.json();
                    })
                    .then(data => {
                        controllers.delete(controller);
                        if (settled) return;
                        settled = true;
                        clearPendingTimer();
                        abortInFlightRequests();
                        if (onSuccess) onSuccess(data);
                    })
                    .catch(err => {
                        controllers.delete(controller);
                        if (err && err.name === 'AbortError') return;
                        lastError = err;
                    });
            }

            function scheduleNext(stepIndex) {
                if (settled) return;

                if (stepIndex >= waitSteps.length) {
                    timerId = setTimeout(() => {
                        if (!settled) {
                            settled = true;
                            abortInFlightRequests();
                            if (onError) onError(lastError || new Error("多次嘗試後仍無法取得資料"));
                        }
                    }, 5000);
                    return;
                }

                const waitMs = waitSteps[stepIndex];
                timerId = setTimeout(() => {
                    if (settled) return;
                    sendRequest();
                    scheduleNext(stepIndex + 1);
                }, waitMs);
            }

            sendRequest();
            scheduleNext(0);
        }

        function loadFloorPlan(wardKey) {
            const imgEl = document.getElementById('floorPlanImg');
            const placeholder = document.getElementById('placeholderText');
            const cleanKey = String(wardKey || '').trim();
            if (!imgEl || !cleanKey) return;

            isFloorPlanLoaded = false;

            if (floorPlanCache[cleanKey]) {
                imgEl.src = floorPlanCache[cleanKey];
                imgEl.classList.remove('hidden');
                isFloorPlanLoaded = true;
                if (placeholder) placeholder.classList.add('hidden');
                return;
            }

            const candidateUrls = [
                `${GITHUB_IMAGES_BASE_URL}${encodeURIComponent(cleanKey)}.jpg`,
                `${GITHUB_IMAGES_BASE_URL}${encodeURIComponent(cleanKey)}.jpeg`,
                `${GITHUB_IMAGES_BASE_URL}${encodeURIComponent(cleanKey)}.png`,
                `${GITHUB_IMAGES_BASE_URL}${encodeURIComponent(cleanKey)}.webp`
            ];

            function tryNextImageUrl(idx) {
                if (idx >= candidateUrls.length) {
                    imgEl.src = '';
                    imgEl.classList.add('hidden');
                    isFloorPlanLoaded = false;
                    return;
                }

                const url = candidateUrls[idx];
                const probe = new Image();
                probe.onload = () => {
                    floorPlanCache[cleanKey] = url;
                    imgEl.src = url;
                    imgEl.classList.remove('hidden');
                    isFloorPlanLoaded = true;
                    if (placeholder) placeholder.classList.add('hidden');
                };
                probe.onerror = () => tryNextImageUrl(idx + 1);
                probe.src = url;
            }

            tryNextImageUrl(0);
        }

                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'updateAsset', asset: asset })
            })
            .then(res => res.json())
            .then(result => {
                if (result && result.status === 'error') {
                    throw new Error(result.message || '更新失敗');
                }
                alert("Asset 更新成功！");
                syncLocalAssetAfterUpdate(asset);
            })
            .catch(err => alert("更新失敗: " + err));
        }

        function calculateMarkerPositions(assets) {
            if (!assets || !Array.isArray(assets)) return [];
            const GRID_X = 60, GRID_Y = 45;
            const baseList = assets.map(asset => {
                const snappedX = Math.round(asset.x * (GRID_X / 100)) / (GRID_X / 100);
                const snappedY = Math.round(asset.y * (GRID_Y / 100)) / (GRID_Y / 100);
                return { ...asset, baseX: snappedX, baseY: snappedY };
            });

            const coordBuckets = {};
            baseList.forEach((item, idx) => {
                const key = `${item.baseX.toFixed(2)}_${item.baseY.toFixed(2)}`;
                if (!coordBuckets[key]) coordBuckets[key] = [];
                coordBuckets[key].push(idx);
            });

            Object.values(coordBuckets).forEach(indices => {
                if (indices.length <= 1) return;
                const radius = 1.45;
                indices.forEach((assetIdx, order) => {
                    const angle = (2 * Math.PI * order) / indices.length - Math.PI / 4;
                    const nx = Math.max(1, Math.min(99, baseList[assetIdx].baseX + Math.cos(angle) * radius));
                    const ny = Math.max(1, Math.min(99, baseList[assetIdx].baseY + Math.sin(angle) * radius));
                    baseList[assetIdx].baseX = parseFloat(nx.toFixed(2));
                    baseList[assetIdx].baseY = parseFloat(ny.toFixed(2));
                });
            });

            return baseList;
        }

        function renderAssetMarkers(assets, highlightEam = null) {
            updateMarkersLayerSize();
            const markersLayer = document.getElementById('markersLayer');
            const floorPlanImg = document.getElementById('floorPlanImg');
            if (!markersLayer) return;
            markersLayer.innerHTML = '';
            if (!floorPlanImg || floorPlanImg.classList.contains('hidden')) return;

            const processedAssets = calculateMarkerPositions(assets);

            const posMap = {};
            const hasPairRelationSet = new Set();
            processedAssets.forEach(a => {
                const key = String(a.eam || '').trim().toLowerCase();
                if (key && a.x !== undefined && a.y !== undefined) {
                    posMap[key] = {
                        eam: String(a.eam).trim(),
                        x: a.baseX !== undefined ? a.baseX : a.x,
                        y: a.baseY !== undefined ? a.baseY : a.y
                    };
                }
            });

            const svgNS = "http://www.w3.org/2000/svg";
            const svg = document.createElementNS(svgNS, "svg");
            svg.setAttribute("viewBox", "0 0 100 100");
            svg.setAttribute("preserveAspectRatio", "none");
            svg.setAttribute("class", "absolute inset-0 w-full h-full pointer-events-none z-[5]");

            processedAssets.forEach(asset => {
                const fromKey = String(asset.eam || '').trim().toLowerCase();
                const fromPos = posMap[fromKey];
                if (!fromPos) return;

                const depEams = parsePairedEamList(asset.pair);
                depEams.forEach(depRaw => {
                    const toKey = depRaw.toLowerCase();
                    if (toKey === fromKey) return;
                    const toPos = posMap[toKey];
                    if (!toPos) return;

                    hasPairRelationSet.add(fromKey);
                    hasPairRelationSet.add(toKey);

                    const bgLine = document.createElementNS(svgNS, "line");
                    bgLine.setAttribute("x1", fromPos.x);
                    bgLine.setAttribute("y1", fromPos.y);
                    bgLine.setAttribute("x2", toPos.x);
                    bgLine.setAttribute("y2", toPos.y);
                    bgLine.setAttribute("stroke", "rgba(255, 255, 255, 0.85)");
                    bgLine.setAttribute("stroke-width", "4");
                    bgLine.setAttribute("vector-effect", "non-scaling-stroke");
                    svg.appendChild(bgLine);

                    const line = document.createElementNS(svgNS, "line");
                    line.setAttribute("x1", fromPos.x);
                    line.setAttribute("y1", fromPos.y);
                    line.setAttribute("x2", toPos.x);
                    line.setAttribute("y2", toPos.y);
                    line.setAttribute("stroke", "#4f46e5");
                    line.setAttribute("stroke-width", "2.2");
                    line.setAttribute("opacity", "0.85");
                    line.setAttribute("vector-effect", "non-scaling-stroke");
                    line.setAttribute("data-from-eam", fromPos.eam);
                    line.setAttribute("data-to-eam", toPos.eam);
                    line.classList.add("pair-connection-line");
                    svg.appendChild(line);
                });
            });

            markersLayer.appendChild(svg);

            processedAssets.forEach(asset => {
                if (asset.x === undefined || asset.y === undefined) return;
                const typeConfig = getAssetTypeConfig(asset.description);
                const marker = document.createElement('div');
                marker.className = 'asset-pin-marker absolute cursor-pointer transition-all pointer-events-auto z-10';

                const posX = asset.baseX !== undefined ? asset.baseX : asset.x;
                const posY = asset.baseY !== undefined ? asset.baseY : asset.y;
                marker.style.left = `${posX}%`;
                marker.style.top = `${posY}%`;

                marker.style.transformOrigin = 'center center';
                marker.style.transform = `translate(-50%, -50%) scale(var(--map-scale, 1))`;

                const eamLower = String(asset.eam || '').trim().toLowerCase();
                const isPaired = hasPairRelationSet.has(eamLower) || parsePairedEamList(asset.pair).length > 0 || getPairOwnerAssets(asset).length > 0;
                const isHighlighted = highlightEam && String(asset.eam).trim() === String(highlightEam).trim();

                const isUnscannedHighlight = isStocktakeUnscannedAsset(asset);
                const stRingClass = isUnscannedHighlight ? 'stocktake-unscanned-pin' : '';
                const stBadgeHtml = isUnscannedHighlight
                    ? `<span title="Unscanned Asset（待尋找 Highlight）" class="absolute -top-1.5 -right-1.5 w-4 h-4 rounded-full bg-rose-600 text-white flex items-center justify-center border border-white shadow-xs text-[8px] font-black">!</span>`
                    : '';

                if (isNonAssetItem(asset)) {
                    marker.innerHTML = `
                        <div title="${getItemDisplayTitle(asset)}" class="relative flex items-center justify-center w-7 h-7 rounded-lg bg-teal-500 border-2 border-teal-700 text-white shadow-md transition-transform hover:scale-110 ${stRingClass} ${
                            isHighlighted ? 'ring-4 ring-amber-400 animate-bounce scale-125 z-30' : ''
                        }">
                            <i class="fa-solid fa-tag text-xs text-white"></i>

                    const linkBadgeHtml = isPaired

        function locateAndHighlightAsset(asset) {
            if (!asset) return;

            cancelRelocate();
            pendingNewAssetEam = null;

            const blockSelect = document.getElementById('blockSelect');
            const floorSelect = document.getElementById('floorSelect');
            const wardSelect = document.getElementById('wardSelect');

            let targetBlock = String(asset.block || '').trim();
            let targetFloor = String(asset.floor || '').trim();
            let targetWard = String(asset.ward || '').trim();

            const matchedHierarchy = floorHierarchyData.find(
                h => String(h.wardKey || '').trim().toLowerCase() === targetWard.toLowerCase()
            );

            if (matchedHierarchy) {
                targetBlock = String(matchedHierarchy.block || '').trim();
                targetFloor = String(matchedHierarchy.floor || '').trim();
                targetWard = String(matchedHierarchy.wardKey || '').trim();
            } else if (['pending', 'condemn', 'surplus', 'suplus', 'transfer'].includes(targetWard.toLowerCase())) {
                targetBlock = 'System';
                targetFloor = 'System';
                const lowerW = targetWard.toLowerCase();
                targetWard = lowerW === 'suplus' ? 'Surplus' : (lowerW.charAt(0).toUpperCase() + lowerW.slice(1));
            }

            if (blockSelect) {
                const blockOpt = Array.from(blockSelect.options).find(
                    o => o.value.trim().toLowerCase() === targetBlock.toLowerCase()
                );
                blockSelect.value = blockOpt ? blockOpt.value : targetBlock;
            }
            onBlockChange();

            if (floorSelect) {
                const floorOpt = Array.from(floorSelect.options).find(
                    o => o.value.trim().toLowerCase() === targetFloor.toLowerCase()
                );
                floorSelect.value = floorOpt ? floorOpt.value : targetFloor;
            }
            onFloorChange();

            if (wardSelect) {
                const wardOpt = Array.from(wardSelect.options).find(
                    o => o.value.trim().toLowerCase() === targetWard.toLowerCase()
                );
                wardSelect.value = wardOpt ? wardOpt.value : targetWard;
            }

            if (targetWard) {
                loadFloorPlan(targetWard);
            }

            let highlightedDone = false;
            let waitTicks = 0;
            const checkInterval = setInterval(() => {
                waitTicks += 1;
                if (isFloorPlanLoaded || !targetWard || waitTicks >= 10) {
                    clearInterval(checkInterval);
                    if (!highlightedDone) {
                        highlightedDone = true;
                        executeHighlightAndScroll();
                    }
                }
            }, 50);

            function executeHighlightAndScroll() {
                const wardAssets = allAssets.filter(
                    a => a.ward && String(a.ward).trim().toLowerCase() === targetWard.toLowerCase()
                );
                const orderedWardAssets = [...wardAssets];
                const index = orderedWardAssets.findIndex(
                    a => String(a.eam || '').trim().toLowerCase() === String(asset.eam || '').trim().toLowerCase()
                );
                if (index > -1) {
                    const [matched] = orderedWardAssets.splice(index, 1);
                    orderedWardAssets.unshift(matched);
                } else {
                    orderedWardAssets.unshift(asset);
                }
                currentFilteredAssets = orderedWardAssets;

                renderSidebarWithPriority(currentFilteredAssets);
                renderAssetMarkers(currentFilteredAssets, asset.eam);
                highlightPairGroupOnMap(asset.eam);
                setTimeout(clearPairGroupHighlightOnMap, 3000);

                const mapContainer = document.getElementById('mapContainer');
                if (mapContainer) {
                    mapContainer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }

                const assetCards = document.querySelectorAll('[data-eam]');
                assetCards.forEach(card => {
                    if (String(card.getAttribute('data-eam') || '').toLowerCase() === String(asset.eam || '').trim().toLowerCase()) {
                        card.classList.add('ring-4', 'ring-amber-400', 'bg-amber-50');
                        setTimeout(() => card.classList.remove('ring-4', 'ring-amber-400', 'bg-amber-50'), 3000);
                    }
                });

                const hasCoordinates = (asset.x !== undefined && asset.x !== null && asset.x !== '') &&
                                       (asset.y !== undefined && asset.y !== null && asset.y !== '');

                if (!hasCoordinates && !isLockedStatusWard(asset.ward) && !isLockedStatusWard(targetWard)) {
                    isMovingAsset = asset;
                    isRelocatingMode = true;
                    const banner = document.getElementById('selectionBanner');
                    const bannerText = document.getElementById('bannerText');
                    if (banner && bannerText) {
                        banner.classList.remove('hidden');
                        bannerText.innerText = `⚠️ Asset [${asset.eam}] 尚未設定座標，請直接在地圖上點擊其擺放位置...`;
                    }
                }
            }
        }

        let isMapClickProcessing = false;
        function handleMapClick(event) {
            if (isMapClickProcessing) return;
            isMapClickProcessing = true;
            setTimeout(() => { isMapClickProcessing = false; }, 300);

            if (event) event.stopPropagation();

            if (isSelectingPairOnMap && pendingPairTargetAsset) {
                alert(`目前處於「主件挑選配件」模式，請直接點選地圖上的配件圖釘，或按右上方「取消」結束。`);
                return;
            }

            const mapWrapper = document.getElementById('mapWrapper');
            if (!mapWrapper) return;
            const rect = mapWrapper.getBoundingClientRect();

            if (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom) return;

            const x = ((event.clientX - rect.left) / rect.width) * 100;
            const y = ((event.clientY - rect.top) / rect.height) * 100;

            const currentBlock = document.getElementById('blockSelect').value;
            const currentFloor = document.getElementById('floorSelect').value;
            const currentWard = document.getElementById('wardSelect').value;

            if (!currentWard) {
                alert("請先在上方選單選擇「單位 (Ward)」！");
                return;
            }

            if (isLockedStatusWard(currentWard)) {
                alert(`⚠️ [${currentWard}] 狀態不可直接在平面圖上更改位置。`);
                cancelRelocate();
                pendingNewAssetEam = null;
                return;
            }

        // ========== 商場指南式搖桿控制邏輯 ==========
        let joyUserScale = 1.0;
        let joyOffsetX = 0;
        let joyOffsetY = 0;
        let isDraggingJoystick = false;
        let dragStartPointerX = 0;
        let dragStartPointerY = 0;
        let dragStartOffsetX = 0;
        let dragStartOffsetY = 0;
        let hasStartedWardNavigationFromTGF = false;

        function computeResponsiveJoystickScale() {
            const mapWrapper = document.getElementById('mapWrapper');
            const wrapperWidth = mapWrapper ? mapWrapper.clientWidth : window.innerWidth;
            const autoFactor = Math.max(0.55, Math.min(1.0, wrapperWidth / 640));
            return parseFloat((autoFactor * joyUserScale).toFixed(2));
        }

        function applyJoystickTransform() {
            const pad = document.getElementById('kioskJoystick');
            if (!pad) return;
            const finalScale = computeResponsiveJoystickScale();
            pad.style.transform = `translate3d(${joyOffsetX}px, ${joyOffsetY}px, 0) scale(${finalScale})`;
        }

        function adjustJoystickScale(delta) {
            joyUserScale = Math.max(0.5, Math.min(1.45, parseFloat((joyUserScale + delta).toFixed(2))));
            applyJoystickTransform();
        }

        function resetJoystickTransform() {
            joyUserScale = 1.0;
            joyOffsetX = 0;
            joyOffsetY = 0;
            applyJoystickTransform();
        }

        function initJoystickInteractions() {
            const pad = document.getElementById('kioskJoystick');
            const handle = document.getElementById('joystickDragHandle');
            if (!pad || !handle) return;

            handle.addEventListener('pointerdown', (e) => {
                if (e.button !== undefined && e.button !== 0 && e.pointerType === 'mouse') return;
                e.stopPropagation();
                isDraggingJoystick = true;
                dragStartPointerX = e.clientX;
                dragStartPointerY = e.clientY;
                dragStartOffsetX = joyOffsetX;
                dragStartOffsetY = joyOffsetY;
                try { handle.setPointerCapture(e.pointerId); } catch (_) {}
            });

            handle.addEventListener('pointermove', (e) => {
                if (!isDraggingJoystick) return;
                e.stopPropagation();
                const dx = e.clientX - dragStartPointerX;
                const dy = e.clientY - dragStartPointerY;

                const mapWrapper = document.getElementById('mapWrapper');
                const maxX = mapWrapper ? Math.max(20, mapWrapper.clientWidth - 90) : 400;
                const maxY = mapWrapper ? Math.max(20, mapWrapper.clientHeight - 90) : 400;

                joyOffsetX = Math.max(-60, Math.min(maxX, dragStartOffsetX + dx));
                joyOffsetY = Math.max(-maxY, Math.min(60, dragStartOffsetY + dy));
                applyJoystickTransform();
            });

            const stopDrag = (e) => {
                if (!isDraggingJoystick) return;
                isDraggingJoystick = false;
                try { handle.releasePointerCapture(e.pointerId); } catch (_) {}
            };

            handle.addEventListener('pointerup', stopDrag);
            handle.addEventListener('pointercancel', stopDrag);
            applyJoystickTransform();
        }

        function normalizeJoyKey(val) {
            return String(val || '').trim().toLowerCase().replace(/[^a-z0-9]/g, '');
        }

        function parseFloorOrderRank(floorStr) {
            const s = String(floorStr || '').trim().toUpperCase();
            if (!s) return 999;
            if (s.includes('B2') || s === '-2' || s === '2/F B') return -20;
            if (s.includes('B1') || s === '-1' || s === '1/F B') return -10;
            if (s === 'G/F' || s === 'GF' || s === 'G') return 0;
            const m = s.match(/(\d+)\s*\/\s*F/) || s.match(/^(\d+)F?$/);
            if (m) return parseInt(m[1], 10);
            if (s.includes('SYSTEM')) return 500;
            return 200;
        }

        function getOrderedBlockList() {
            const blockSelect = document.getElementById('blockSelect');
            const rawBlocks = blockSelect
                ? Array.from(blockSelect.options).map(o => o.value).filter(v => v && v.trim() !== '')
                : [...new Set((floorHierarchyData || []).map(h => h.block).filter(Boolean))];

            const priorityOrder = [
                { keys: ['t', 'tblock'], rank: 1 },
                { keys: ['m', 'mainblock', 'mblock'], rank: 2 },
                { keys: ['annex', 'annexbuilding'], rank: 3 },
                { keys: ['system', 'sys'], rank: 4 }
            ];

            function getBlockRank(b) {
                const nb = normalizeJoyKey(b);
                for (const item of priorityOrder) {
                    if (item.keys.some(k => nb === k || nb.includes(k))) {
                        return item.rank;
                    }
                }
                return 99;
            }

            return [...new Set(rawBlocks)].sort((a, b) => {
                const ra = getBlockRank(a);
                const rb = getBlockRank(b);
                if (ra !== rb) return ra - rb;
                return String(a).localeCompare(String(b));
            });
        }

        function getOrderedFloorsForBlock(blockVal) {
            const targetBlock = String(blockVal || '').trim();
            if (!targetBlock) return [];

            const items = (floorHierarchyData || []).filter(
                h => String(h.block || '').trim().toLowerCase() === targetBlock.toLowerCase() && h.floor
            );
            const floors = [...new Set(items.map(h => String(h.floor).trim()))];

            const nb = normalizeJoyKey(targetBlock);
            const explicitSeq = nb.startsWith('t')
                ? ['G/F', '1/F', '2/F', '3/F', '4/F', '5/F']
                : (nb.startsWith('m') || nb.includes('main'))
                    ? ['G/F', '1/F', '2/F', '3/F', '4/F']
                    : null;

            return floors.sort((a, b) => {
                const ua = a.toUpperCase();
                const ub = b.toUpperCase();
                if (explicitSeq) {
                    const ia = explicitSeq.indexOf(ua);
                    const ib = explicitSeq.indexOf(ub);
                    if (ia !== -1 && ib !== -1) return ia - ib;
                    if (ia !== -1) return -1;
                    if (ib !== -1) return 1;
                }
                const ra = parseFloorOrderRank(ua);
                const rb = parseFloorOrderRank(ub);
                if (ra !== rb) return ra - rb;
                return ua.localeCompare(ub, undefined, { numeric: true });
            });
        }

        function getOrderedWardsForBlockFloor(blockVal, floorVal) {
            const bKey = String(blockVal || '').trim().toLowerCase();
            const fKey = String(floorVal || '').trim().toLowerCase();
            return (floorHierarchyData || [])
                .filter(h =>
                    String(h.block || '').trim().toLowerCase() === bKey &&
                    String(h.floor || '').trim().toLowerCase() === fKey &&
                    h.wardKey
                )
                .map(h => String(h.wardKey).trim());
        }

        function buildGlobalNavigationSlots() {
            const slots = [];
            const orderedBlocks = getOrderedBlockList();

            orderedBlocks.forEach(blk => {
                const floors = getOrderedFloorsForBlock(blk);
                floors.forEach(flr => {
                    const wards = getOrderedWardsForBlockFloor(blk, flr);
                    if (wards.length > 0) {
                        wards.forEach(wKey => {
                            slots.push({ block: blk, floor: flr, ward: wKey });
                        });
                    } else {
                        slots.push({ block: blk, floor: flr, ward: '' });
                    }
                });
            });

            return slots;
        }

        function getTBlockGFStartSlot(slots) {
            const list = Array.isArray(slots) && slots.length > 0 ? slots : buildGlobalNavigationSlots();
            if (list.length === 0) return null;

            const tGF = list.find(s => {
                const nb = normalizeJoyKey(s.block);
                const nf = normalizeJoyKey(s.floor);
                return nb.startsWith('t') && (nf === 'gf' || nf === 'g');
            });
            if (tGF) return tGF;

            const tAny = list.find(s => normalizeJoyKey(s.block).startsWith('t'));
            return tAny || list[0];
        }

        function applyNavigationSlot(slot) {
            if (!slot) return;
            const blockSelect = document.getElementById('blockSelect');
            const floorSelect = document.getElementById('floorSelect');
            const wardSelect = document.getElementById('wardSelect');
            if (!blockSelect || !floorSelect || !wardSelect) return;

            blockSelect.value = slot.block || '';
            onBlockChange();

            if (slot.floor) {
                const fOpt = Array.from(floorSelect.options).find(
                    o => String(o.value || '').trim().toLowerCase() === String(slot.floor).trim().toLowerCase()
                );
                floorSelect.value = fOpt ? fOpt.value : slot.floor;
                onFloorChange();
            }

            if (slot.ward) {
                const wOpt = Array.from(wardSelect.options).find(
                    o => String(o.value || '').trim().toLowerCase() === String(slot.ward).trim().toLowerCase()
                );
                wardSelect.value = wOpt ? wOpt.value : slot.ward;
                onWardChange();
            } else if (wardSelect.options.length > 1) {
                wardSelect.selectedIndex = 1;
                onWardChange();
            }

            updateJoystickUI();
        }

        function resolveMatchingBlockValue(quadKey) {
            const orderedBlocks = getOrderedBlockList();
            const q = normalizeJoyKey(quadKey);
            if (!q) return '';

            if (q === 't' || q === 'tblock') {
                return orderedBlocks.find(b => {
                    const nb = normalizeJoyKey(b);
                    return nb === 't' || nb === 'tblock' || nb.startsWith('t');
                }) || '';
            }
            if (q === 'm' || q === 'mblock' || q === 'mainblock') {
                return orderedBlocks.find(b => {
                    const nb = normalizeJoyKey(b);
                    return nb === 'm' || nb === 'mblock' || nb.includes('main') || nb.startsWith('m');
                }) || '';
            }
            if (q === 'annex' || q === 'annexbuilding') {
                return orderedBlocks.find(b => normalizeJoyKey(b).includes('annex')) || '';
            }
            if (q === 'system' || q === 'sys') {
                return orderedBlocks.find(b => normalizeJoyKey(b).includes('sys')) || '';
            }

            return orderedBlocks.find(b => normalizeJoyKey(b) === q)
                || orderedBlocks.find(b => normalizeJoyKey(b).includes(q) || q.includes(normalizeJoyKey(b)))
                || '';
        }

        function getCurrentWardNameOnly() {
            const wardSelect = document.getElementById('wardSelect');
            const wardVal = wardSelect?.value || '';
            if (!wardVal) return '';

            const matchedH = (floorHierarchyData || []).find(
                h => String(h.wardKey || '').trim().toLowerCase() === String(wardVal).trim().toLowerCase()
            );
            if (matchedH && matchedH.wardName) {
                return String(matchedH.wardName).trim();
            }

            if (wardSelect && wardSelect.selectedIndex >= 0) {
                const rawOptText = String(wardSelect.options[wardSelect.selectedIndex]?.text || '').trim();
                const cleaned = rawOptText.replace(/\s*\([^)]*\)\s*$/, '').trim();
                if (cleaned) return cleaned;
            }
            return wardVal;
        }
