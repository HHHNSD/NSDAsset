        function selectJoystickBlock(quadKey) {
            const matchedBlock = resolveMatchingBlockValue(quadKey);
            if (!matchedBlock) {
                alert(`找不到對應的棟別：${quadKey}`);
                return;
            }

            hasStartedWardNavigationFromTGF = true;
            const floors = getOrderedFloorsForBlock(matchedBlock);
            const firstFloor = floors[0] || '';
            const wards = firstFloor ? getOrderedWardsForBlockFloor(matchedBlock, firstFloor) : [];
            applyNavigationSlot({
                block: matchedBlock,
                floor: firstFloor,
                ward: wards[0] || ''
            });
        }

        function stepFloorWithBlockTransition(floorStep) {
            const slots = buildGlobalNavigationSlots();
            if (slots.length === 0) return;

            hasStartedWardNavigationFromTGF = true;
            const curBlock = String(document.getElementById('blockSelect')?.value || '').trim();
            const curFloor = String(document.getElementById('floorSelect')?.value || '').trim();

            if (!curBlock) {
                applyNavigationSlot(getTBlockGFStartSlot(slots) || slots[0]);
                return;
            }

            const orderedBlocks = getOrderedBlockList();
            const bIdx = orderedBlocks.findIndex(b => b.toLowerCase() === curBlock.toLowerCase());
            if (bIdx === -1) {
                applyNavigationSlot(getTBlockGFStartSlot(slots) || slots[0]);
                return;
            }

            const floorsInBlock = getOrderedFloorsForBlock(orderedBlocks[bIdx]);
            const fIdx = floorsInBlock.findIndex(f => f.toLowerCase() === curFloor.toLowerCase());

            if (floorStep > 0) {
                if (fIdx !== -1 && fIdx + 1 < floorsInBlock.length) {
                    const nextFloor = floorsInBlock[fIdx + 1];
                    const nextWards = getOrderedWardsForBlockFloor(orderedBlocks[bIdx], nextFloor);
                    applyNavigationSlot({ block: orderedBlocks[bIdx], floor: nextFloor, ward: nextWards[0] || '' });
                } else {
                    const nextBlockIdx = (bIdx + 1) % orderedBlocks.length;
                    const nextBlock = orderedBlocks[nextBlockIdx];
                    const nextBlockFloors = getOrderedFloorsForBlock(nextBlock);
                    const targetFloor = nextBlockFloors[0] || '';
                    const targetWards = targetFloor ? getOrderedWardsForBlockFloor(nextBlock, targetFloor) : [];
                    applyNavigationSlot({ block: nextBlock, floor: targetFloor, ward: targetWards[0] || '' });
                }
            } else {
                if (fIdx > 0) {
                    const prevFloor = floorsInBlock[fIdx - 1];
                    const prevWards = getOrderedWardsForBlockFloor(orderedBlocks[bIdx], prevFloor);
                    applyNavigationSlot({ block: orderedBlocks[bIdx], floor: prevFloor, ward: prevWards[0] || '' });
                } else {
                    const prevBlockIdx = (bIdx - 1 + orderedBlocks.length) % orderedBlocks.length;
                    const prevBlock = orderedBlocks[prevBlockIdx];
                    const prevBlockFloors = getOrderedFloorsForBlock(prevBlock);
                    const targetFloor = prevBlockFloors[prevBlockFloors.length - 1] || '';
                    const targetWards = targetFloor ? getOrderedWardsForBlockFloor(prevBlock, targetFloor) : [];
                    applyNavigationSlot({ block: prevBlock, floor: targetFloor, ward: targetWards[0] || '' });
                }
            }
        }

        function cycleJoystickFloor(direction = 1) {
            stepFloorWithBlockTransition(direction);
        }

        function cycleJoystickWard(direction = 1) {
            const slots = buildGlobalNavigationSlots();
            if (slots.length === 0) return;

            const startSlot = getTBlockGFStartSlot(slots) || slots[0];
            if (!hasStartedWardNavigationFromTGF) {
                hasStartedWardNavigationFromTGF = true;
                applyNavigationSlot(startSlot);
                return;
            }

            const curBlock = String(document.getElementById('blockSelect')?.value || '').trim().toLowerCase();
            const curFloor = String(document.getElementById('floorSelect')?.value || '').trim().toLowerCase();
            const curWard = String(document.getElementById('wardSelect')?.value || '').trim().toLowerCase();

            let currentSlotIdx = slots.findIndex(s =>
                s.block.toLowerCase() === curBlock &&
                s.floor.toLowerCase() === curFloor &&
                s.ward.toLowerCase() === curWard
            );

            if (currentSlotIdx === -1) {
                currentSlotIdx = slots.findIndex(s =>
                    s.block.toLowerCase() === curBlock &&
                    s.floor.toLowerCase() === curFloor
                );
            }

            if (currentSlotIdx === -1) {
                applyNavigationSlot(startSlot);
                return;
            }

            const nextSlotIdx = (currentSlotIdx + (direction >= 0 ? 1 : -1) + slots.length) % slots.length;
            applyNavigationSlot(slots[nextSlotIdx]);
        }

        // ========== Stocktake 盤點檢視（Viewer 唯讀檢視與套用地圖，不提供上傳檔案、刪除紀錄或加入未登記 Asset） ==========
        let stocktakeSessions = [];
        let activeStocktakeSessionId = null;
        let activeStocktakeSessionIds = [];
        let stocktakeMapOverlayEnabled = false;

        function ensureSessionBuckets(session) {
            if (!session || typeof session !== 'object') return session;
            if (!Array.isArray(session.unscanned)) session.unscanned = [];
            if (!Array.isArray(session.successful)) session.successful = [];
            if (!Array.isArray(session.unidentified)) session.unidentified = [];
            if (!Array.isArray(session.unmatched)) session.unmatched = [];
        
            if (
                session.unscanned.length === 0 &&
                session.successful.length === 0 &&
                Array.isArray(session.matched) &&
                session.matched.length > 0
            ) {
                session.matched.forEach(item => {
                    const resText = String(item?.stockTakenResult || '').trim().toLowerCase();
                    if (resText.includes('已掃描') || resText.includes('successful') || resText.includes('success')) {
                        session.successful.push(item);
                    } else {
                        session.unscanned.push(item);
                    }
                });
            }
            return session;
        }

        function syncSelectedStocktakeSessions() {
            const validIds = new Set(stocktakeSessions.map(s => String(s.id)));
            activeStocktakeSessionIds = (activeStocktakeSessionIds || [])
                .map(id => String(id))
                .filter(id => validIds.has(id));

            if (activeStocktakeSessionIds.length === 0) {
                stocktakeMapOverlayEnabled = false;
                if (!activeStocktakeSessionId && stocktakeSessions.length > 0) {
                    activeStocktakeSessionId = stocktakeSessions[0].id;
                }
            } else {
                stocktakeMapOverlayEnabled = true;
                if (!activeStocktakeSessionId || !activeStocktakeSessionIds.includes(String(activeStocktakeSessionId))) {
                    activeStocktakeSessionId = activeStocktakeSessionIds[0];
                }
            }
        }

        function getSelectedStocktakeSessions() {
            syncSelectedStocktakeSessions();
            if (!stocktakeMapOverlayEnabled || activeStocktakeSessionIds.length === 0) return [];
            const selectedSet = new Set(activeStocktakeSessionIds.map(String));
            return stocktakeSessions
                .filter(s => selectedSet.has(String(s.id)))
                .map(ensureSessionBuckets);
        }

        function getTotalSelectedUnscannedCount() {
            const sessions = getSelectedStocktakeSessions();
            const seen = new Set();
            sessions.forEach(s => {
                (s.unscanned || []).forEach(u => {
                    const key = normalizeLookupKey(u.matchedEam || u.eam) || `sn:${normalizeLookupKey(u.matchedSerial || u.serial)}`;
                    if (key) seen.add(key);
                });
            });
            return seen.size;
        }

        async function fetchStocktakeSessionsFromSheet() {
            try {
                const res = await fetch(`${GAS_API_URL}?action=getStocktakeSessions&_t=${Date.now()}`);
                const data = await res.json();
                if (Array.isArray(data)) {
                    stocktakeSessions = data.map(ensureSessionBuckets);
                    syncSelectedStocktakeSessions();
                    updateStocktakeBadges();
                    renderSidebarWithPriority();
                    const wardVal = document.getElementById('wardSelect')?.value || '';
                    if (wardVal && stocktakeMapOverlayEnabled) {
                        renderAssetMarkers(currentFilteredAssets);
                    }
                }
            } catch (err) {
                console.warn('讀取 Google Sheet Stocktake 紀錄失敗:', err);
            }
        }

        function getActiveStocktakeSession() {
            if (!stocktakeSessions || stocktakeSessions.length === 0) return null;
            const found = stocktakeSessions.find(s => String(s.id) === String(activeStocktakeSessionId)) || stocktakeSessions[0];
            return ensureSessionBuckets(found);
        }

            syncSelectedStocktakeSessions();
            const histBadge = document.getElementById('stocktakeHistoryBadge');
            const overlayPill = document.getElementById('stocktakeOverlayStatusPill');

            if (histBadge) histBadge.innerText = String(stocktakeSessions.length);
            if (overlayPill) {
                if (stocktakeMapOverlayEnabled && activeStocktakeSessionIds.length > 0) {
                    overlayPill.classList.remove('hidden');

            const panelHeading = document.getElementById('rightPanelListHeading');
            if (panelHeading) {

                    panelHeading.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-rose-600"></i> 未掃描Asset 清單與篩選`;
                } else {
                    panelHeading.innerHTML = `<i class="fa-solid fa-boxes-stacked text-blue-600"></i> 獨立欄位搜尋與清單`;
                }
            }
            if (typeof populateSearchDatalists === 'function') {
                populateSearchDatalists();
            }
        }

        function normalizeLookupKey(val) {
            return String(val || '').normalize('NFKC').replace(/\u00a0/g, ' ').trim().replace(/^0+/, '').toLowerCase();
        }

        function isStocktakeUnscannedAsset(asset) {
            if (!stocktakeMapOverlayEnabled || !asset) return false;
            const selectedSessions = getSelectedStocktakeSessions();
            if (selectedSessions.length === 0) return false;

            const assetEam = normalizeLookupKey(asset.eam);
            const assetSn = normalizeLookupKey(asset.serial);

            return selectedSessions.some(session =>
                (session.unscanned || []).some(u => {
                    const uEam = normalizeLookupKey(u.matchedEam || u.eam);
                    const uSn = normalizeLookupKey(u.matchedSerial || u.serial);
                    return (assetEam && uEam && assetEam === uEam) || (assetSn && uSn && assetSn === uSn);
                })
            );
        }

        function setStocktakeSessionChecked(sessionId, checked, autoLocateFirst = false) {
            const target = stocktakeSessions.find(s => String(s.id) === String(sessionId));
            if (!target) return;

            const idStr = String(target.id);
            const currentSet = new Set(activeStocktakeSessionIds.map(String));

            if (checked) {
                currentSet.add(idStr);
                activeStocktakeSessionId = target.id;
            } else {
                currentSet.delete(idStr);
                if (String(activeStocktakeSessionId) === idStr) {
                    const remaining = Array.from(currentSet);
                    activeStocktakeSessionId = remaining.length > 0 ? remaining[0] : activeStocktakeSessionId;
                }
            }

            activeStocktakeSessionIds = Array.from(currentSet);
            stocktakeMapOverlayEnabled = activeStocktakeSessionIds.length > 0;
            updateStocktakeBadges();

            const banner = document.getElementById('selectionBanner');
            const bannerText = document.getElementById('bannerText');
            if (stocktakeMapOverlayEnabled) {
                const selectedSessions = getSelectedStocktakeSessions();
                const unscannedCount = getTotalSelectedUnscannedCount();
                if (banner && bannerText) {
                    banner.classList.remove('hidden');
                    bannerText.innerText = `📋 已勾選 ${selectedSessions.length} 份 Stocktake 套用地圖：共標記 ${unscannedCount} 項未掃描Asset`;
                }
            } else if (!isRelocatingMode && !pendingNewAssetEam && !isSelectingPairOnMap && banner) {
                banner.classList.add('hidden');
            }

            renderSidebarWithPriority();
            const wardVal = document.getElementById('wardSelect')?.value || '';
            if (wardVal) {
                renderAssetMarkers(currentFilteredAssets);
            }

            if (checked && autoLocateFirst) {
                const first = (target.unscanned || []).find(m => m.matchedEam || m.eam);
                if (first) {
                    const found = findAssetByEam(first.matchedEam || first.eam);
                    if (found) locateAndHighlightAsset(found);
                }
            }
        }

        function hydrateMatchedItem(m) {
            const liveAsset = findAssetByEam(m.matchedEam || m.inputEam);
            return {
                ...m,
                stockTakenResult: m.stockTakenResult || '未掃描Asset',
                matchedEam: m.matchedEam || m.inputEam || (liveAsset && liveAsset.eam) || '',
                matchedSerial: normalizeSerialValue(m.matchedSerial || (liveAsset && liveAsset.serial) || m.inputSerial),
                matchedDescription: m.matchedDescription || (liveAsset && liveAsset.description) || m.inputDescription || '',
                matchedBlock: m.matchedBlock || (liveAsset && liveAsset.block) || '',
                matchedFloor: m.matchedFloor || (liveAsset && liveAsset.floor) || '',
                matchedWard: m.matchedWard || (liveAsset && liveAsset.ward) || '',
                matchedX: m.matchedX !== undefined ? m.matchedX : (liveAsset ? liveAsset.x : ''),
                matchedY: m.matchedY !== undefined ? m.matchedY : (liveAsset ? liveAsset.y : '')
            };
        }

                                        <div class="bg-white border border-amber-200/80 rounded-lg p-2">
                                            <div class="flex items-center justify-between gap-1">
                                                <span class="font-bold text-amber-800">${u.eam || '(無 EAM)'}</span>
                                                <span class="text-[10px] text-slate-600 font-semibold">S/N: ${normalizeSerialValue(u.serial)}</span>
                                            </div>
                                            <p class="text-[11px] text-slate-700 truncate">${u.description || '未命名項目'}</p>
                                            <p class="text-[10px] text-slate-500">位置: System / System / Pending</p>
                                        </div>
                                    `).join('')
                                }
                            </div>
                        </div>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);

            document.getElementById('btnCloseStocktakeResult').onclick = () => modal.remove();

            document.getElementById('cbOverlayFromResult').onchange = (e) => {
                setStocktakeSessionChecked(session.id, e.target.checked, e.target.checked);
            };

            document.getElementById('btnOpenUnidentifiedFromResult').onclick = () => {
                activeStocktakeSessionId = session.id;
                modal.remove();
                openStocktakeUnidentifiedModal(session.id);
            };

            modal.querySelectorAll('.st-locate-btn').forEach(btn => {
                btn.onclick = () => {
                    const code = btn.getAttribute('data-locate-eam');
                    const found = findAssetByEam(code);
                    if (found) {
                        setStocktakeSessionChecked(session.id, true, false);
                        modal.remove();
                        locateAndHighlightAsset(found);
                    }
                };
            });
        }

        function openStocktakeUnidentifiedModal(sessionId = null) {
            const rawSession = sessionId
                ? stocktakeSessions.find(s => String(s.id) === String(sessionId))
                : getActiveStocktakeSession();
            const session = ensureSessionBuckets(rawSession);

            const existing = document.getElementById('stocktakeUnidentifiedModal');
            if (existing) existing.remove();

            const items = session ? (session.unidentified || []) : [];

            const modal = document.createElement('div');
            modal.id = 'stocktakeUnidentifiedModal';
            modal.className = 'fixed inset-0 bg-slate-900/45 backdrop-blur-xs flex items-center justify-center z-50 p-4';
            modal.innerHTML = `
                <div class="bg-white border border-slate-200 rounded-2xl p-6 w-full max-w-2xl shadow-2xl text-slate-800 max-h-[88vh] flex flex-col">
                    <div class="flex items-center justify-between pb-3 border-b border-slate-100">
                        <div>
                            <h3 class="text-sm font-black text-sky-700 flex items-center gap-2">
                                <i class="fa-solid fa-circle-question"></i> 非所屬Asset (${items.length})
                            </h3>
                            <p class="text-[11px] text-slate-500 mt-0.5">
                                ${session
                                    ? `檔案：<strong>${session.fileName}</strong>（${formatShortDateTime(session.importedAt)}）`
                                    : '目前尚無 Stocktake 記錄'}
                            </p>
                        </div>
                        <button type="button" id="btnCloseStocktakeUnidentified" class="text-slate-400 hover:text-slate-700 font-bold text-sm cursor-pointer">✕</button>
                    </div>

                    <div class="overflow-y-auto flex-1 my-3 pr-1 text-xs">
                        ${items.length === 0
                            ? '<p class="text-center text-slate-400 py-8 bg-slate-50 rounded-xl border border-dashed border-slate-200">目前沒有非所屬Asset 項目。</p>'
                            : `<div class="border border-sky-200 rounded-xl overflow-hidden bg-white">
                                <div class="grid grid-cols-2 bg-sky-50/80 border-b border-sky-200 px-4 py-2 font-bold text-sky-900">
                                    <span>EAM</span>
                                    <span>Asset Owner</span>
                                </div>
                                <div class="divide-y divide-slate-100">
                                    ${items.map(it => `
                                        <div class="grid grid-cols-2 px-4 py-2.5 items-center hover:bg-sky-50/30">
                                            <span class="font-bold text-slate-800">${it.eam || '(無 EAM)'}</span>
                                            <span class="text-slate-700 font-semibold">${it.owner || it.ward || '未標示'}</span>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>`
                        }
                    </div>

                    <div class="flex justify-end pt-2 border-t border-slate-100">
                        <button type="button" id="btnDoneStocktakeUnidentified" class="bg-sky-600 hover:bg-sky-500 text-white text-xs font-bold px-4 py-2 rounded-xl cursor-pointer">關閉</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);

            document.getElementById('btnCloseStocktakeUnidentified').onclick = () => modal.remove();
            document.getElementById('btnDoneStocktakeUnidentified').onclick = () => modal.remove();
        }

        function openStocktakeHistoryModal() {
            const existing = document.getElementById('stocktakeHistoryModal');
            if (existing) existing.remove();

            syncSelectedStocktakeSessions();
            const checkedIdSet = new Set(activeStocktakeSessionIds.map(String));

            const modal = document.createElement('div');
            modal.id = 'stocktakeHistoryModal';
            modal.className = 'fixed inset-0 bg-slate-900/45 backdrop-blur-xs flex items-center justify-center z-50 p-4';
            modal.innerHTML = `
                <div class="bg-white border border-slate-200 rounded-2xl p-6 w-full max-w-2xl shadow-2xl text-slate-800 max-h-[88vh] flex flex-col">
                    <div class="flex items-center justify-between gap-2 pb-3 border-b border-slate-100">
                        <h3 class="text-sm font-black text-indigo-700 flex items-center gap-2">
                            <i class="fa-solid fa-clipboard-list"></i> Stocktake 記錄
                        </h3>
                        <div class="flex items-center gap-2">
                            <button type="button" id="btnCloseStocktakeHistory" class="text-slate-400 hover:text-slate-700 font-bold text-sm cursor-pointer px-1">✕</button>
                        </div>
                    </div>

                    <div class="overflow-y-auto flex-1 my-3 space-y-2.5 pr-1 text-xs">
                        ${stocktakeSessions.length === 0
                            ? '<p class="text-center text-slate-400 py-10">尚無任何 Stocktake 記錄。</p>'
                            : stocktakeSessions.map(rawS => {
                                const s = ensureSessionBuckets(rawS);
                                const isChecked = checkedIdSet.has(String(s.id));
                                const pendLeft = (s.unmatched || []).filter(u => !u.restoredToSystem).length;
                                const unidCnt = (s.unidentified || []).length;
                                const unscannedCnt = (s.unscanned || []).length;
                                const successfulCnt = (s.successful || []).length;
                                const shortTime = formatShortDateTime(s.importedAt);
                                return `
                                    <div class="border ${isChecked ? 'border-emerald-400 bg-emerald-50/30' : 'border-slate-200 bg-white'} rounded-xl p-3.5 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                                        <div class="min-w-0">
                                            <div class="flex items-center gap-2 flex-wrap">
                                                <span class="font-bold text-slate-800">${s.fileName}</span>
                                                ${isChecked ? '<span class="text-[10px] bg-emerald-600 text-white px-2 py-0.5 rounded-full font-bold">套用地圖中</span>' : ''}
                                            </div>
                                            <p class="text-[11px] text-slate-500 mt-0.5">
                                                <i class="fa-regular fa-clock mr-1"></i>匯入時間：${shortTime}
                                            </p>
                                            <p class="text-[11px] text-slate-600 mt-0.5">
                                                總數 ${s.totalInput}｜未掃描Asset <strong class="text-rose-700">${unscannedCnt}</strong>｜已掃描Asset <strong class="text-emerald-700">${successfulCnt}</strong>｜未登記Asset <strong class="text-amber-700">${pendLeft}</strong>｜非所屬Asset <strong class="text-sky-700">${unidCnt}</strong>
                                            </p>
                                        </div>
                                        <div class="flex items-center gap-2 shrink-0 flex-wrap">
                                            <label class="inline-flex items-center gap-1.5 ${isChecked ? 'bg-emerald-700 text-white border-emerald-700' : 'bg-emerald-50 hover:bg-emerald-100 text-emerald-800 border-emerald-200'} border text-[11px] font-bold px-2.5 py-1.5 rounded-lg cursor-pointer select-none">
                                                <input type="checkbox" data-apply-id="${s.id}" class="st-hist-apply w-3.5 h-3.5 rounded text-emerald-600 cursor-pointer" ${isChecked ? 'checked' : ''}>
                                                <span>套用地圖</span>
                                            </label>
                                            <button type="button" data-view-id="${s.id}" class="st-hist-view bg-indigo-600 hover:bg-indigo-500 text-white text-[11px] font-bold px-2.5 py-1.5 rounded-lg cursor-pointer">查看記錄</button>
                                        </div>
                                    </div>
                                `;
                            }).join('')
                        }
                    </div>
                </div>
            `;
            document.body.appendChild(modal);

            document.getElementById('btnCloseStocktakeHistory').onclick = () => modal.remove();

            modal.querySelectorAll('.st-hist-apply').forEach(cb => {
                cb.onchange = () => {
                    const targetId = cb.getAttribute('data-apply-id');
                    setStocktakeSessionChecked(targetId, cb.checked, false);
                    openStocktakeHistoryModal();
                };
            });

            modal.querySelectorAll('.st-hist-view').forEach(btn => {
                btn.onclick = () => {
                    const id = btn.getAttribute('data-view-id');
                    modal.remove();
                    openStocktakeResultModal(id);
                };
            });
        }

        function initStocktakeFeature() {
            updateStocktakeBadges();
            fetchStocktakeSessionsFromSheet();
        }
    </script>
</body>
</html>
